<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンガ版 第一章　風の音のする国 - 空の狐と地上のウサギ | クリプト忍者のウカ</title>
<meta name="description" content="長編小説『空の狐と地上のウサギ』第一章のマンガ版。右から左へ読む日本式漫画リーダー。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: #17100d;
    color: #e8dcc6;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- ヘッダー ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.55rem 1rem;
    background: linear-gradient(170deg, #4a140e, #942a1b);
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    flex-wrap: wrap;
  }
  .bar a { color: #f0c072; text-decoration: none; }
  .bar a:hover { text-decoration: underline; }
  .bar .title { color: #f4e3c6; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: #f0c072;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(240,192,114,0.5);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    cursor: pointer;
  }
  .bar button:hover { background: rgba(0,0,0,0.4); }

  /* ---------- ビューア ---------- */
  .viewer {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page-view {
    max-width: 100%;
    max-height: 100%;
    position: relative;
  }
  .page-view img.spread {
    display: block;
    max-width: 100vw;
    max-height: calc(100vh - 6.2rem);
    object-fit: contain;
  }
  /* 単ページ(見開きの半分)表示 */
  .half-wrap {
    position: relative;
    overflow: hidden;
    height: calc(100vh - 6.2rem);
    aspect-ratio: 512 / 590; /* 見開き(1024x590)の半分 */
    max-width: 100vw;
  }
  .half-wrap img {
    position: absolute;
    top: 0;
    height: 100%;
    width: 200%;
  }
  .half-wrap.right img { left: -100%; }
  .half-wrap.left img { left: 0; }

  .placeholder {
    width: min(90vw, 46rem);
    height: min(60vh, 30rem);
    border: 1px dashed rgba(240,192,114,0.5);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    align-items: center;
    justify-content: center;
    color: #b3a189;
    letter-spacing: 0.15em;
    text-align: center;
    padding: 1rem;
  }

  /* クリックゾーン(左=進む/右=戻る) */
  .zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34%;
    cursor: pointer;
    z-index: 5;
  }
  .zone.next { left: 0; }
  .zone.prev { right: 0; }
  .zone span {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
    color: rgba(240,192,114,0);
    transition: color 0.2s ease;
  }
  .zone.next span { left: 0.6rem; }
  .zone.prev span { right: 0.6rem; }
  .zone:hover span { color: rgba(240,192,114,0.85); }

  /* ---------- フッター ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    padding: 0.5rem 1rem 0.7rem;
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    color: #b3a189;
  }
  .foot .hint { font-size: 0.72rem; color: #7d6c58; }
  @media (max-width: 600px) {
    .foot .hint { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <a href="../index.html#novels">&laquo; サイトへ</a>
  <span class="title">マンガ版『空の狐と地上のウサギ』第一章　風の音のする国</span>
  <button type="button" id="modeBtn">単ページ</button>
</header>

<div class="viewer" id="viewer">
  <div class="zone next" id="zoneNext" title="次へ(左)"><span>&#10094;</span></div>
  <div class="zone prev" id="zonePrev" title="前へ(右)"><span>&#10095;</span></div>
  <div class="page-view" id="pageView"></div>
</div>

<footer class="foot">
  <span id="pageInfo">- / -</span>
  <span class="hint">右から左へ読みます ｜ 左クリック・←キー・左スワイプで次のページ</span>
</footer>

<script>
(function () {
  "use strict";
  /* 見開き画像(右ページ+左ページが1枚になった横長画像)を、番号順に列挙 */
  var SPREADS = [
    "img/ch01/spread01.jpg",
    "img/ch01/spread02.jpg",
    "img/ch01/spread03.jpg",
    "img/ch01/spread04.jpg",
    "img/ch01/spread05.jpg",
    "img/ch01/spread06.jpg",
    "img/ch01/spread07.jpg",
    "img/ch01/spread08.jpg",
    "img/ch01/spread09.jpg",
    "img/ch01/spread10.jpg"
  ];

  var viewer = document.getElementById("viewer");
  var view = document.getElementById("pageView");
  var info = document.getElementById("pageInfo");
  var modeBtn = document.getElementById("modeBtn");

  /* mode: "spread"=見開き / "single"=単ページ(右半分→左半分の順) */
  var mode = window.innerWidth > window.innerHeight ? "spread" : "single";
  var idx = 0; /* 現在位置(モードごとの単位) */

  function pageCount() {
    return mode === "spread" ? SPREADS.length : SPREADS.length * 2;
  }

  function render() {
    view.innerHTML = "";
    var el;
    if (mode === "spread") {
      el = document.createElement("img");
      el.className = "spread";
      el.src = SPREADS[idx];
      el.alt = "第" + (idx + 1) + "見開き";
      el.onerror = function () { view.innerHTML = ""; view.appendChild(placeholder(idx + 1)); };
      view.appendChild(el);
      info.textContent = "見開き " + (idx + 1) + " / " + SPREADS.length;
    } else {
      var s = Math.floor(idx / 2);
      var half = idx % 2 === 0 ? "right" : "left"; /* 右ページが先 */
      var wrap = document.createElement("div");
      wrap.className = "half-wrap " + half;
      var img = document.createElement("img");
      img.src = SPREADS[s];
      img.alt = "ページ " + (idx + 1);
      img.onerror = function () { view.innerHTML = ""; view.appendChild(placeholder(idx + 1)); };
      wrap.appendChild(img);
      view.appendChild(wrap);
      info.textContent = "ページ " + (idx + 1) + " / " + pageCount();
    }
    modeBtn.textContent = mode === "spread" ? "単ページ" : "見開き";
    /* 次の見開きを先読み */
    var nextSpread = mode === "spread" ? idx + 1 : Math.floor(idx / 2) + 1;
    if (nextSpread < SPREADS.length) { (new Image()).src = SPREADS[nextSpread]; }
  }

  function placeholder(n) {
    var d = document.createElement("div");
    d.className = "placeholder";
    d.innerHTML = "<strong>ページ " + n + "</strong>" +
      "<span>画像がまだアップロードされていません</span>" +
      "<span style='font-size:0.75rem'>manga/img/ch01/ に spread01.jpg〜spread" +
      String(SPREADS.length).padStart(2, "0") + ".jpg を配置してください</span>";
    return d;
  }

  function go(delta) {
    var n = idx + delta;
    if (n < 0 || n >= pageCount()) return;
    idx = n;
    render();
  }

  /* モード切替(位置を換算して維持) */
  modeBtn.addEventListener("click", function () {
    if (mode === "spread") { mode = "single"; idx = idx * 2; }
    else { mode = "spread"; idx = Math.floor(idx / 2); }
    render();
  });

  /* 進む=左 / 戻る=右 (右綴じ) */
  document.getElementById("zoneNext").addEventListener("click", function () { go(1); });
  document.getElementById("zonePrev").addEventListener("click", function () { go(-1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") go(1);
    if (e.key === "ArrowRight") go(-1);
  });

  /* スワイプ: 左へ払う=次 */
  var touchX = null;
  viewer.addEventListener("touchstart", function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (dx < -40) go(1);
    if (dx > 40) go(-1);
    touchX = null;
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
