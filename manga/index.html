<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンガ版『空の狐と地上のウサギ』 | クリプト忍者のウカ</title>
<meta name="description" content="長編小説『空の狐と地上のウサギ』のマンガ版。右から左へ読む日本式漫画リーダー。章をまたいで続けて読めます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  @supports (height: 100dvh) {
    body { height: 100dvh; }
  }
  body {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: #17100d;
    color: #e8dcc6;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- ヘッダー ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.55rem 1rem;
    background: linear-gradient(170deg, #4a140e, #942a1b);
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    flex-wrap: wrap;
  }
  .bar a { color: #f0c072; text-decoration: none; white-space: nowrap; }
  .bar a:hover { text-decoration: underline; }
  .bar .title { color: #f4e3c6; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button, .bar select {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: #f0c072;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(240,192,114,0.5);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    cursor: pointer;
  }
  .bar select { max-width: 11rem; }
  .bar button:hover, .bar select:hover { background: rgba(0,0,0,0.4); }

  /* ---------- ビューア ---------- */
  .viewer {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem;
  }
  .page-view {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .page-view img.spread {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .half-wrap {
    position: relative;
    overflow: hidden;
    height: 100%;
    max-height: 100%;
    aspect-ratio: 512 / 590;
    max-width: 100%;
  }
  .half-wrap img {
    position: absolute;
    top: 0;
    height: 100%;
    width: 200%;
  }
  .half-wrap.right img { left: -100%; }
  .half-wrap.left img { left: 0; }

  /* 章表紙(img/chNN/cover.jpg があれば、とびらの代わりに表示) */
  .page-view img.cover {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.55);
    border: 1px solid rgba(240,192,114,0.25);
  }

  /* 章とびら・巻末カード */
  .card {
    width: min(88vw, 34rem);
    max-height: 100%;
    border: 1px solid rgba(240,192,114,0.4);
    border-radius: 14px;
    background: linear-gradient(160deg, #35100a, #6d2114 60%, #8f2f1c);
    box-shadow: 0 14px 34px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.6rem;
  }
  .card .work { font-size: 0.8rem; letter-spacing: 0.3em; color: #f0c072; }
  .card .ch { font-size: clamp(1.3rem, 4.5vw, 1.9rem); letter-spacing: 0.15em; color: #faf0dc; font-weight: 600; }
  .card .sub { font-size: 0.85rem; letter-spacing: 0.15em; color: #d8b98e; }
  .card a.btn, .card button.btn {
    font-family: inherit;
    font-size: 0.88rem;
    letter-spacing: 0.15em;
    color: #4a140e;
    background: #f0c072;
    border: none;
    border-radius: 999px;
    padding: 0.55rem 1.6rem;
    cursor: pointer;
    text-decoration: none;
  }
  .card a.ghost {
    color: #f0c072;
    background: transparent;
    border: 1px solid rgba(240,192,114,0.55);
  }

  .placeholder {
    width: min(90vw, 46rem);
    height: min(60vh, 30rem);
    border: 1px dashed rgba(240,192,114,0.5);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    align-items: center;
    justify-content: center;
    color: #b3a189;
    letter-spacing: 0.15em;
    text-align: center;
    padding: 1rem;
  }

  /* クリックゾーン(左=進む/右=戻る) */
  .zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34%;
    cursor: pointer;
    z-index: 5;
  }
  .zone.next { left: 0; }
  .zone.prev { right: 0; }
  .zone span {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
    color: rgba(240,192,114,0);
    transition: color 0.2s ease;
  }
  .zone.next span { left: 0.6rem; }
  .zone.prev span { right: 0.6rem; }
  .zone:hover span { color: rgba(240,192,114,0.85); }

  /* ---------- フッター ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    padding: 0.5rem 1rem 0.7rem;
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    color: #b3a189;
  }
  .foot .hint { font-size: 0.72rem; color: #7d6c58; }
  @media (max-width: 600px) {
    .foot .hint { display: none; }
    .bar .title { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <a href="../index.html#novels">&laquo; サイトへ</a>
  <span class="title">マンガ版『空の狐と地上のウサギ』</span>
  <select id="chapterSel" title="章を選ぶ"></select>
  <button type="button" id="modeBtn">単ページ</button>
</header>

<div class="viewer" id="viewer">
  <div class="zone next" id="zoneNext" title="次へ(左)"><span>&#10094;</span></div>
  <div class="zone prev" id="zonePrev" title="前へ(右)"><span>&#10095;</span></div>
  <div class="page-view" id="pageView"></div>
</div>

<footer class="foot">
  <span id="pageInfo">- / -</span>
  <span class="hint">右から左へ読みます ｜ 左タップ・←キー・右スワイプで次のページ</span>
</footer>

<script>
(function () {
  "use strict";
  /* ---- 章の設定: 画像が揃ったら available を true に、count を枚数に ---- */
  var CHAPTERS = [
    { id: "ch01", no: "第一章", title: "風の音のする国", count: 15, available: true },
    { id: "ch02", no: "第二章", title: "数式の花嫁", count: 10, available: true },
    { id: "ch03", no: "第三章", title: "仇の名", count: 10, available: true },
    { id: "ch04", no: "第四章", title: "式典の銃声", count: 12, available: false },
    { id: "ch05", no: "第五章", title: "墜ちた狐", count: 12, available: false }
  ];
  var WORK = "空の狐と地上のウサギ";

  /* ---- ページ列を組み立てる(見開き単位) ----
     type: "title"=章とびら / "spread"=見開き / "end"=巻末 */
  var UNITS = [];
  CHAPTERS.forEach(function (ch) {
    if (!ch.available) return;
    UNITS.push({ type: "title", ch: ch });
    for (var i = 1; i <= ch.count; i++) {
      var n = String(i).padStart(2, "0");
      UNITS.push({ type: "spread", src: "img/" + ch.id + "/spread" + n + ".jpg", ch: ch, n: i });
    }
  });
  UNITS.push({ type: "end" });

  /* 単ページ列(見開きだけ右・左に分割) */
  var SINGLES = [];
  UNITS.forEach(function (u, ui) {
    if (u.type === "spread") {
      SINGLES.push({ u: u, ui: ui, half: "right" });
      SINGLES.push({ u: u, ui: ui, half: "left" });
    } else {
      SINGLES.push({ u: u, ui: ui, half: null });
    }
  });
  var firstSingleOf = [];
  SINGLES.forEach(function (s, si) {
    if (firstSingleOf[s.ui] === undefined) firstSingleOf[s.ui] = si;
  });

  var viewer = document.getElementById("viewer");
  var view = document.getElementById("pageView");
  var info = document.getElementById("pageInfo");
  var modeBtn = document.getElementById("modeBtn");
  var sel = document.getElementById("chapterSel");

  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var mode = window.innerWidth > window.innerHeight ? "spread" : "single";
  var idx = 0; /* 現在位置(モードに応じて UNITS / SINGLES の添字) */

  /* 前回の続き(見開き単位で保存) */
  var savedUi = parseInt(get("uka-manga-ui", "0"), 10);
  if (savedUi > 0 && savedUi < UNITS.length) {
    idx = mode === "spread" ? savedUi : firstSingleOf[savedUi];
  }

  function pageCount() { return mode === "spread" ? UNITS.length : SINGLES.length; }
  function currentUi() { return mode === "spread" ? idx : SINGLES[idx].ui; }

  /* 章セレクタ */
  CHAPTERS.forEach(function (ch, i) {
    var o = document.createElement("option");
    o.value = ch.id;
    o.textContent = ch.no + "　" + ch.title + (ch.available ? "" : "(近日公開)");
    o.disabled = !ch.available;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function () {
    for (var ui = 0; ui < UNITS.length; ui++) {
      var u = UNITS[ui];
      if (u.type === "title" && u.ch.id === sel.value) {
        idx = mode === "spread" ? ui : firstSingleOf[ui];
        render();
        return;
      }
    }
  });

  function makeCard(u) {
    var d = document.createElement("div");
    d.className = "card";
    if (u.type === "title") {
      d.innerHTML = '<span class="work">マンガ版『' + WORK + '』</span>' +
        '<span class="ch">' + u.ch.no + "　" + u.ch.title + '</span>' +
        '<span class="sub">全' + u.ch.count + '見開き</span>';
      var b = document.createElement("button");
      b.className = "btn";
      b.type = "button";
      b.textContent = "読みはじめる";
      b.addEventListener("click", function (e) { e.stopPropagation(); go(1); });
      d.appendChild(b);
    } else {
      var next = null;
      for (var i = 0; i < CHAPTERS.length; i++) {
        if (!CHAPTERS[i].available) { next = CHAPTERS[i]; break; }
      }
      d.innerHTML = '<span class="work">マンガ版『' + WORK + '』</span>' +
        '<span class="ch">つづく</span>' +
        '<span class="sub">' + (next ? next.no + "「" + next.title + "」は近日公開" : "続きの見開きも順次追加予定") + '</span>';
      var a = document.createElement("a");
      a.className = "btn";
      a.href = "../novels/chapter02.html";
      a.textContent = "つづきを小説で読む";
      d.appendChild(a);
      var a2 = document.createElement("a");
      a2.className = "btn ghost";
      a2.href = "../index.html#novels";
      a2.textContent = "サイトへ戻る";
      d.appendChild(a2);
    }
    return d;
  }

  function placeholder(label) {
    var d = document.createElement("div");
    d.className = "placeholder";
    d.innerHTML = "<strong>" + label + "</strong><span>画像がまだアップロードされていません</span>";
    return d;
  }

  function render() {
    view.innerHTML = "";
    var u = mode === "spread" ? UNITS[idx] : SINGLES[idx].u;
    var half = mode === "spread" ? null : SINGLES[idx].half;

    if (u.type === "title") {
      var cov = document.createElement("img");
      cov.className = "cover";
      cov.src = "img/" + u.ch.id + "/cover.jpg";
      cov.alt = u.ch.no + "　" + u.ch.title + "　表紙";
      cov.onerror = function () {
        if (cov.src.indexOf("cover.jpg") !== -1) {
          cov.src = "img/" + u.ch.id + "/cover.png"; /* PNGでも可 */
        } else {
          view.innerHTML = "";
          view.appendChild(makeCard(u));
        }
      };
      view.appendChild(cov);
      info.textContent = u.ch.no + "　表紙";
    } else if (u.type === "end") {
      view.appendChild(makeCard(u));
      info.textContent = "巻末";
    } else if (mode === "spread") {
      var el = document.createElement("img");
      el.className = "spread";
      el.src = u.src;
      el.alt = u.ch.no + " 第" + u.n + "見開き";
      el.onerror = function () { view.innerHTML = ""; view.appendChild(placeholder(u.ch.no + " 見開き" + u.n)); };
      view.appendChild(el);
      info.textContent = u.ch.no + "　見開き " + u.n + " / " + u.ch.count;
    } else {
      var wrap = document.createElement("div");
      wrap.className = "half-wrap " + half;
      var img = document.createElement("img");
      img.src = u.src;
      img.alt = u.ch.no + " " + u.n + (half === "right" ? "右" : "左");
      img.onerror = function () { view.innerHTML = ""; view.appendChild(placeholder(u.ch.no + " 見開き" + u.n)); };
      wrap.appendChild(img);
      view.appendChild(wrap);
      info.textContent = u.ch.no + "　" + (u.n * 2 - (half === "right" ? 1 : 0)) + " / " + u.ch.count * 2 + "ページ";
    }
    modeBtn.textContent = mode === "spread" ? "単ページ" : "見開き";
    sel.value = (u.ch || CHAPTERS[CHAPTERS.length - 1]).id || CHAPTERS[0].id;

    /* しおり保存と先読み */
    set("uka-manga-ui", String(currentUi()));
    var nu = currentUi() + 1;
    if (nu < UNITS.length && UNITS[nu].type === "spread") { (new Image()).src = UNITS[nu].src; }
  }

  function go(delta) {
    var n = idx + delta;
    if (n < 0 || n >= pageCount()) return;
    idx = n;
    render();
  }

  modeBtn.addEventListener("click", function () {
    var ui = currentUi();
    if (mode === "spread") { mode = "single"; idx = firstSingleOf[ui]; }
    else { mode = "spread"; idx = ui; }
    render();
  });

  document.getElementById("zoneNext").addEventListener("click", function () { go(1); });
  document.getElementById("zonePrev").addEventListener("click", function () { go(-1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") go(1);
    if (e.key === "ArrowRight") go(-1);
  });

  /* スワイプ: 右へ払う=次(右綴じ) */
  var touchX = null;
  viewer.addEventListener("touchstart", function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (dx > 40) go(1);
    if (dx < -40) go(-1);
    touchX = null;
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
