<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空の狐と地上のウサギ — SRPG</title>
<style>
  :root{
    --yoru:#151a2b;        /* 藍夜 背景 */
    --yoru2:#1d2440;
    --washi:#ece3d0;       /* 羊皮紙 盤面 */
    --moji:#e8e2d2;
    --moji-dim:#9aa0b4;
    --akane:#c9502e;       /* 茜 空の国/敵 */
    --akane-b:#ef7a54;
    --ai:#3d6489;          /* 藍 連邦/自軍 */
    --ai-b:#6da3d4;
    --kin:#d9a93f;         /* 金 風車 */
    --sui:#5fa88c;
    --line:#2b3252;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -20%, #26305a 0%, var(--yoru) 55%);
    color:var(--moji);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    min-height:100%;display:flex;flex-direction:column;align-items:center;
    padding:12px;gap:10px;overflow-x:hidden;
  }
  header{text-align:center;user-select:none;}
  header h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:26px;letter-spacing:.3em;text-indent:.3em;font-weight:700;
    background:linear-gradient(#f6efdd,#c9b98e);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{font-size:10px;color:var(--moji-dim);letter-spacing:.4em;margin-top:2px;}

  #banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
  .stageTag{
    font-family:"Hiragino Mincho ProN",serif;
    padding:4px 14px;font-size:13px;letter-spacing:.15em;font-weight:700;
    color:var(--kin);border:1px solid rgba(217,169,63,.45);background:rgba(217,169,63,.08);
  }
  .turnTag{padding:4px 14px;font-size:12.5px;letter-spacing:.1em;font-weight:700;border:1px solid var(--line);background:var(--yoru2);}
  .turnTag.me{color:var(--ai-b);border-color:var(--ai);}
  .turnTag.foe{color:var(--akane-b);border-color:var(--akane);}
  .objTag{font-size:11.5px;color:var(--moji-dim);letter-spacing:.05em;}

  #main{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
  #boardWrap{position:relative;}
  #board{
    display:grid;gap:2px;padding:9px;
    background:linear-gradient(135deg,#efe6d2,#dcd0b2);
    border:2px solid #b7a889;border-radius:3px;
    box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 0 0 1px #cabf9f;
  }
  .cell{
    width:50px;height:50px;position:relative;
    background:rgba(30,24,40,.04);
    border:1px solid rgba(60,40,20,.12);
    display:flex;align-items:center;justify-content:center;
    transition:background .1s;
  }
  .cell.t-cloud{background:repeating-linear-gradient(-10deg,rgba(255,255,255,.55) 0 4px,rgba(210,220,235,.35) 4px 10px);}
  .cell.t-rubble{background:rgba(90,70,55,.28);}
  .cell.t-field{background:rgba(110,140,80,.25);}
  .cell.t-water{background:repeating-linear-gradient(-8deg,rgba(120,170,220,.35) 0 3px,rgba(160,200,235,.25) 3px 9px);}
  .cell.t-void{background:#1d2440;border-color:#141a30;}
  .cell .tmark{position:absolute;bottom:1px;right:3px;font-size:9px;opacity:.55;pointer-events:none;}
  .cell.hl-move{background:rgba(90,140,210,.45)!important;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(90,140,210,.7);}
  .cell.hl-atk{background:rgba(220,80,50,.45)!important;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(220,80,50,.75);}
  .cell.hl-heal{background:rgba(95,168,140,.5)!important;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(95,168,140,.8);}
  .cell.goalCell{box-shadow:inset 0 0 0 3px var(--kin);}
  .cell.goalCell::after{content:"壇";position:absolute;top:1px;left:3px;font-size:10px;color:#8a6a1c;font-weight:700;}

  .unit{
    width:44px;height:44px;position:absolute;z-index:5;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    cursor:pointer;transition:transform .18s, left .22s, top .22s;
    font-size:20px;line-height:1;user-select:none;
  }
  .unit.done{filter:grayscale(.85) brightness(.75);}
  .unit.sel{transform:scale(1.12);z-index:8;}
  .unit{overflow:visible;}
  .unit .tokSvg{width:118%;height:118%;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));}
  .unit.sel .tokSvg{filter:drop-shadow(0 0 6px #ffe9a0) drop-shadow(0 3px 4px rgba(0,0,0,.35));}
  .unit .nm{position:absolute;top:-14px;font-size:9px;font-weight:700;color:#2c2620;background:rgba(240,232,214,.9);padding:0 4px;border-radius:2px;white-space:nowrap;}
  .unit .hpbar{position:absolute;bottom:-7px;width:38px;height:5px;background:#3a3428;border-radius:3px;overflow:hidden;}
  .unit .hpbar i{display:block;height:100%;background:linear-gradient(#7ec06a,#4e9440);transition:width .25s;}
  .unit.foe .hpbar i{background:linear-gradient(#ef8a64,#c9502e);}
  .unit.npc .hpbar i{background:linear-gradient(#ecd27c,#d9a93f);}

  .dmgPop{
    position:absolute;z-index:20;font-weight:900;font-size:17px;color:#fff;
    text-shadow:0 0 5px #c9502e,0 2px 3px rgba(0,0,0,.6);pointer-events:none;
    animation:pop .8s forwards;
  }
  .dmgPop.heal{text-shadow:0 0 5px #4e9440,0 2px 3px rgba(0,0,0,.6);}
  .dmgPop.miss{color:#cfd6e6;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:14px;}
  @keyframes pop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-26px);opacity:0;}}
  @keyframes shakeB{0%,100%{transform:translate(0,0);}25%{transform:translate(3px,-2px);}50%{transform:translate(-3px,2px);}75%{transform:translate(2px,2px);}}
  .shaking{animation:shakeB .25s;}

  #side{width:250px;display:flex;flex-direction:column;gap:10px;}
  .panel{background:var(--yoru2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .panel h3{font-size:11px;letter-spacing:.25em;color:var(--kin);font-family:"Hiragino Mincho ProN",serif;margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:4px;}
  #uinfo{font-size:12px;line-height:1.75;min-height:96px;}
  #uinfo .big{font-size:14px;font-weight:700;}
  #uinfo .st{display:inline-block;margin-right:10px;color:var(--moji-dim);}
  #uinfo .st b{color:var(--moji);}
  #log{font-size:11px;line-height:1.7;height:150px;overflow-y:auto;color:var(--moji-dim);}
  #log .me{color:var(--ai-b);} #log .foe{color:var(--akane-b);} #log .sys{color:var(--kin);}
  #btns{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;
    padding:8px 14px;border-radius:3px;border:1px solid var(--line);
    background:#242b4c;color:var(--moji);cursor:pointer;
  }
  button:hover{background:#2e376033;border-color:#3d4a80;background:#2e3760;}
  button.gold{border-color:rgba(217,169,63,.6);color:var(--kin);}
  button:disabled{opacity:.4;cursor:default;}

  /* 行動メニュー */
  #actMenu{
    position:absolute;z-index:30;display:none;flex-direction:column;gap:4px;
    background:rgba(20,24,44,.96);border:1px solid var(--kin);border-radius:4px;padding:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  #actMenu button{padding:6px 18px;font-size:12px;}

  /* 会話ウィンドウ */
  #dlg{
    position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
    justify-content:center;padding:12px;
    background:linear-gradient(transparent,rgba(10,12,24,.85) 40%);
  }
  #dlgBox{
    width:min(760px,100%);display:flex;gap:12px;align-items:flex-end;
    background:rgba(21,26,48,.97);border:1px solid #3d4a80;border-radius:6px;
    padding:12px;cursor:pointer;box-shadow:0 -6px 30px rgba(0,0,0,.5);
  }
  #dlgFace{
    width:88px;height:88px;flex:0 0 88px;border-radius:4px;overflow:hidden;
    border:2px solid var(--kin);background:#0e1122;
    display:flex;align-items:center;justify-content:center;
  }
  #dlgFace img{width:100%;height:100%;object-fit:cover;display:block;}
  #dlgFace svg{width:100%;height:100%;}
  #dlgMain{flex:1;min-height:88px;display:flex;flex-direction:column;}
  #dlgName{
    font-family:"Hiragino Mincho ProN",serif;font-size:13px;font-weight:700;
    letter-spacing:.15em;color:var(--kin);margin-bottom:5px;
  }
  #dlgText{font-size:13.5px;line-height:1.9;}
  #dlgAutoBtn{
    position:absolute;top:-34px;right:0;padding:5px 12px;font-size:11px;
    background:rgba(21,26,48,.95);border:1px solid #3d4a80;
  }
  #dlgAutoBtn.on{border-color:rgba(217,169,63,.7);color:var(--kin);}
  #dlgBox{position:relative;}
  #dlgNext{align-self:flex-end;font-size:10px;color:var(--moji-dim);animation:blinkA 1.2s infinite;}
  @keyframes blinkA{0%,100%{opacity:.9;}50%{opacity:.2;}}

  /* 章扉・キャラ紹介・全画面オーバーレイ */
  .ov{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:#0d1020;cursor:pointer;flex-direction:column;
  }
  .ov svg{max-width:min(94vw,760px);max-height:78vh;display:block;}
  .ov .ovHint{margin-top:10px;font-size:11px;color:var(--moji-dim);letter-spacing:.3em;animation:blinkA 1.6s infinite;}

  #introOv{
    position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;gap:26px;
    background:rgba(10,12,24,.94);cursor:pointer;padding:20px;flex-wrap:wrap;
  }
  #introOv img{
    height:min(70vh,520px);border:2px solid var(--kin);border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
  }
  #introTxt{max-width:330px;}
  #introTxt .role{font-size:11px;letter-spacing:.4em;color:var(--kin);margin-bottom:8px;}
  #introTxt h2{font-family:"Hiragino Mincho ProN",serif;font-size:30px;letter-spacing:.2em;margin-bottom:4px;}
  #introTxt .yomi{font-size:11px;color:var(--moji-dim);letter-spacing:.3em;margin-bottom:14px;}
  #introTxt p{font-size:13px;line-height:2;color:var(--moji);}
  #introTxt .hint{margin-top:16px;font-size:10px;color:var(--moji-dim);letter-spacing:.3em;animation:blinkA 1.6s infinite;}

  #title.ov{display:flex;background:radial-gradient(ellipse at 50% 30%, #223060 0%, #0d1020 70%);}
  #startBtn{
    margin-top:22px;padding:14px 60px;font-size:16px;letter-spacing:.35em;text-indent:.35em;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;
    color:var(--kin);background:rgba(217,169,63,.1);
    border:1.5px solid rgba(217,169,63,.65);border-radius:3px;cursor:pointer;
    box-shadow:0 0 24px rgba(217,169,63,.15), inset 0 0 12px rgba(217,169,63,.06);
    transition:background .15s, box-shadow .15s, transform .1s;
  }
  #startBtn:hover{background:rgba(217,169,63,.22);box-shadow:0 0 34px rgba(217,169,63,.3);}
  #startBtn:active{transform:scale(.97);}
  #endOv .msg{font-family:"Hiragino Mincho ProN",serif;font-size:30px;letter-spacing:.3em;color:var(--kin);margin-bottom:14px;}
  #endOv p{color:var(--moji-dim);font-size:13px;margin-bottom:18px;}
  @media (max-width:720px){ #side{width:100%;} .cell{width:38px;height:38px;} .unit{width:34px;height:34px;font-size:15px;} .unit .hpbar{width:30px;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<header>
  <h1>空の狐と地上のウサギ</h1>
  <div class="sub">— 風車の降りる日まで —</div>
</header>

<div id="banner">
  <span class="stageTag" id="stageTag">序幕</span>
  <span class="turnTag me" id="turnTag">—</span>
  <span class="objTag" id="objTag"></span>
</div>

<div id="main">
  <div id="boardWrap">
    <div id="board"></div>
    <div id="actMenu"></div>
  </div>
  <div id="side">
    <div class="panel"><h3>ユニット情報</h3><div id="uinfo">ユニットを選択してください。</div></div>
    <div class="panel"><h3>戦況記録</h3><div id="log"></div></div>
    <div class="panel" id="btnPanel"><div id="btns">
      <button id="storyAutoBtn">物語オート: OFF</button>
      <button id="autoBtn">戦闘オート: OFF</button>
      <button id="endTurnBtn" class="gold">ターン終了</button>
      <button id="restartBtn">この戦闘をやり直す</button>
    </div></div>
  </div>
</div>

<!-- 会話 -->
<div id="dlg"><div id="dlgBox">
  <button id="dlgAutoBtn" title="物語の自動送り">▶ オート: OFF</button>
  <div id="dlgFace"></div>
  <div id="dlgMain">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgNext">▼ クリックで進む</div>
  </div>
</div></div>

<!-- 章扉 -->
<div class="ov" id="plateOv"><div id="plateArt"></div><div class="ovHint">クリックで進む</div></div>

<!-- キャラ紹介 -->
<div id="introOv">
  <img id="introImg" alt="">
  <div id="introTxt">
    <div class="role" id="introRole"></div>
    <h2 id="introName"></h2>
    <div class="yomi" id="introYomi"></div>
    <p id="introDesc"></p>
    <div class="hint">クリックで進む</div>
  </div>
</div>

<!-- イベントシーン(一枚絵) -->
<div class="ov" id="sceneOv" style="background:rgba(8,10,20,.96);">
  <img id="sceneImg" alt="" style="max-height:82vh;max-width:94vw;border:2px solid var(--kin);border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.8);">
  <div class="ovHint">クリックで進む</div>
</div>

<!-- タイトル -->
<div class="ov" id="title" style="cursor:default;"><div id="titleArt"></div>
  <button id="startBtn">スタートする</button>
</div>

<!-- 勝敗 -->
<div class="ov" id="endOv" style="flex-direction:column;">
  <div class="msg" id="endMsg"></div>
  <p id="endSub"></p>
  <button id="endBtn" class="gold">つづける</button>
</div>

/* ---------- 搭乗機コンポーズ(キャラを機体後方に描き、胴体で下半身を隠す) ---------- */
function mountPlane(charKey, body, accent, doodle){
  const P='#201a14';
  return '<g transform="translate(102 14) scale(0.7)">'+TOKEN_SVG[charKey]+'</g>'
    /* 尾翼(左) */
    +'<path d="M100 392 L42 314 L18 340 L66 410 Z" fill="'+body+'" stroke="'+P+'" stroke-width="9" stroke-linejoin="round"/>'
    /* 胴体 */
    +'<path d="M74 402 Q92 350 210 346 L468 346 Q556 350 604 392 L616 404 Q556 452 306 458 Q146 458 88 430 Q62 416 74 402 Z" fill="'+body+'" stroke="'+P+'" stroke-width="10" stroke-linejoin="round"/>'
    /* 風防(操縦席の前) */
    +'<path d="M412 346 L452 304 L468 318 L436 348 Z" fill="#c8dff0" stroke="'+P+'" stroke-width="7" stroke-linejoin="round"/>'
    /* 主翼(下) + 支柱 */
    +'<path d="M148 472 L556 472 L534 512 L172 512 Z" fill="'+body+'" stroke="'+P+'" stroke-width="9" stroke-linejoin="round"/>'
    +'<path d="M220 456 L228 474 M470 452 L462 472" stroke="'+P+'" stroke-width="8" stroke-linecap="round"/>'
    /* 機首プロペラ(右) */
    +'<circle cx="620" cy="402" r="20" fill="#55575f" stroke="'+P+'" stroke-width="8"/>'
    +'<path d="M620 356 v92 M574 402 h92" stroke="#3a3c44" stroke-width="10" stroke-linecap="round" transform="rotate(40 620 402)"/>'
    /* 差し色ライン */
    +'<path d="M120 430 Q300 452 560 416" fill="none" stroke="'+accent+'" stroke-width="9" stroke-linecap="round"/>'
    /* 機体の落書き */
    +doodle;
}

/* ---------- 章扉SVG(未実装ビジュアルの補完) ---------- */
function windmill(cx,cy,r,spin,hub='#d9a93f'){
  const blades=[...Array(9)].map((_,i)=>`<path d="M0 ${-r*0.14} L ${r*0.09} ${-r} L ${-r*0.09} ${-r} Z" fill="#e9dfc6" stroke="#141826" stroke-width="${r*0.02}" transform="rotate(${i*40})"/>`).join('');
  return `<g transform="translate(${cx} ${cy})">
    <g ${spin?`style="animation:wspin 26s linear infinite"`:''}>${blades}</g>
    <circle r="${r*0.12}" fill="${hub}" stroke="#141826" stroke-width="${r*0.02}"/>
  </g>`;
}

    D('n',null,'光は雲海を貫き、編隊の遥か横を通過し——国に、届いた。第三甲板、椿区画。ウカの故郷。学校が、整備場が、姉のいる風車座の詰所が、環から離れて、燃えながら、雲の下へ落ちていく。'),
    D('uka','sad','うそだ。届かないはずだ。……なら、あれは、何。誰が、届かせた。'),
    D('n',null,'ウカは帰投命令を無視して落下点へ降りた。生存者を探した。三度目の旋回で燃料警告が鳴り、機首を引き起こしたその耳に——地上の勝利放送が、混線して飛び込んできた。'),
    D('n',null,'『——本日、我らが連邦の英雄、ガレン・ハーヴェイ将官の指揮により、〈月ノ塔〉は空の圧制者に歴史的一撃を——』'),
    D('uka','angry','ガレン・ハーヴェイ。'),
    D('n',null,'口の中で一度だけ転がしたその名は、焼けた鉄の味がした。ウカは泣かなかった。泣く代わりに、覚えた。'),
  ]},
  {intro:'oto'},
  {dlg:[
    D('n',null,'同じ頃、遥か地上。大兎連邦の名家ハーヴェイ邸。オトの世界は、書斎の窓の大きさをしていた。空は、窓の上端に細長く見える。'),
    D('garen',null,'オト。また徹夜したのか。……何日ぶりの睡眠だった。'),
    D('oto','worried','に、二日ぶり……。'),
    D('garen',null,'三日だろう。使用人に聞いた。——今日は何を解いていた。'),
    D('oto','smile','風です。先日くださった問題の続きを勝手に。高高度の恒常風の中を、質量のあるものが長い距離を飛ぶとき、風はそれをどう曲げるか。皆さま風を「邪魔なもの」として引き算なさるでしょう。でも違うんです。あの高さの風は定常流ですから——邪魔ではなくて、道なんです。'),
    D('n',null,'夫の顔が、ほんの一瞬、見たことのない色をした。誇らしさと、痛みが、同じ場所に浮かんだような色。'),
    D('garen',null,'……いや。君の答えは美しいと思っただけだ。オト、ひとつ約束してくれ。もし私に何かあっても——君は、君の数式を憎まないでくれ。'),
    D('oto','laugh','数式を憎む? そんなことができる人間が、この世にいますの? 数式は嘘をつきません。この世でいちばん、人を裏切らないものですのに。変なガレン様。'),
    D('n',null,'オトはその笑顔を、後に千度も思い返すことになる。あれは何かを告げようとして、告げ損ねた人の顔だったと、千度目に気づくことになる。'),
    D('n',null,'二月後の朝、鐘が鳴った。警鐘ではない。祝祭の鐘。「勝ったのです、奥様! 旦那様の砲が、空に届いたのです!」'),
    D('n',null,'街は沸き立った。八百屋のおかみは涙ぐんで彼女の手を握った。——奥様、旦那様は、わたしらの仇を取ってくだすった。うちの人は七年前の徴収で。うちの息子は、爆撃で。'),
    D('oto','worried','(仇……。仇を取るということは。つまり、誰かが——)'),
    D('n',null,'その考えを、彼女は頭の隅にそっと押しやった。測れないものについて考えるのは、いつだって、また今度でいいのだ。'),
    D('n',null,'一週間後、英雄は帰ってきた。痩せていた。強く抱くのに、どこか、赦しを乞うような抱き方だった。その夜、暗闇の中で夫の手を探して握ると、溺れる者のような強さで、握り返してきた。'),
    D('garen',null,'オト。君の数式は、美しい。……それだけは、何があっても、本当だ。'),
    D('n',null,'窓の外、細長い夜空を、遅すぎる流れ星がひとつ横切った。それが墜ちた区画の残骸——誰かの暮らしだったものが夜ごと大気に焼かれる光だと、オトはまだ知らない。生涯で最後の、何も知らない夜だった。'),
  ]},
  {plate:'act2'},
  {dlg:[
    D('n',null,'合同葬儀に、棺はなかった。代わりに九百枚の白い紙風車が甲板に並び、風が吹くたび、いっせいに乾いた音を立てた。ひとつが、確認された死者ひとり。'),
    D('n',null,'姉イヅナの風車は、なかった。死者の列にも、生存者の席にも。落下した区画の捜索は「地上勢力圏内のため実施不能」——たった一行で、打ち切られていた。'),
    D('uka','angry','実施不能。……国は「取り戻す」とは、誰も言わないんだ。九百の紙風車ごと、過去を風に流して。'),
    D('n',null,'式の後、ウカは人事局に願書を叩きつけた。前線配置転換願。志望、対地攻撃隊。動機の欄は、空白のまま。'),
    D('shinra',null,'馬鹿の顔をしてるな、ウカ。復讐する奴の顔は二種類ある。氷の顔と、馬鹿の顔だ。誰を、どうやって、どこで。何も決まってないのに、心臓だけが先に走ってる。'),
    D('uka','angry','決まってる。ガレン・ハーヴェイ。月ノ塔の指揮官。'),
    D('shinra',null,'来い。見せたいものがある。——椿に刺さってた砲弾の破片だ。見ろ、この外殻。単一の鋳造じゃない。何十枚もの鋼板の鍛接。上等な層と、農具を潰したような屑鉄の層が混ざってる。'),
    D('uka','normal','……粗悪品ってこと?'),
    D('shinra',null,'逆だ。でかい鋳造炉がないから鍛接した。いい鋼が足りないから屑鉄を混ぜた。つまり連中は、俺たちの技術院なら「実現不能」と一蹴する条件で——それでも作りやがったんだ。何十年もかけて。一枚一枚。'),
    D('shinra',null,'技術ってのはな、高い低いで勝ち負けが決まるんじゃない。何のために、どれだけ本気か、で決まる。……お前が殺しに行く男は、この執念の地層のいちばん上に立ってた男だ。憎むのは勝手だが、軽く見るな。軽く見た側から、墜ちる。'),
    D('n',null,'——同じ頃、連邦の首都。ガレン・ハーヴェイはこの二月、十七回、妻に真実を告げようとして、十七回、失敗していた。言葉は毎回、喉の同じ場所で死んだ。'),
    D('garen',null,'(彼女の世界で、数式はこの世でいちばん人を裏切らないものなのだ。その信仰ごと娶ったのは自分だ。その信仰を戦争に売ったのも、自分だ。)'),
    D('shion',null,'将官殿。お時間です。——本日は奥方もお見えとか。連邦中の新聞が、英雄夫妻の写真を欲しがっておりますぞ。'),
    D('garen',null,'(式典が終わったら、辞表を出す。これ以上、妻の数式を「知人の問題」に変換する仕事から降りる。降りて、それから、時間をかけて、いつか、告げる。何年かかっても。)'),
    D('roton',null,'——見ろよ、この移動線。宣伝ってのは居場所を教える術のことらしいな。英雄サマの次の視察先は第四要塞。式典は屋外、対空砲の傘のぎりぎり端だ。'),
    D('shinra',null,'復讐も機械と同じだ。果たした後のお前は、果たしたときの本音でできてる。憎しみだけで引き金を引けば、憎しみだけの人間ができ上がる。……あとは空の上で、お前が決めろ。生きて戻れ、ウカ。直す機体がなくなると、俺は暇なんだ。'),
  ]},
  {battle:1},
  {dlg:[
    D('n',null,'来賓席のオトは、少し途方に暮れていた。人が、多すぎる。それでも、来てよかった、と思った。壇上の夫は、遠目にも堂々として、美しかった。'),
    D('oto','smile','(あら、いやだわ。お祝いの席で……北北西の空域の火網が、薄い、なんて。)'),
    D('n',null,'壇上で、夫が敬礼した。夫の目が群衆を渡って彼女を見つけ、あの不器用な笑い方をした。オトも笑い返した。膝の上で、指先だけ小さく振った。——警報が鳴ったのは、その時だった。'),
    D('n',null,'照準環の中で、その男は逃げなかった。副官たちを壇から突き飛ばすように払いのけ、たった一人で、壇の中央に立った。まるで、的であることを引き受けるように。'),
    D('uka','angry','(撃てる。撃つために来た。姉さん。椿の九百の風車。焼けた鉄の味。——なのに、なんで、あんたは避けない。)'),
    D('n',null,'機銃は正確だった。シンラの機械は、いつだって正直に、撃った通りに当たるのだった。壇上の男は、最後まで避けなかった。'),
    D('n',null,'オトは人波に逆らって、壇へ走った。淑女の作法が、生まれて初めて、一枚残らず彼女から剥がれ落ちた。'),
    D('oto','sad','ガレン様! しゃべらないで。衛生兵が。いま衛生兵が来ますから。'),
    D('garen',null,'オト。……約束を。君の数式を……憎まないで、くれ。'),
    D('oto','sad','何を仰って——いやです、そんな約束より、生きて。ねえ、生きてくださいませ。わたくし、まだ何も——あなたに、何も。'),
    D('n',null,'ガレンの手が胸元を探った。オトは懐中時計を取り出し、夫の手に握らせた。夫は首を小さく振り、それを彼女の手のほうへ押し戻した。裏蓋の中で、振り子が揺れていた。衝撃にも、銃声にも乱されない周期で、正確に、正直に。'),
    D('garen',null,'……美しい、な。'),
    D('n',null,'それが最後の言葉だった。何が美しいのか——振り子か、数式か、彼女か、それとも彼が降りようとして降りられなかった何かか——を確かめる時間は、もう、与えられなかった。'),
    D('n',null,'上空で機体を引き起こしながら、ウカは一度だけ下を見た。壇の上に、倒れた影と、それに縋る小さな影。仇は、討った。——なのに、晴れも、軽さも、悲しみですらも、なかった。'),
    D('uka','sad','(的は、消えた。憎しみは、消えなかった。……あたしはたった今、自分がどんな人間でできてしまったのか、分からないままの人間に、なったんだ。)'),
    D('n',null,'その日オトは、生まれて初めて、憎むための名前を欲した。夫を撃った機体の識別章を——機首の部隊章の隣に描かれた、小さな風車の落書きまで——彼女の目は、群衆の誰よりも正確に、記憶してしまっていた。'),
  ]},
  {dlg:[
    D('n',null,'ウカが撃墜されたのは、その四十日後。彼女はその四十日を、ほとんど眠らずに飛んだ。飛んでいる間だけ、考えずに済んだからだ。壇上で避けなかった男の目のことを。'),
    D('shinra',null,'休め、ウカ。機械より先に、お前が折れる。'),
    D('uka','angry','うるさい。飛べる機体があるなら回して。……あんたに、何が分かる。'),
    D('shinra',null,'分からんさ。俺の家族は無事で、お前の姉さんは行方知れずだ。分からんから——せめて機体だけは、嘘をつかないように整備してる。落ちるなよ。'),
    D('n',null,'だがその日、東部渓谷の対空砲火は、疲労で0.5秒遅れた回避を見逃さなかった。左翼に被弾。ウカは僚機に離脱を告げ、誰も見ていない渓谷の奥へ機首を向けた。せめて機体は敵に渡すまい。シンラの機械を。'),
    D('n',null,'目を覚ました時、最初に分かったのは、土の匂いだった。空の国に、土の匂いはない。そして——寝台の脇から、まん丸の目がこちらを覗き込んでいた。'),
    D('kon',null,'……ほんとに狐だ! 耳、さわっていい? だめ? じゃあ尻尾は?'),
    D('uka','angry','触るな。ここは、どこ。あんたは、誰。'),
    D('kon',null,'コン! ここはね、第七十三地区捕虜収容所……のはじっこの、医務室のはじっこ。あたしのおうちの隣!'),
    D('n',null,'コンは毎日来た。捕虜と口をきくなと祖父に叱られても、翌日には来た。質問は無尽蔵だった。雲の上って寒いの。風車ってどのくらい大きいの。ねえ——空から見たら、あたしたちの国って、どんなふう?'),
    D('uka','sad','……穴ぼこだらけで、汚い土地だと、教わってた。'),
    D('kon',null,'むー。じゃあ先生が教えたげる。ついといで! ——ここのお水はね、三回使うの。飲むでしょ、洗うでしょ、最後がお野菜。樋の角度はガンジのおじじが決めたの。ね、汚くないでしょ。'),
    D('uka','normal','……ああ。'),
    D('n',null,'畑の縁に、石を積んだだけの素朴な祠があった。みんなのお墓の代わり。コンの父と母のぶんも、そこにあった。三年前の、空襲で。'),
    D('kon',null,'おじいが言ってた。憎んでいいのは、顔を知らない相手だけだって。顔を知っちゃったら、もう、めんどくさいんだって。あんたのこと、もう顔知っちゃったから。めんどくさいから、憎まない。'),
    D('uka','sad','(あたしがガレン・ハーヴェイを撃てたのは、名前しか知らなかったからだ。……憎しみとは、知らないでいるための、努力のことなのかもしれない。)'),
  ]},
  {dlg:[
    D('n',null,'その頃、首都のオトは喪服のまま、夜ごと書斎で一人の作業を続けていた。机の上には、記憶から起こした翼の識別章。部隊記号。機首の、小さな風車の落書き。'),
    D('oto','serious','(軍は教えてくれない。寡婦は悲しんでいればいいのだと、誰の顔にも書いてある。ならば、自分で解くまでです。)'),
    D('n',null,'英雄の寡婦の名は、あらゆる書類庫の扉を、皮肉なほど滑らかに開けた。そして四十日目の夜、一枚の報告書。——東部渓谷にて敵単座機を撃墜、搭乗員は生存、捕獲。機首に、風車の意匠。収容先、第七十三地区。'),
    D('oto','serious','……見つけた。'),
    D('n',null,'「慰問」の名目で、彼女は完璧な視察経路を引いた。その中に第七十三地区は、ごく自然な一点として組み込まれていた。数式の中に一つの意図を隠すことなど、彼女には呼吸より易しかった。'),
    D('n',null,'廊下を磨く狐の捕虜の前で、貴婦人の足音が、止まった。'),
    D('oto','normal','お怪我を、なさっているのね。'),
    D('uka','normal','……不時着の際に。もう、ほとんど。'),
    D('n',null,'角を曲がった瞬間、オトは壁に手をついた。膝が、笑っていたのだ。あの狐だ。——だが彼女は糾弾しなかった。人違いで誰かを憎むことは、彼女の精神が許容できる誤差を、超えていた。憎むためにすら、彼女は、正確でなければならなかった。'),
    D('n',null,'二度目の会話は、共同農園で生まれた。'),
    D('oto','smile','……三段目の分岐、勾配が変わっていますのね。'),
    D('uka','normal','五日前の補修で樋の材が変わったから。新しい材は内面が粗い。同じ勾配だと四段目が渇く。……見積もりは正確だと思う。ほら、分岐の水面。波が立ってない。合ってる証拠。'),
    D('oto','smile','ええ。——合っている証拠だわ。……あなた、技術科の出?'),
    D('uka','smug','輪守——風車守りの家系。国じゃ、水と風を読む家。あんたこそ、貴族のご婦人が、樋の勾配なんて。'),
    D('oto','calm','わたくしは、数が好きなの。昔から。……こういう、正直な機械が。'),
    D('n',null,'敵国の貴婦人の目としては、それは、あまりにも正しすぎる目だった。名を訊かれ、ウカは偽名を答えた。貴婦人は「オト」とだけ名乗った。姓は、名乗らなかった。'),
    D('uka','normal','オト。変わった響き。地上の名前?'),
    D('oto','smile','古い言葉で「音」ですって。祖母がよく笑っていたわ。音は目に見えないのに、いちばん正確に世界を測れるのよ、って。'),
    D('uka','normal','……いい名前だ。'),
    D('n',null,'三日目、オトは祠に花を持って行き、コンに訊いた。「この祠には、空の人のぶんも、あるのかしら」。コンは答えた。「ないけど、石ならいっぱいあるから、積めば?」。オトは、石をひとつ積んでいった。翌朝、ウカはその隣に、自分もひとつ積んだ。名目のない石だった。名目のないまま、それでも積まずにいられない、ひとつの重さだった。'),
  ]},
  {dlg:[
    D('n',null,'二十日後、オトは老いた兎をひとり連れて戻ってきた。第七十三地区の灌漑を設計した男。そして——連邦の極秘名簿の上では、〈月ノ塔〉主任設計師、ガンジ翁。'),
    D('ganji',null,'ハーヴェイの奥方。ひとつだけ訊かせてくだされ。あなたは、答えを知りたいのか。それとも、答えを否定してほしいのか。'),
    D('oto','serious','知りたいのです。たとえどんな答えでも。知らないままでいることのほうが、わたくしには、耐えられません。'),
    D('ganji',null,'……その式は、わしが受け取った。〈月ノ塔〉の初弾の最終弾道は——あなたの風の上を、飛んだ。'),
    D('n',null,'馬車の車輪の音だけが、しばらく続いた。オトは泣かなかった。ただ、インクの染みの残る自分の指を、じっと見た。この指が書いた曲線の上を、あの巨大な砲弾が飛び、雲を貫き、そして。'),
    D('ganji',null,'着弾区画は、軍の上層部が最終段階で差し替えた。将官は知らされておらなんだ。軍事区画のはずが、技術者の居住区に。……奥方、あなたは知らなかった。知らされなかった者に、罪は——'),
    D('oto','angry','おやめください。その理屈で赦されるなら、引き金を引いた兵も、命令した将も、砲を設計したあなたも、みな「全体を知らなかった」。この戦争は、知らなかった者たちの分業でできている。……わたくしだけが例外の椅子に座ることは、数として、美しくありません。'),
    D('n',null,'その夕、農園の祠の前で、二人は再会した。二十日前に積んだ二つの石は、まだ並んでいた。'),
    D('oto','normal','ねえ、狐の人。もしも——もしもの話よ。あなたの大切な人を奪ったのが、それと知らずに奪った者だったら。あなたは、その者を憎める?'),
    D('uka','sad','……あたしは、憎んだよ。もしもじゃない。あたしの話。あたしの故郷は、撃たれて墜ちた。あたしは撃った男の名前を覚えて、憎んで、憎んで——殺した。この手で。式典の壇の上で、避けもしない男を。'),
    D('n',null,'世界から、音が消えた。'),
    D('oto','sad','……そう。それで。憎しみは、終わった?'),
    D('uka','sad','終わらなかった。的が消えただけだった。撃つ前より、ひどくなった。あの男は最後まで避けなかった。まるで、撃たれる理由を自分で知ってるみたいに。……それに、壇の上に、女の人がいた。倒れた男に、縋りついてた。あたしはあの日、仇を討って、同時に、誰かをあたしと同じ人間にした。'),
    D('oto','serious','狐の人。わたくしも、あなたに、話さなければならないことがあります。——わたくしの名は、オト・ハーヴェイ。あなたが式典の壇の上で殺した、ガレン・ハーヴェイの妻です。'),
    D('uka','normal','………………。'),
    D('oto','serious','そして——あなたの故郷、第三甲板を撃った〈月ノ塔〉の初弾は、わたくしの計算した弾道の上を飛びました。知らなかったことが、罪を消すとは、考えません。あなたはわたくしの夫の仇で、わたくしは、あなたの故郷の、九百人の——'),

function log(t,cls){const d=el('div',cls||'');d.textContent=t;logEl.prepend(d);}
function setBanner(stage,turnTxt,cls,obj){
  $('#stageTag').textContent=stage;
  const t=$('#turnTag');t.textContent=turnTxt;t.className='turnTag '+(cls||'');
  $('#objTag').textContent=obj||'';
}

/* ---- シナリオ進行 ---- */
function runScript(){
  if(scriptIdx>=SCRIPT.length) return;
  const step=SCRIPT[scriptIdx++];
  if(step.plate){ showPlate(PLATES[step.plate](), runScript); }
  else if(step.intro){ showIntro(step.intro, runScript); }
  else if(step.dlg){ showDialog(step.dlg, runScript); }
  else if(step.battle!==undefined){ startBattle(step.battle); }
  else if(step.fin){ showEnd('物語は幕を閉じた','最後までプレイしていただきありがとうございました。','タイトルへ',()=>{scriptIdx=0;introShown={};$('#title').style.display='flex';}); }
}

function showPlate(svg,done){
  const ov=$('#plateOv');
  $('#plateArt').innerHTML=svg;
  ov.style.display='flex';
  ov.onclick=()=>{clearStoryTimer();ov.style.display='none';done&&done();};
  clearStoryTimer();
  if(SAUTO>0)storyTimer=setTimeout(()=>ov.click(),plateDelay());
}
function showIntro(key,done){
  if(introShown[key]){done&&done();return;}
  introShown[key]=true;
  const c=INTRO[key], ov=$('#introOv');
  $('#introImg').src=IMG.MAIN[key];
  $('#introRole').textContent=c.role;
  $('#introName').textContent=c.name;
  $('#introYomi').textContent=c.yomi;
  $('#introDesc').textContent=c.desc;
  ov.style.display='flex';
  ov.onclick=()=>{clearStoryTimer();ov.style.display='none';done&&done();};
  clearStoryTimer();
  if(SAUTO>0)storyTimer=setTimeout(()=>ov.click(),introDelay());
}
/* ---- 物語オート ---- */
let SAUTO=0;            // 0:OFF 1:オート 3:オート×3
let storyTimer=null;
function clearStoryTimer(){ if(storyTimer){clearTimeout(storyTimer);storyTimer=null;} }
function sautoLabel(){ return SAUTO===0?'▶ オート: OFF':SAUTO===1?'▶ オート: ON':'▶▶▶ オート: ×3'; }
function syncSautoUI(){
  const b1=$('#dlgAutoBtn'),b2=$('#storyAutoBtn');
  if(b1){b1.textContent=sautoLabel();b1.classList.toggle('on',SAUTO>0);}
  if(b2){b2.textContent='物語'+sautoLabel().replace('▶▶▶ ','').replace('▶ ','');b2.classList.toggle('gold',SAUTO>0);}
}
function cycleSauto(){
  SAUTO = SAUTO===0?1 : SAUTO===1?3 : 0;
  syncSautoUI();
  clearStoryTimer();
  // ONにした瞬間、表示中の物語要素に自動送りを仕掛ける
  if(SAUTO>0){
    if($('#dlg').style.display==='flex')scheduleDlgAuto($('#dlgText').textContent||'');
    else if($('#plateOv').style.display==='flex')storyTimer=setTimeout(()=>$('#plateOv').click(),plateDelay());
    else if($('#introOv').style.display==='flex')storyTimer=setTimeout(()=>$('#introOv').click(),introDelay());
  }
}
const sSpd=()=>SAUTO===3?3:1;
const plateDelay=()=>3400/sSpd();
const introDelay=()=>5200/sSpd();
function scheduleDlgAuto(text){
  clearStoryTimer();
  if(SAUTO===0)return;
  const base=Math.max(1700, 500+text.length*90);
  storyTimer=setTimeout(()=>{ if($('#dlg').style.display==='flex')nextDlg(); }, base/sSpd());
}

let dlgQueue=[],dlgDone=null;
function showDialog(lines,done){
  dlgQueue=lines.slice();dlgDone=done;
  $('#dlg').style.display='flex';
  nextDlg();
}
function nextDlg(){
  clearStoryTimer();
  if(!dlgQueue.length){
    $('#dlg').style.display='none';
    const d=dlgDone;dlgDone=null;d&&d();
    return;
  }
  const L=dlgQueue.shift();
  const sp=SPK[L.who]||SPK.n;
  $('#dlgName').textContent=sp.name;
  const face=$('#dlgFace');
  if(sp.img){ face.innerHTML=`<img src="${sp.img(L.face)}" alt="${sp.name}">`; }
  else if(sp.tok){ face.innerHTML=`<svg viewBox="170 6 340 340" style="background:linear-gradient(160deg,#2a3252,#141a30)">${TOKEN_SVG[sp.tok]}</svg>`; }
  else{ face.innerHTML=miniIcon(sp.svg); }
  $('#dlgText').textContent=L.text;
  scheduleDlgAuto(L.text);
}
$('#dlgBox').addEventListener('click',nextDlg);
$('#dlgAutoBtn').addEventListener('click',e=>{e.stopPropagation();cycleSauto();});

function showScene(key,done){
  const ov=$('#sceneOv');
  $('#sceneImg').src=IMG.SCENE[key];
  ov.style.display='flex';
  ov.onclick=()=>{clearStoryTimer();ov.style.display='none';done&&done();};
  clearStoryTimer();
  if(SAUTO>0)storyTimer=setTimeout(()=>ov.click(),introDelay());
}
function showEnd(msg,sub,btn,cb){
  $('#endMsg').textContent=msg;
  $('#endSub').textContent=sub;
  const b=$('#endBtn');b.textContent=btn;
  $('#endOv').style.display='flex';
  b.onclick=()=>{$('#endOv').style.display='none';cb&&cb();};
}

/* ---- 戦闘 ---- */
function startBattle(idx){
  const S=STAGES[idx];
  G={
    idx, S, w:S.w, h:S.h,
    units:S.units.map(u=>Object.assign({},u,{done:false,alive:true,hp:u.mhp})),
    turn:1, phase:'me', sel:null, mode:'idle', busy:false,
    spawned:{}, evShown:{},
  };
  setBanner(S.name,'第1ターン / 自軍','me',S.obj);
  drawBoard();
  log('◆ '+S.name+' 開始','sys');
  log(S.obj,'sys');
  // 開幕の一言
  const heroes=G.units.filter(u=>u.side==='me'&&u.quote);
  heroes.slice(0,2).forEach(u=>log(u.name+'「'+u.quote+'」','me'));
  if(AUTO)setTimeout(runAuto,400);
}

function terrainAt(x,y){ return G.S.terrain[x+','+y]||(G.S.sky?'sky':'plain'); }
function tDef(t){ return {rubble:2,field:1,cloud:0}[t]||0; }
function tEvd(t){ return {cloud:15,field:10,rubble:5}[t]||0; }
const TMARK={rubble:'礫',field:'畑',cloud:'雲',water:'樋'};

function drawBoard(){
  boardEl.style.gridTemplateColumns=`repeat(${G.w},1fr)`;
  boardEl.innerHTML='';
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){
    const c=el('div','cell');
    const t=terrainAt(x,y);
    if(t!=='plain'&&t!=='sky')c.classList.add('t-'+t);
    if(TMARK[t]){const m=el('span','tmark');m.textContent=TMARK[t];c.appendChild(m);}
    if(G.S.goal&&G.S.goal.x===x&&G.S.goal.y===y)c.classList.add('goalCell');
    c.dataset.x=x;c.dataset.y=y;
    c.addEventListener('click',()=>onCellClick(x,y));
    boardEl.appendChild(c);
  }
  G.units.forEach(u=>{if(u.alive)placeUnit(u);});
}
function cellEl(x,y){ return boardEl.children[y*G.w+x]; }
function unitSize(){ const c=boardEl.children[0]; return c? c.offsetWidth-6 : 44; }
function cellPos(x,y){
  const c=cellEl(x,y), s=unitSize();
  return {left:c.offsetLeft+(c.offsetWidth-s)/2, top:c.offsetTop+(c.offsetHeight-s)/2};
}
function placeUnit(u){
  const d=el('div','unit '+u.side+(u.done?' done':''));
  d.id='u_'+u.id;
  const SIDE_COL={me:'#3d6489',foe:'#c9502e',npc:'#d9a93f'};
  const inner = u.tok ? `<svg class="tokSvg" viewBox="0 0 680 660" aria-hidden="true"><ellipse cx="340" cy="630" rx="215" ry="26" fill="${SIDE_COL[u.side]}" opacity=".5"/>${TOKEN_SVG[u.tok]}</svg>` : u.glyph;
  d.innerHTML=`<span class="nm">${u.name}</span>${inner}<span class="hpbar"><i style="width:${u.hp/u.mhp*100}%"></i></span>`;
  const s=unitSize();
  d.style.width=s+'px';d.style.height=s+'px';d.style.fontSize=Math.round(s*0.46)+'px';
  const p=cellPos(u.x,u.y);
  d.style.left=p.left+'px';d.style.top=p.top+'px';
  d.addEventListener('click',e=>{e.stopPropagation();onUnitClick(u);});
  boardEl.appendChild(d);
}
function refreshUnit(u){
  const d=document.getElementById('u_'+u.id);
  if(!d)return;
  if(!u.alive){d.remove();return;}
  d.className='unit '+u.side+(u.done?' done':'')+(G.sel===u?' sel':'');
  d.querySelector('.hpbar i').style.width=(u.hp/u.mhp*100)+'%';
  const p=cellPos(u.x,u.y);
  d.style.left=p.left+'px';d.style.top=p.top+'px';
}
function unitAt(x,y){ return G.units.find(u=>u.alive&&u.x===x&&u.y===y); }
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

function reachable(u){
  const res=new Map(); const q=[[u.x,u.y,0]];
  res.set(u.x+','+u.y,0);
  while(q.length){
    const [x,y,d]=q.shift();
    if(d>=u.mov)continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=G.w||ny>=G.h)continue;
      const k=nx+','+ny;
      const occ=unitAt(nx,ny);
      if(occ&&occ.side!==u.side)continue;      // 敵は通れない
      if(res.has(k)&&res.get(k)<=d+1)continue;
      res.set(k,d+1);
      q.push([nx,ny,d+1]);
    }
  }
  // 停止不可(他ユニットのいるマス)を除外して返す
  const out=[];
  for(const k of res.keys()){
    const [x,y]=k.split(',').map(Number);
    if(x===u.x&&y===u.y){out.push({x,y});continue;}
    if(!unitAt(x,y))out.push({x,y});
  }
  return out;
}
function targetsFrom(u,x,y,type){
  const out=[];
  for(const t of G.units){
    if(!t.alive)continue;
    const d=Math.abs(t.x-x)+Math.abs(t.y-y);
    if(type==='atk'&&t.side!==u.side&&t.side!=='npc'&&d>=1&&d<=u.rng)out.push(t);
    if(type==='atk'&&t.side==='foe'&&u.side==='me'&&d>=1&&d<=u.rng&&!out.includes(t))out.push(t);
    if(type==='heal'&&(t.side==='me'||t.side==='npc')&&t!==u&&t.hp<t.mhp&&d===1)out.push(t);
  }
  // 自軍→npcは攻撃対象外、敵→npc/自軍が対象
  return out.filter(t=>{
    if(type==='heal')return true;
    if(u.side==='me')return t.side==='foe';
    return t.side==='me'||t.side==='npc';
  });
}

function clearHL(){
  boardEl.querySelectorAll('.cell').forEach(c=>c.classList.remove('hl-move','hl-atk','hl-heal'));
  $('#actMenu').style.display='none';
}
function showInfo(u){
  if(!u){$('#uinfo').textContent='ユニットを選択してください。';return;}
  const t=terrainAt(u.x,u.y);
  $('#uinfo').innerHTML=`<div class="big">${u.glyph} ${u.name} <span style="font-size:11px;color:${u.side==='me'?'var(--ai-b)':u.side==='foe'?'var(--akane-b)':'var(--kin)'}">[${u.side==='me'?'自軍':u.side==='foe'?'敵軍':'守護対象'}]</span></div>
    <span class="st">HP <b>${u.hp}</b>/${u.mhp}</span><span class="st">攻 <b>${u.atk}</b></span><span class="st">射程 <b>${u.rng}</b></span><span class="st">移動 <b>${u.mov}</b></span>
    ${u.heal?`<span class="st">修理 <b>${u.heal}</b></span>`:''}${u.evd?`<span class="st">回避 <b>${u.evd}%</b></span>`:''}
    <br><span class="st">地形: ${TMARK[t]||'—'} (防+${tDef(t)}/避+${tEvd(t)}%)</span>`;
}

function onUnitClick(u){
  if(G.busy||G.phase!=='me'||G.autoRunning)return;
  showInfo(u);
  if(u.side!=='me'||u.done){clearHL();G.sel=null;G.units.forEach(refreshUnit);return;}
  clearHL();
  G.sel=u;G.mode='move';
  G.units.forEach(refreshUnit);
  reachable(u).forEach(p=>cellEl(p.x,p.y).classList.add('hl-move'));
}
function onCellClick(x,y){
  if(G.busy||G.phase!=='me'||!G.sel)return;
  const c=cellEl(x,y);
  if(G.mode==='move'&&c.classList.contains('hl-move')){
    moveUnit(G.sel,x,y).then(()=>showActMenu(G.sel));
  }
}
async function moveUnit(u,x,y){
  G.busy=true;clearHL();
  u.x=x;u.y=y;refreshUnit(u);
  await sleep(230);
  G.busy=false;
  checkReachWin(u);
}
function showActMenu(u){
  if(!G||G.over)return;
  const m=$('#actMenu');m.innerHTML='';
  const atks=targetsFrom(u,u.x,u.y,'atk');
  const heals=u.heal?targetsFrom(u,u.x,u.y,'heal'):[];
  const mk=(txt,fn)=>{const b=el('button');b.textContent=txt;b.onclick=fn;m.appendChild(b);};
  if(atks.length)mk('⚔ 攻撃',()=>{m.style.display='none';G.mode='atk';atks.forEach(t=>cellEl(t.x,t.y).classList.add('hl-atk'));bindTargetClicks(atks,'atk');});
  if(heals.length)mk('🔧 修理',()=>{m.style.display='none';G.mode='heal';heals.forEach(t=>cellEl(t.x,t.y).classList.add('hl-heal'));bindTargetClicks(heals,'heal');});
  mk('💤 待機',()=>{m.style.display='none';endAction(u);});
  const p=cellPos(u.x,u.y);
  m.style.left=Math.min(p.left+50,boardEl.offsetWidth-110)+'px';
  m.style.top=Math.max(p.top-10,4)+'px';
  m.style.display='flex';
}
function bindTargetClicks(list,type){
  const a=G.sel;
  list.forEach(t=>{
    const fire=async e=>{
      e.stopPropagation();
      if(G.over||G.busy)return;
      if(G.sel!==a||G.mode!==type||!a.alive||a.done||!t.alive)return;
      clearHL();
      if(type==='atk')await doAttack(a,t);
      else await doHeal(a,t);
      endAction(a);
    };
    cellEl(t.x,t.y).addEventListener('click',fire,{capture:true,once:true});
    const d=document.getElementById('u_'+t.id);
    if(d)d.addEventListener('click',fire,{capture:true,once:true});
  });
}
function fxPop(u,txt,cls){
  const p=cellPos(u.x,u.y);
  const d=el('div','dmgPop '+(cls||''));
  d.textContent=txt;
  d.style.left=(p.left+8)+'px';d.style.top=(p.top-8)+'px';
  boardEl.appendChild(d);setTimeout(()=>d.remove(),800);
}
async function doAttack(a,t){
  G.busy=true;
  const evd=(t.evd||0)+tEvd(terrainAt(t.x,t.y));
  if(rnd(100)<evd){
    fxPop(t,'回避!','miss');
    log(`${a.name} の攻撃 → ${t.name} は回避`, a.side==='me'?'me':'foe');
  }else{
    const dmg=Math.max(1, a.atk - tDef(terrainAt(t.x,t.y)) + rnd(3)-1);
    t.hp=Math.max(0,t.hp-dmg);
    fxPop(t,'-'+dmg);
    boardEl.classList.add('shaking');setTimeout(()=>boardEl.classList.remove('shaking'),260);
    log(`${a.name} → ${t.name} に ${dmg} ダメージ`, a.side==='me'?'me':'foe');
    refreshUnit(t);
    if(t.hp<=0)await killUnit(t);
  }
  await sleep(300);
  G.busy=false;
}
async function doHeal(a,t){
  G.busy=true;
  const v=a.heal;
  t.hp=Math.min(t.mhp,t.hp+v);
  fxPop(t,'+'+v,'heal');
  log(`${a.name} が ${t.name} を修理 (+${v})`,'me');
  refreshUnit(t);
  await sleep(300);
  G.busy=false;
}
async function killUnit(u){
  u.alive=false;refreshUnit(u);
  log(`${u.name} 撃破`, u.side==='foe'?'me':'foe');
  // 敗北条件
  if(G.S.loseIfDead&&G.S.loseIfDead.includes(u.id)){
    return battleLose(u.side==='npc'?`${u.name}が破壊された……`:`${u.name}が墜ちた……`);
  }
  if(u.side==='foe')checkKillWin();
}
function endAction(u){
  if(!G||G.over)return;
  u.done=true;G.sel=null;G.mode='idle';
  clearHL();G.units.forEach(refreshUnit);
  checkReachWin(u);
  if(G.over)return;
  if(G.units.filter(x=>x.side==='me'&&x.alive&&!x.done).length===0)endTurn();
}

/* ---- 勝敗判定 ---- */
function checkKillWin(){
  if(G.over)return;
  if(G.S.win.type==='kill_all'&&!G.units.some(u=>u.side==='foe'&&u.alive))battleWin();
}
function checkReachWin(u){
  if(G.over)return;
  const w=G.S.win;
  if(w.type==='reach'&&u.id===w.unit&&G.S.goal&&u.x===G.S.goal.x&&u.y===G.S.goal.y)battleWin();
}
function battleWin(){
  if(G.over)return;G.over=true;
  log('◆ 勝利条件達成!','sys');
  const fin=()=>showEnd('勝利','戦域を確保した。物語がつづく。','物語をすすめる',()=>runScript());
  if(G.S.winScene){
    setTimeout(()=>showScene(G.S.winScene,fin),450);
  }else{
    setTimeout(fin,500);
  }
}
function battleLose(reason){
  if(G.over)return;G.over=true;
  if(G.S.scripted==='lose'){
    log('◆ ロトン機、墜落——','foe');
    setTimeout(()=>showEnd('最後の飛行','ロトンは最後の瞬間まで操縦桿を離さず、火を噴く機体を、無人の岩場へ運んだ。','物語をすすめる',()=>runScript()),700);
    return;
  }
  log('◆ 敗北……','foe');
  const idx=G.idx;
  setTimeout(()=>showEnd('敗北',reason+' もう一度挑もう。','再挑戦',()=>startBattle(idx)),500);
}

/* ---- ターン ---- */
$('#endTurnBtn').addEventListener('click',()=>{if(G&&!G.busy&&G.phase==='me'&&!G.over)endTurn();});
$('#restartBtn').addEventListener('click',()=>{if(G&&!G.over)startBattle(G.idx);});

async function endTurn(){
  if(G.over)return;
  clearHL();G.sel=null;
  G.phase='foe';
  setBanner(G.S.name,`第${G.turn}ターン / 敵軍`,'foe',G.S.obj);
  G.busy=true;
  await sleep(400);
  for(const u of G.units.filter(x=>x.side==='foe'&&x.alive)){
    if(G.over)break;
    await foeAct(u);
  }
  if(G.over)return;
  // ターン経過
  G.turn++;
  // 生存勝利判定
  if(G.S.win.type==='survive'&&G.turn>G.S.win.turns){G.busy=false;return battleWin();}
  // 増援
  if(G.S.spawns&&G.S.spawns[G.turn]&&!G.spawned[G.turn]){
    G.spawned[G.turn]=true;
    for(const proto of G.S.spawns[G.turn]){
      const nu=Object.assign({},proto,{done:false,alive:true,hp:proto.mhp});
      if(!unitAt(nu.x,nu.y)){G.units.push(nu);placeUnit(nu);log('敵増援: '+nu.name,'foe');}
    }
  }
  G.units.forEach(u=>{u.done=false;refreshUnit(u);});
  G.phase='me';G.busy=false;
  /* 消耗: 逃れられない弾幕 */
  if(G.S.attrition){
    const a=G.S.attrition, u=G.units.find(x=>x.id===a.unit&&x.alive);
    if(u){
      u.hp=Math.max(0,u.hp-a.dmg);
      fxPop(u,'-'+a.dmg);
      log(a.label+': '+u.name+' に '+a.dmg+' ダメージ','foe');
      refreshUnit(u);
      if(u.hp<=0){await killUnit(u);if(G.over)return;}
    }
  }
  /* ターンイベント */
  if(G.S.events&&G.S.events[G.turn]&&!G.evShown[G.turn]){
    G.evShown[G.turn]=true;
    showDialog(G.S.events[G.turn]);
  }
  setBanner(G.S.name,`第${G.turn}ターン / 自軍`,'me',G.S.obj);
  if(G.S.win.type==='survive')log(`—— 第${G.turn}ターン (あと${G.S.win.turns-G.turn+1}ターン守り抜け)`,'sys');
  else log(`—— 第${G.turn}ターン`,'sys');
  if(AUTO&&!G.over)setTimeout(runAuto,250);
}
async function foeAct(u){
  // 目標: aiTarget優先、いなければ最寄りの自軍
  let cands=G.units.filter(x=>x.alive&&(x.side==='me'||x.side==='npc'));
  if(!cands.length)return;
  let target=null;
  if(G.S.aiTarget){
    const core=G.units.find(x=>x.id===G.S.aiTarget&&x.alive);
    // 6割はコア狙い、近くに自軍がいればそちらも
    const near=cands.filter(x=>x.side==='me').sort((a,b)=>dist(a,u)-dist(b,u))[0];
    target=(core&&(!near||dist(core,u)<=dist(near,u)+2||rnd(10)<6))?core:near||core;
  }else{
    target=cands.filter(x=>x.side==='me').sort((a,b)=>dist(a,u)-dist(b,u))[0];
  }
  if(!target)return;
  // 射程内なら攻撃、そうでなければ接近
  if(dist(u,target)>u.rng&&u.mov>0){
    const opts=reachable(u).sort((a,b)=>
      (Math.abs(a.x-target.x)+Math.abs(a.y-target.y))-(Math.abs(b.x-target.x)+Math.abs(b.y-target.y)));
    if(opts.length){const p=opts[0];u.x=p.x;u.y=p.y;refreshUnit(u);await sleep(240);}
  }
  if(G.over)return;
  if(dist(u,target)<=u.rng&&u.rng>0){
    await doAttack(u,target);
  }
  await sleep(120);
}

/* ---- オートモード ---- */
let AUTO=false;
$('#autoBtn').addEventListener('click',()=>{
  AUTO=!AUTO;
  const b=$('#autoBtn');
  b.textContent='戦闘オート: '+(AUTO?'ON':'OFF');
  b.classList.toggle('gold',AUTO);
  log('戦闘オート '+(AUTO?'ON':'OFF'),'sys');
  if(AUTO&&G&&!G.over&&G.phase==='me'&&!G.busy)runAuto();
});

async function runAuto(){
  if(!G||G.autoRunning)return;
  G.autoRunning=true;
  try{
    while(AUTO&&G&&!G.over&&G.phase==='me'){
      while($('#dlg').style.display==='flex'){await sleep(250);if(!G||G.over)return;}
      const u=G.units.find(x=>x.side==='me'&&x.alive&&!x.done);
      if(!u)break;                       // 全員行動済み → endAction側でターン終了
      clearHL();G.sel=null;
      await autoAct(u);
      await sleep(140);
    }
  }finally{ if(G)G.autoRunning=false; }
}

async function autoAct(u){
  if(G.over||u.done||!u.alive)return;
  const reach=reachable(u);
  const foes=()=>G.units.filter(x=>x.side==='foe'&&x.alive);
  const core=G.S.aiTarget?G.units.find(x=>x.id===G.S.aiTarget&&x.alive):null;
  const md=(c,t)=>Math.abs(c.x-t.x)+Math.abs(c.y-t.y);

  /* 修理役: 傷んだ味方の隣へ */
  if(u.heal){
    const hurt=G.units.filter(x=>x.alive&&(x.side==='me'||x.side==='npc')&&x!==u&&x.mhp-x.hp>=Math.min(6,u.heal))
      .sort((a,b)=>(a.hp/a.mhp)-(b.hp/b.mhp));
    for(const t of hurt){
      const spots=reach.filter(c=>md(c,t)===1)
        .sort((a,b)=>tDef(terrainAt(b.x,b.y))-tDef(terrainAt(a.x,a.y)));
      if(spots.length){
        await moveUnit(u,spots[0].x,spots[0].y);
        if(G.over)return;
        await doHeal(u,t);
        return endAction(u);
      }
    }
    /* 修理相手に届かない → いちばん傷んだ味方(なければコア)へ寄る */
    const follow=hurt[0]||core;
    if(follow){
      const best=reach.slice().sort((a,b)=>md(a,follow)-md(b,follow))[0];
      if(best){await moveUnit(u,best.x,best.y);if(G.over)return;}
      return endAction(u);
    }
  }

  /* 到達型ステージ: 対象ユニットはゴールへ一直線 */
  const w=G.S.win;
  if(w.type==='reach'&&u.id===w.unit&&G.S.goal){
    const g=G.S.goal;
    const onGoal=reach.find(c=>c.x===g.x&&c.y===g.y);
    if(onGoal){await moveUnit(u,g.x,g.y);return;}   // moveUnit内で勝利判定
    const best=reach.slice().sort((a,b)=>
      (md(a,g)-md(b,g))||(tDef(terrainAt(b.x,b.y))-tDef(terrainAt(a.x,a.y))))[0];
    if(best)await moveUnit(u,best.x,best.y);
    if(G.over)return;
    const tg=targetsFrom(u,u.x,u.y,'atk').sort((a,b)=>a.hp-b.hp)[0];
    if(tg)await doAttack(u,tg);
    return endAction(u);
  }

  /* 攻撃: 撃破可能 > 低HP > 地形有利 の順で移動先を採点 */
  let best=null;
  for(const c of reach){
    for(const e of foes()){
      if(md(c,e)<1||md(c,e)>u.rng)continue;
      const kill=u.atk-1>=e.hp?1:0;
      const score=kill*1000+(100-e.hp)+tDef(terrainAt(c.x,c.y))*6+tEvd(terrainAt(c.x,c.y))*0.3;
      if(!best||score>best.score)best={c,e,score};
    }
  }
  if(best){
    if(best.c.x!==u.x||best.c.y!==u.y)await moveUnit(u,best.c.x,best.c.y);
    if(G.over)return;
    if(best.e.alive)await doAttack(u,best.e);
    return endAction(u);
  }

  /* 攻撃できない → 追跡(防衛戦ではコアから離れすぎない) */
  const es=foes();
  if(es.length){
    const chase=core
      ? es.slice().sort((a,b)=>md(a,core)-md(b,core))[0]   // コアに最も迫る敵
      : es.slice().sort((a,b)=>md(a,u)-md(b,u))[0];
    let cands=reach;
    if(core){
      const near=reach.filter(c=>md(c,core)<=4);
      if(near.length)cands=near;
    }
    const mv=cands.slice().sort((a,b)=>md(a,chase)-md(b,chase))[0];
    if(mv&&(mv.x!==u.x||mv.y!==u.y))await moveUnit(u,mv.x,mv.y);
    if(G.over)return;
  }
  endAction(u);
}
