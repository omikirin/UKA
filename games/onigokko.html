<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1016'/%3E%3Cpath d='M32 56 L13 43 L8 9 L26 21 Q32 17 38 21 L56 9 L51 43 Z' fill='%23DE8250'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1A1016">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>夜の境内で鬼ごっこ — ささがね vs クオン</title>
<style>
  :root{
    --night:#171522; --ground:#221F30; --ground2:#2A2740; --line:#3A3658;
    --text:#F2EEE6; --sub:#9A96B4;
    --oni:#D84A4A; --gold:#E4B04F;
    --sasagane:#8A5ECB; --quon:#4A90D8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--night); color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  }

  #field{position:fixed; inset:0; overflow:hidden;}
  #sky{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 78% 14%, rgba(244,238,220,.95) 0 34px, rgba(244,238,220,.14) 40px, transparent 90px),
      radial-gradient(ellipse at 50% 0%, #26233C 0%, var(--night) 62%);
  }
  .star{position:absolute; width:3px; height:3px; border-radius:50%; background:#EDE7D2; opacity:.7;}
  #groundPlane{
    position:absolute; left:0; right:0; bottom:0; height:58%;
    background:radial-gradient(ellipse at 50% 0%, var(--ground2) 0%, var(--ground) 55%), var(--ground);
    border-top:3px solid #3E3A5E;
  }
  #groundPlane::before{
    content:""; position:absolute; inset:0; opacity:.16;
    background:
      repeating-linear-gradient(0deg, transparent 0 44px, #14121e 44px 46px),
      repeating-linear-gradient(90deg, transparent 0 84px, #14121e 84px 86px);
  }
  .obstacle{
    position:absolute; transform:translate(-50%,-92%);
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));
    pointer-events:none; line-height:1;
  }
  .obstacle .glow{
    position:absolute; left:50%; top:40%; width:120px; height:120px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(228,176,79,.22), transparent 65%);
    border-radius:50%;
  }

  .actor{
    position:absolute; left:0; top:0; width:168px; height:216px;
    transform-origin:50% 100%; will-change:transform; pointer-events:none;
  }
  .actor svg{position:absolute; inset:0; width:100%; height:100%;}
  .actor .shadow{
    position:absolute; left:50%; bottom:2px; width:96px; height:18px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse, rgba(0,0,0,.4), transparent 70%);
  }
  .actor .plate{
    position:absolute; left:50%; top:-4px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px;
    font-size:12px; letter-spacing:.1em; white-space:nowrap;
    background:rgba(20,18,30,.72); border:1px solid var(--line);
    padding:3px 10px; border-radius:12px;
  }
  .actor .plate .dot{width:8px; height:8px; border-radius:50%;}
  .actor .oniBadge{
    position:absolute; left:50%; top:-40px; transform:translateX(-50%) scale(0);
    width:34px; height:34px; border-radius:50%;
    background:var(--oni); color:#fff; font-weight:bold; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px rgba(216,74,74,.35), 0 4px 10px rgba(0,0,0,.4);
    transition:transform .25s cubic-bezier(.2,1.6,.4,1);
  }
  .actor.oni .oniBadge{transform:translateX(-50%) scale(1); animation:bob 1s ease-in-out infinite;}
  @keyframes bob{0%,100%{margin-top:0;}50%{margin-top:-6px;}}
  .actor.safe{animation:flash .3s linear infinite;}
  @keyframes flash{0%,100%{opacity:1;}50%{opacity:.45;}}

  #hud{
    position:absolute; top:10px; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:center;
    pointer-events:none; z-index:500;
  }
  #timer{
    font-size:42px; font-weight:bold; letter-spacing:.06em;
    font-variant-numeric:tabular-nums; line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  #timer.hurry{color:var(--oni); animation:flash .5s linear infinite;}
  #timer small{display:block; font-size:10px; font-weight:normal; color:var(--sub); text-align:center; letter-spacing:.2em; margin-top:4px;}
  #roleTip{
    position:absolute; top:64px; left:0; right:0; text-align:center;
    font-size:13px; letter-spacing:.08em; color:var(--sub); pointer-events:none; z-index:500;
  }
  #roleTip b{color:var(--oni);}
  #fx{
    position:absolute; left:50%; top:34%;
    transform:translateX(-50%) scale(.4) rotate(-6deg);
    font-size:min(11vw,64px); font-weight:bold; letter-spacing:.12em;
    color:var(--oni); -webkit-text-stroke:2px #2a1218;
    text-shadow:0 5px 0 rgba(0,0,0,.4);
    opacity:0; pointer-events:none; white-space:nowrap; z-index:600;
  }
  #fx.pop{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stamp{
    0%{opacity:0; transform:translateX(-50%) scale(.4) rotate(-6deg);}
    60%{opacity:1; transform:translateX(-50%) scale(1.15) rotate(2deg);}
    100%{opacity:1; transform:translateX(-50%) scale(1) rotate(0);}
  }

  #stickZone{
    position:absolute; left:14px; bottom:14px; width:132px; height:132px;
    border-radius:50%; border:1.5px solid var(--line);
    background:rgba(30,27,45,.5); z-index:700; touch-action:none;
  }
  #stickKnob{
    position:absolute; left:50%; top:50%; width:52px; height:52px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:rgba(154,150,180,.4); border:1.5px solid var(--sub);
  }
  #dashBtn{
    position:absolute; right:16px; bottom:22px; width:84px; height:84px;
    border-radius:50%; border:2px solid var(--gold);
    background:rgba(30,27,45,.6); color:var(--gold);
    font-family:inherit; font-size:15px; font-weight:bold; letter-spacing:.1em;
    z-index:700; cursor:pointer; touch-action:none; overflow:hidden;
  }
  #dashBtn .gauge{
    position:absolute; left:0; bottom:0; width:100%; height:100%;
    background:rgba(228,176,79,.28); transform-origin:bottom;
  }
  #dashBtn span{position:relative;}
  #dashBtn:disabled{opacity:.5;}
  #keysHint{
    position:absolute; right:16px; bottom:116px; font-size:10px; color:var(--sub);
    letter-spacing:.08em; text-align:right; z-index:700; pointer-events:none;
  }
  @media (hover:none){ #keysHint{display:none;} }

  #overlay{
    position:absolute; inset:0; z-index:900;
    background:rgba(17,15,28,.86); backdrop-filter:blur(3px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px; text-align:center;
  }
  #overlay.hidden{display:none;}
  #overlay h1{font-size:clamp(22px,5.4vw,34px); letter-spacing:.16em;}
  #overlay h1 b{color:var(--oni);}
  #overlay .rule{font-size:13px; color:var(--sub); line-height:1.9; letter-spacing:.05em;}
  #overlay .rule b{color:var(--text);}
  #resultText{font-size:clamp(26px,7vw,44px); font-weight:bold; letter-spacing:.14em;}
  #resultSub{font-size:14px; color:var(--sub);}
  .pickRow{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  button.pick{
    font-family:inherit; color:var(--text); cursor:pointer;
    background:#211E33; border:2px solid var(--line); border-radius:16px;
    padding:12px 20px; font-size:15px; letter-spacing:.08em;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s, border-color .12s;
  }
  button.pick:hover{transform:translateY(-2px);}
  button.pick .chip{width:16px; height:16px; border-radius:50%;}
  button.pick.sel{border-color:var(--gold); background:#2B2740;}
  button.pick small{font-size:10px; color:var(--sub);}
  button.go{
    font-family:inherit; font-size:17px; font-weight:bold; letter-spacing:.16em;
    color:#241a10; background:var(--gold); border:none; border-radius:14px;
    padding:14px 42px; cursor:pointer; transition:transform .12s;
    box-shadow:0 5px 0 #9c7526;
  }
  button.go:active{transform:translateY(3px); box-shadow:0 2px 0 #9c7526;}
  button.go:focus-visible, button.pick:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  #credit{position:absolute; bottom:10px; font-size:10px; color:#5c5878; letter-spacing:.06em;}
  @media (prefers-reduced-motion:reduce){
    #fx.pop{animation:none; opacity:1; transform:translateX(-50%);}
    .actor.oni .oniBadge{animation:none;}
    #timer.hurry,.actor.safe{animation:none;}
  }
</style>
</head>
<body>
<div id="field">
  <div id="sky"></div>
  <div id="groundPlane"></div>

  <div class="actor" id="actorA">
    <div class="shadow"></div>
    <div class="oniBadge">鬼</div>
    <div class="plate"><span class="dot" style="background:var(--sasagane)"></span>ささがね</div>
  </div>
  <div class="actor" id="actorB">
    <div class="shadow"></div>
    <div class="oniBadge">鬼</div>
    <div class="plate"><span class="dot" style="background:var(--quon)"></span>クオン</div>
  </div>

  <div id="hud"><div id="timer">45<small>のこり時間</small></div></div>
  <div id="roleTip"></div>
  <div id="fx"></div>

  <div id="stickZone"><div id="stickKnob"></div></div>
  <button id="dashBtn"><div class="gauge" id="dashGauge"></div><span>ダッシュ</span></button>
  <div id="keysHint">移動: ←↑↓→ / WASD<br>ダッシュ: Shift か Space</div>

  <div id="overlay">
    <h1>夜の境内で<b>鬼ごっこ</b></h1>
    <div id="resultText" style="display:none"></div>
    <div id="resultSub" style="display:none"></div>
    <div class="rule" id="ruleText">
      タッチしたら<b>鬼交代</b>。時間切れのとき<b>鬼だったほうの負け</b>!<br>
      最初の鬼はあいて。灯籠のかげを使って逃げきろう。
    </div>
    <div class="pickRow" id="pickRow">
      <button class="pick sel" data-me="quon">
        <span class="chip" style="background:var(--quon)"></span>クオンであそぶ<small>ささがねが追ってくる</small>
      </button>
      <button class="pick" data-me="sasagane">
        <span class="chip" style="background:var(--sasagane)"></span>ささがねであそぶ<small>クオンが追ってくる</small>
      </button>
    </div>
    <button class="go" id="goBtn">スタート</button>
    <div id="credit">CryptoNinja 非公式二次創作ファンアート(ガイドライン準拠)</div>
  </div>
</div>

/* エラーが起きたら真っ白ではなく画面に表示する */
window.addEventListener("error", e => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:8px;top:8px;right:8px;z-index:9999;background:#5a1f2a;color:#ffd7d7;font-size:12px;padding:8px 10px;border-radius:8px;white-space:pre-wrap;";
  d.textContent = "⚠ エラー: " + e.message + (e.lineno ? " (line " + e.lineno + ")" : "");
  document.body.appendChild(d);
});
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const SVGNS = "http://www.w3.org/2000/svg";

/* ================================================================
   キャラ描画エンジン
   svg-motion-system.html のリグ/モーション処理を、iframeなしで
   同一ページ内に複数体つくれる形(ファクトリ)に移植したもの。
================================================================ */
const EXPRESSIONS = {
  normal:{ browY:0, browA:0,  mouthForm:0.4,  mouthOpen:0,   eyeMul:1,   blush:0.35 },
  happy: { browY:-3,browA:0,  mouthForm:1,    mouthOpen:0.45,eyeMul:0.12,blush:0.55 },
  angry: { browY:5, browA:-14,mouthForm:-0.8, mouthOpen:0.1, eyeMul:0.85,blush:0.2  },
  sad:   { browY:4, browA:10, mouthForm:-0.6, mouthOpen:0,   eyeMul:0.6, blush:0.3  },
  waku:  { browY:-5,browA:0,  mouthForm:1,    mouthOpen:0.5, eyeMul:1.15,blush:0.6  },
};
const MOTIONS = {
  jump:     {dur:0.7,  fn:(t,o)=>{ o.jumpY = -34*Math.sin(t*Math.PI);
                                   o.angleY = 10*Math.sin(t*Math.PI);
                                   o.armL = Math.sin(t*Math.PI)*0.9;
                                   o.armR = Math.sin(t*Math.PI)*0.9; }},
  surprise: {dur:1.2,  fn:(t,o)=>{ const p = Math.min(t*6,1)*(t<0.8?1:(1-t)*5);
                                   o.eyeBoost = 0.25*p; o.browY = -6*p;
                                   o.mouthOpen = 0.9*p; o.angleY = 8*p; o.jumpY = -8*p;
                                   o.armL = 0.4*p; o.armR = 0.4*p; }},
  damage:   {dur:0.8,  fn:(t,o)=>{ const d = 1-t;
                                   o.angleX = 18*Math.sin(t*40)*d;
                                   o.angleZ = 10*Math.sin(t*33)*d;
                                   o.eyeScale = 1-0.92*d; o.browY = 5*d;
                                   o.mouthOpen = 0.55*d;
                                   o.jumpY = -4*Math.sin(t*Math.PI); }},
  joy:      {dur:1.4,  fn:(t,o)=>{ const up = Math.min(t*5, 1, (1-t)*5);
                                   o.jumpY = -22*Math.abs(Math.sin(t*Math.PI*2))*up;
                                   o.armL = 0.95*up; o.armR = 0.95*up;
                                   o.armWigL = 8*Math.sin(t*Math.PI*4)*up;
                                   o.armWigR = -8*Math.sin(t*Math.PI*4)*up;
                                   o.mouthOpen = 0.6*up; o.browY = -4*up;
                                   o.angleZ = 6*Math.sin(t*Math.PI*4)*up; }},
  down:     {dur:1.8,  fn:(t,o)=>{ const per = Math.min(t*2.5, 1) * (t>0.75 ? (1-t)*4 : 1);
                                   o.angleY = -18*per; o.angleZ = 5*per;
                                   o.jumpY = 5*per; o.browY = 5*per;
                                   o.eyeScale = 1-0.45*per; }},
  victory:  {dur:1.6,  fn:(t,o)=>{ const up = Math.min(t*5, 1, (1-t)*5);
                                   o.armR = 1.1*up; o.angleZ = 10*up; o.bodyZ = 4*up;
                                   o.mouthOpen = 0.5*up; o.browY = -4*up;
                                   o.jumpY = -8*Math.sin(Math.min(t*2,1)*Math.PI)*up; }},
  tilt:     {dur:1.4,  fn:(t,o)=>{ o.angleZ = 20*Math.sin(t*Math.PI); o.bodyZ = 4*Math.sin(t*Math.PI); }},
};
const LOOPS = {
  yura: t => ({
    angleZ: 7*Math.sin(t*1.6), bodyZ: 4*Math.sin(t*1.6 - 0.4),
    angleX: 6*Math.sin(t*0.9), angleY: 3*Math.sin(t*1.1),
    armL: 0.08 + 0.06*Math.sin(t*1.6), armR: 0.08 + 0.06*Math.sin(t*1.6 + Math.PI),
  }),
  run: t => ({
    jumpY: -8*Math.abs(Math.sin(t*8)), angleY: -4 + 2*Math.sin(t*16),
    bodyZ: 3*Math.sin(t*8), angleZ: 3*Math.sin(t*4),
    armL: 0.35 + 0.3*Math.sin(t*8), armR: 0.35 + 0.3*Math.sin(t*8 + Math.PI),
    legF: 34*Math.sin(t*8), legB: -34*Math.sin(t*8),
  }),
  stance: t => ({
    jumpY: -2*Math.abs(Math.sin(t*2.2)), angleZ: 2 + 2*Math.sin(t*2.2),
    armR: 0.22 + 0.04*Math.sin(t*2.2), armL: 0.12,
    legF: -8, legB: 8,
  }),
  cheer: t => ({
    jumpY: -10*Math.abs(Math.sin(t*3)), angleY: 5,
    armL: 0.7 + 0.4*Math.sin(t*3), armR: 0.7 + 0.4*Math.sin(t*3 + Math.PI),
    angleZ: 8*Math.sin(t*1.5), mouthMin: 0.25 + 0.2*Math.sin(t*3),
  }),
  tremble: t => ({
    angleX: 2.2*Math.sin(t*40), angleZ: 1.6*Math.sin(t*47),
    jumpY: -1, browY: 4, eyeScale: 0.75,
    armL: 0.1, armR: 0.1,
  }),
};

function safeBBox(el){
  try{ const b = el.getBBox(); if(b) return b; }catch(_){}
  return {x:0, y:0, width:0, height:0};
}
function spring(s, target, k, damp, dt){
  s.v += (target - s.a) * k * dt;
  s.v *= Math.pow(damp, dt*60);
  s.a += s.v * dt;
}

function createChara(hostEl, svgBody, viewBox){
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", viewBox);
  svg.setAttribute("xmlns", SVGNS);
  svg.innerHTML = svgBody;
  hostEl.insertBefore(svg, hostEl.querySelector(".oniBadge"));

  const q = id => svg.querySelector("#" + CSS.escape(id));
  const wrap = elm => {
    const w = document.createElementNS(SVGNS, "g");
    elm.parentNode.insertBefore(w, elm);
    w.appendChild(elm);
    return w;
  };

  /* ---- リグ構築(元アプリの buildRig を移植) ---- */
  const pivots = {};
  svg.querySelectorAll('[id^="pivot_"]').forEach(m => {
    pivots[m.id.slice(6)] = [ +m.getAttribute("cx") || 0, +m.getAttribute("cy") || 0 ];
    m.style.display = "none";
  });
  const bboxC = w => { const b = safeBBox(w); return [b.x + b.width/2, b.y + b.height/2]; };
  const r = {swings:[], eyes:[], brows:[], blush:[]};

  svg.querySelectorAll('[id^="swing_"]').forEach(e => {
    const name = e.id.slice(6);
    const w = wrap(e);
    const p = pivots["swing_" + name] || bboxC(w);
    r.swings.push({
      w, p, s:{a:0, v:0},
      k:    +e.dataset.k    || 40,
      damp: +e.dataset.damp || 0.9,
      fz:   +e.dataset.fz   || 0.8,
      fx:   +e.dataset.fx   || 0.3,
      wag:    !!e.dataset.wag,
      twitch: !!e.dataset.twitch,
    });
  });
  ["L","R"].forEach(side => {
    const e = q("eye" + side);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    const irisEl = q("iris" + side);
    r.eyes.push({
      w, cy: b.y + b.height/2,
      iris: irisEl ? wrap(irisEl) : null,
      ampX: b.width * 0.17, ampY: b.height * 0.12,
      closed: q("eye" + side + "Closed"),
    });
  });
  ["L","R"].forEach((side, i) => {
    const e = q("brow" + side);
    if(!e) return;
    const w = wrap(e);
    const [cx, cy] = bboxC(w);
    r.brows.push({w, cx, cy, sign: i === 0 ? -1 : 1});
  });
  const mo = q("mouthOpen"), mc = q("mouthClosed");
  if(mo || mc){
    const w = mo ? wrap(mo) : null;
    let topY = 0;
    if(w){ const b = safeBBox(w); topY = b.y; }
    r.mouth = {open: w, openEl: mo, closed: mc, topY};
  }
  ["blushL","blushR"].forEach(id => { const e = q(id); if(e) r.blush.push(e); });

  const layer = id => { const e = q(id); return e ? wrap(e) : null; };
  r.hairBack  = layer("hairBack");
  r.face      = layer("face");
  r.features  = layer("features");
  r.hairFront = layer("hairFront");

  const headEl = q("head");
  if(headEl){
    const w = wrap(headEl);
    r.head = {w, p: pivots["head"] || bboxC(w)};
  }
  const bodyEl = q("body");
  if(bodyEl){
    const w = wrap(bodyEl);
    const b = safeBBox(w);
    r.body = {w, p: pivots["body"] || [b.x + b.width/2, b.y + b.height]};
  }
  ["L","R"].forEach(side => {
    const e = q("arm" + side);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    r["arm" + side] = {w, p: pivots["arm" + side] || [b.x + b.width/2, b.y]};
  });

  /* ---- 状態 ---- */
  const cur = {angleX:0, angleY:0, angleZ:0, eyeOpen:1, eyeX:0, eyeY:0,
               mouthOpen:0, mouthForm:0.4, bodyZ:0, armL:0, armR:0};
  const tgt = {...cur};
  let exp = EXPRESSIONS.normal;
  let motion = null, loopKey = null, loopT = 0, idleT = Math.random()*10;
  let blinkT = 0, nextBlink = 1.5 + Math.random()*3;
  const gaze = {x:0, y:0};

  function blinkValue(dt){
    nextBlink -= dt;
    if(nextBlink <= 0 && blinkT <= 0){
      blinkT = 0.28;
      nextBlink = Math.random() < 0.22 ? 0.34 : 1.5 + Math.random()*4;
    }
    if(blinkT > 0){
      blinkT -= dt;
      const p = 1 - Math.max(blinkT,0)/0.28;
      return p < .5 ? 1 - p*2 : (p-.5)*2;
    }
    return null;
  }

  function update(dt){
    idleT += dt;
    /* 追従・アイドル揺れ */
    tgt.angleX = gaze.x * 28;
    tgt.angleY = -gaze.y * 24;
    tgt.eyeX = gaze.x;
    tgt.eyeY = gaze.y;
    tgt.bodyZ = gaze.x * 5;
    tgt.angleZ = Math.sin(idleT*0.7)*3;
    const breath = (Math.sin(idleT*1.6)+1)/2;

    const off = {};
    if(motion){
      motion.t += dt/motion.dur;
      if(motion.t >= 1) motion = null;
      else motion.fn(motion.t, off);
    }
    let lo = {};
    if(loopKey){ loopT += dt; lo = LOOPS[loopKey](loopT); }

    const ease = 1 - Math.pow(0.0015, dt);
    for(const k in cur) cur[k] += (tgt[k] - cur[k]) * ease;

    const v = {...cur};
    ["angleX","angleY","angleZ","bodyZ","armL","armR","eyeX","eyeY"].forEach(k => {
      v[k] += (off[k] || 0) + (lo[k] || 0);
    });
    v.eyeX = clamp(v.eyeX, -1, 1);
    v.eyeY = clamp(v.eyeY, -1, 1);
    v.armL = clamp(v.armL, -0.6, 1.3);
    v.armR = clamp(v.armR, -0.6, 1.3);

    let eyeOpen = v.eyeOpen * exp.eyeMul + (off.eyeBoost || 0);
    const blink = blinkValue(dt);
    if(blink !== null) eyeOpen *= blink;
    if(off.eyeScale !== undefined) eyeOpen *= off.eyeScale;
    if(lo.eyeScale  !== undefined) eyeOpen *= lo.eyeScale;
    eyeOpen = clamp(eyeOpen, 0, 1.25);

    const mouthOpen = clamp(Math.max(
      v.mouthOpen,
      exp.mouthOpen*0.6 + v.mouthOpen*0.4,
      off.mouthOpen || 0,
      lo.mouthMin || 0
    ), 0, 1);
    const browY = exp.browY + (off.browY || 0) + (lo.browY || 0);
    const browA = exp.browA;

    /* ---- 反映 ---- */
    const jy = (off.jumpY || 0) + (lo.jumpY || 0);
    const brY = -breath*3;
    if(r.body){
      const s = 1 + breath*0.012;
      const [px, py] = r.body.p;
      r.body.w.setAttribute("transform",
        `translate(0,${jy + brY*0.6}) rotate(${v.bodyZ} ${px} ${py}) translate(0,${py*(1-s)}) scale(1,${s})`);
    }
    if(r.head){
      const [px, py] = r.head.p;
      r.head.w.setAttribute("transform",
        `translate(${v.angleX*0.9},${-v.angleY*0.7 + jy + brY}) rotate(${v.angleZ} ${px} ${py})`);
    }
    if(r.hairBack)  r.hairBack.setAttribute("transform",  `translate(${-v.angleX*0.35},${v.angleY*0.22})`);
    if(r.face)      r.face.setAttribute("transform",      `translate(${-v.angleX*0.10},${v.angleY*0.06})`);
    if(r.features)  r.features.setAttribute("transform",  `translate(${v.angleX*0.45},${-v.angleY*0.30})`);
    if(r.hairFront) r.hairFront.setAttribute("transform", `translate(${v.angleX*0.18},${-v.angleY*0.12})`);

    const closed = eyeOpen < 0.15;
    r.eyes.forEach(eye => {
      const sy = Math.max(eyeOpen, eye.closed ? 0.02 : 0.06);
      eye.w.setAttribute("transform", `translate(0,${eye.cy*(1-sy)}) scale(1,${sy})`);
      if(eye.closed){
        eye.w.style.opacity = closed ? 0 : 1;
        eye.closed.style.opacity = closed ? 1 : 0;
      }
      if(eye.iris) eye.iris.setAttribute("transform",
        `translate(${v.eyeX*eye.ampX},${v.eyeY*eye.ampY})`);
    });
    r.brows.forEach(b => {
      b.w.setAttribute("transform", `translate(0,${browY}) rotate(${b.sign*browA} ${b.cx} ${b.cy})`);
    });
    if(r.mouth){
      const opened = mouthOpen >= 0.06;
      if(r.mouth.closed) r.mouth.closed.style.opacity = opened ? 0 : 1;
      if(r.mouth.open){
        r.mouth.openEl.style.opacity = opened ? 1 : 0;
        const s = Math.max(mouthOpen, 0.1);
        r.mouth.open.setAttribute("transform",
          `translate(0,${r.mouth.topY*(1-s)}) scale(1,${s})`);
      }
    }
    r.blush.forEach(b => b.style.opacity = exp.blush);
    if(r.armL){
      const deg = v.armL*150 - ((off.armWigL || 0) + (lo.armWigL || 0));
      r.armL.w.setAttribute("transform", `rotate(${deg} ${r.armL.p[0]} ${r.armL.p[1]})`);
    }
    if(r.armR){
      const deg = -v.armR*150 + ((off.armWigR || 0) + (lo.armWigR || 0));
      r.armR.w.setAttribute("transform", `rotate(${deg} ${r.armR.p[0]} ${r.armR.p[1]})`);
    }
    r.swings.forEach(p => {
      let target;
      if(p.wag){
        target = -v.bodyZ*2 + Math.sin(idleT*2.2)*12;
      }else{
        target = -v.angleZ*p.fz - v.angleX*p.fx;
        if(p.twitch && Math.random() < dt*0.35) p.s.v += 90*(Math.random()-0.5);
      }
      spring(p.s, target, p.k, p.damp, dt);
      p.w.setAttribute("transform", `rotate(${p.s.a} ${p.p[0]} ${p.p[1]})`);
    });
  }

  return {
    update,
    motion(name){ if(MOTIONS[name]) motion = {t:0, ...MOTIONS[name]}; },
    loop(name){ if(loopKey === name) return; loopKey = LOOPS[name] ? name : null; loopT = 0; },
    expression(name){ if(EXPRESSIONS[name]) exp = EXPRESSIONS[name]; },
    look(x, y){ gaze.x = clamp(x, -1, 1); gaze.y = clamp(y, -1, 1); },
    face(dir){ svg.style.transform = dir === "left" ? "scaleX(-1)" : ""; },
  };
}

/* ================================================================
   効果音
================================================================ */
let ac = null;
const tone = (f, dur=0.09, type="square", vol=0.05, when=0) => {
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, ac.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + when + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + when); o.stop(ac.currentTime + when + dur + 0.02);
};
const seTag  = () => { tone(220, 0.14, "sawtooth", 0.07); tone(660, 0.16, "square", 0.06, 0.06); };
const seDash = () => tone(880, 0.08, "square", 0.04);
const seTick = () => tone(1040, 0.05, "square", 0.045);
const seWin  = () => [523,659,784,1046].forEach((f,i)=>tone(f,0.15,"triangle",0.06,i*0.1));
const seLose = () => [392,330,262,196].forEach((f,i)=>tone(f,0.18,"triangle",0.06,i*0.12));
document.addEventListener("pointerdown", () => {
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
}, {once:true});

/* ================================================================
   星と障害物
================================================================ */
const field = $("field");
for(let i = 0; i < 26; i++){
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100 + "%";
  s.style.top = Math.random()*36 + "%";
  s.style.opacity = 0.25 + Math.random()*0.55;
  s.style.transform = `scale(${0.6 + Math.random()})`;
  $("sky").appendChild(s);
}
const OBSTACLES = [
  {fx:0.24, fy:0.30, r:30, emoji:"🏮", size:46, glow:true},
  {fx:0.76, fy:0.32, r:30, emoji:"🏮", size:46, glow:true},
  {fx:0.50, fy:0.62, r:34, emoji:"🪨", size:52},
  {fx:0.16, fy:0.80, r:36, emoji:"🌳", size:62},
  {fx:0.84, fy:0.78, r:36, emoji:"🌳", size:62},
];
OBSTACLES.forEach(o => {
  const el = document.createElement("div");
  el.className = "obstacle";
  el.style.fontSize = o.size + "px";
  if(o.glow){ const g = document.createElement("div"); g.className = "glow"; el.appendChild(g); }
  el.appendChild(document.createTextNode(o.emoji));
  field.appendChild(el);
  o.el = el;
});

const play = {x0:0, x1:0, y0:0, y1:0, w:0, h:0};
function layout(){
  const W = innerWidth, H = innerHeight;
  play.x0 = 30; play.x1 = W - 30;
  play.y0 = H*0.46; play.y1 = H - 26;
  play.w = play.x1 - play.x0; play.h = play.y1 - play.y0;
  OBSTACLES.forEach(o => {
    o.x = play.x0 + o.fx*play.w;
    o.y = play.y0 + o.fy*play.h;
    o.el.style.left = o.x + "px";
    o.el.style.top = o.y + "px";
    o.el.style.zIndex = Math.round(o.y);
  });
}
addEventListener("resize", layout);
layout();

/* ================================================================
   アクター
================================================================ */
function makeActor(el, svgBody, color){
  return {
    el, color,
    chara: createChara(el, svgBody, "0 0 680 660"),
    x:0, y:0, vx:0, vy:0,
    speed:225, isOni:false, isPlayer:false,
    curLoop:"__none", curFace:"", lookT:0,
    ai:{t:0, dx:0, dy:0, dashCd:0},
    dash:{active:0, gauge:1},
  };
}
const A = makeActor($("actorA"), CN_SASAGANE_SVG, "var(--sasagane)");
const B = makeActor($("actorB"), CN_QUON_SVG, "var(--quon)");
const ACTORS = [A, B];

function setLoop(a, name){
  if(a.curLoop === name) return;
  a.curLoop = name;
  a.chara.loop(name);
}
function setFace(a, dir){
  if(a.curFace === dir) return;
  a.curFace = dir;
  a.chara.face(dir);
}
function setOni(a, on){
  a.isOni = on;
  a.el.classList.toggle("oni", on);
}
function render(a){
  const t = (a.y - play.y0) / Math.max(play.h, 1);
  const s = 0.66 + 0.42*clamp(t, 0, 1);
  a.el.style.transform = `translate(${a.x - 84}px, ${a.y - 216}px) scale(${s})`;
  a.el.style.zIndex = Math.round(a.y);
}

/* ================================================================
   入力
================================================================ */
const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key === "Shift" || e.key === " "){ tryDash(); e.preventDefault(); }
  if(["arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const stick = {active:false, id:null, x:0, y:0};
const zone = $("stickZone"), knob = $("stickKnob");
function stickMove(e){
  const rct = zone.getBoundingClientRect();
  const cx = rct.left + rct.width/2, cy = rct.top + rct.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const len = Math.hypot(dx, dy), max = rct.width/2 - 10;
  if(len > max){ dx = dx/len*max; dy = dy/len*max; }
  stick.x = dx/max; stick.y = dy/max;
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
zone.addEventListener("pointerdown", e => {
  stick.active = true; stick.id = e.pointerId;
  zone.setPointerCapture(e.pointerId);
  stickMove(e);
});
zone.addEventListener("pointermove", e => { if(stick.active && e.pointerId === stick.id) stickMove(e); });
const stickEnd = e => {
  if(e.pointerId !== stick.id) return;
  stick.active = false; stick.x = 0; stick.y = 0;
  knob.style.transform = "translate(-50%,-50%)";
};
zone.addEventListener("pointerup", stickEnd);
zone.addEventListener("pointercancel", stickEnd);

const dashBtn = $("dashBtn"), dashGauge = $("dashGauge");
function tryDash(){
  const p = ACTORS.find(a => a.isPlayer);
  if(!p || state !== "play") return;
  if(p.dash.gauge >= 0.99 && p.dash.active <= 0){
    p.dash.active = 1.0;
    p.dash.gauge = 0;
    seDash();
    p.chara.motion("jump");
  }
}
dashBtn.addEventListener("pointerdown", e => { e.preventDefault(); tryDash(); });

/* ================================================================
   ゲーム進行
================================================================ */
const MATCH_SEC = 45;
let state = "menu";
let timeLeft = MATCH_SEC;
let safeUntil = 0;
let now = 0;
let lastTickSec = -1;
let myKey = "quon";

document.querySelectorAll(".pick").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".pick").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    myKey = b.dataset.me;
  });
});
$("goBtn").addEventListener("click", startMatch);

function call(text){
  const fx = $("fx");
  fx.classList.remove("pop");
  void fx.offsetWidth;
  fx.textContent = text;
  fx.classList.add("pop");
}
function roleTip(){
  const p = ACTORS.find(a => a.isPlayer);
  $("roleTip").innerHTML = p.isOni
    ? "きみが<b>鬼</b>! あいてをタッチしろ!"
    : "あいてが<b>鬼</b>! つかまるな!";
}

function startMatch(){
  $("overlay").classList.add("hidden");
  $("resultText").style.display = "none";
  $("resultSub").style.display = "none";
  $("ruleText").style.display = "";
  $("pickRow").style.display = "";
  $("goBtn").textContent = "スタート";

  const player = myKey === "quon" ? B : A;
  const cpu    = player === A ? B : A;
  ACTORS.forEach(a => { a.isPlayer = false; });
  player.isPlayer = true;

  player.x = play.x0 + play.w*0.22; player.y = play.y0 + play.h*0.55;
  cpu.x    = play.x0 + play.w*0.78; cpu.y    = play.y0 + play.h*0.55;
  ACTORS.forEach(a => {
    a.vx = a.vy = 0;
    a.dash = {active:0, gauge:1};
    a.ai = {t:0, dx:0, dy:0, dashCd:2};
    a.curLoop = "__none"; a.curFace = "";
    a.chara.expression("normal");
    a.chara.motion("jump");
    setLoop(a, null);
    setFace(a, a === player ? "right" : "left");
    a.el.classList.remove("safe");
    render(a);
  });
  setOni(player, false);
  setOni(cpu, true);
  cpu.chara.expression("waku");

  timeLeft = MATCH_SEC;
  lastTickSec = -1;
  safeUntil = now + 2.0;
  roleTip();
  call("スタート!");
  state = "play";
}

async function doTag(){
  state = "pause";
  seTag();
  call("交代!");
  const oldOni = ACTORS.find(a => a.isOni);
  const newOni = ACTORS.find(a => !a.isOni);
  ACTORS.forEach(a => { a.vx = a.vy = 0; setLoop(a, null); });
  oldOni.chara.motion("victory");
  oldOni.chara.expression("happy");
  newOni.chara.motion("damage");
  newOni.chara.expression("angry");
  await new Promise(res => setTimeout(res, 950));
  if(state !== "pause") return;
  setOni(oldOni, false);
  setOni(newOni, true);
  newOni.chara.expression("waku");
  oldOni.chara.expression("normal");
  newOni.ai.dashCd = 1.2;
  safeUntil = now + 1.8;
  ACTORS.forEach(a => a.el.classList.add("safe"));
  setTimeout(() => ACTORS.forEach(a => a.el.classList.remove("safe")), 1800);
  roleTip();
  state = "play";
}

function endMatch(){
  state = "end";
  const loser = ACTORS.find(a => a.isOni);
  const winner = ACTORS.find(a => !a.isOni);
  const playerWon = winner.isPlayer;
  ACTORS.forEach(a => { a.vx = a.vy = 0; setLoop(a, null); });
  winner.chara.loop("cheer");
  winner.chara.expression("happy");
  loser.chara.motion("down");
  loser.chara.expression("sad");
  setTimeout(() => loser.chara.loop("tremble"), 1800);
  call("タイムアップ!");
  (playerWon ? seWin : seLose)();

  const rt = $("resultText"), rs = $("resultSub");
  rt.textContent = playerWon ? "🎉 逃げきり勝ち!" : "つかまったまま時間切れ…";
  rt.style.color = playerWon ? "var(--gold)" : "var(--oni)";
  rs.textContent = playerWon
    ? (winner === B ? "クオンの勝ち! ささがねはくやしそう…" : "ささがねの勝ち! クオンはくやしそう…")
    : (loser === B ? "クオンの負け…もう一回挑戦しよう!" : "ささがねの負け…もう一回挑戦しよう!");
  setTimeout(() => {
    $("overlay").classList.remove("hidden");
    rt.style.display = ""; rs.style.display = "";
    $("ruleText").style.display = "none";
    $("pickRow").style.display = "";
    $("goBtn").textContent = "もう一回!";
  }, 1600);
}

/* ================================================================
   物理・AI・アニメ
================================================================ */
function moveActor(a, dx, dy, spd, dt){
  const len = Math.hypot(dx, dy);
  if(len > 0.01){
    a.vx = dx/len * spd;
    a.vy = dy/len * spd;
  }else{
    a.vx *= 0.7; a.vy *= 0.7;
  }
  a.x += a.vx * dt;
  a.y += a.vy * dt * 0.82;
  OBSTACLES.forEach(o => {
    const ddx = a.x - o.x, ddy = (a.y - o.y) * 1.4;
    const d = Math.hypot(ddx, ddy);
    if(d < o.r + 26 && d > 0.01){
      const push = (o.r + 26 - d);
      a.x += ddx/d * push;
      a.y += ddy/d * push / 1.4;
    }
  });
  a.x = clamp(a.x, play.x0, play.x1);
  a.y = clamp(a.y, play.y0, play.y1);
}

function updateAI(a, target, dt){
  a.ai.t -= dt;
  a.ai.dashCd -= dt;
  if(a.ai.t <= 0){
    let dx, dy;
    if(a.isOni){
      dx = target.x - a.x; dy = target.y - a.y;
      dx += (Math.random()-0.5) * 80;
      dy += (Math.random()-0.5) * 80;
      a.ai.t = 0.12 + Math.random()*0.2;
    }else{
      dx = a.x - target.x; dy = a.y - target.y;
      const m = 150;
      if(a.x - play.x0 < m) dx += (m - (a.x - play.x0)) * 2.2;
      if(play.x1 - a.x < m) dx -= (m - (play.x1 - a.x)) * 2.2;
      if(a.y - play.y0 < m*0.7) dy += (m*0.7 - (a.y - play.y0)) * 2.2;
      if(play.y1 - a.y < m*0.7) dy -= (m*0.7 - (play.y1 - a.y)) * 2.2;
      dx += (Math.random()-0.5) * 120;
      dy += (Math.random()-0.5) * 120;
      a.ai.t = 0.18 + Math.random()*0.25;
    }
    const l = Math.hypot(dx, dy) || 1;
    a.ai.dx = dx/l; a.ai.dy = dy/l;
  }
  if(a.isOni && a.ai.dashCd <= 0 && Math.hypot(a.x-target.x, a.y-target.y) > 160 && Math.random() < 0.5){
    a.dash.active = 0.9;
    a.ai.dashCd = 3.5 + Math.random()*2;
  }
  const spd = a.speed * 0.94 * (a.dash.active > 0 ? 1.45 : 1);
  moveActor(a, a.ai.dx, a.ai.dy, spd, dt);
}

function updateAnim(a, other, dt){
  const moving = Math.hypot(a.vx, a.vy) > 30;
  setLoop(a, moving ? "run" : (a.isOni ? "stance" : null));
  if(Math.abs(a.vx) > 24) setFace(a, a.vx < 0 ? "left" : "right");
  a.lookT -= dt;
  if(a.lookT <= 0){
    a.lookT = 0.3;
    /* 左向き(反転表示)のときはX方向の視線も反転させる */
    const flip = a.curFace === "left" ? -1 : 1;
    a.chara.look(clamp((other.x - a.x)/420, -1, 1) * flip, clamp((other.y - a.y)/420, -1, 1));
  }
}

let last = performance.now();
function frame(t){
  const dt = Math.min((t - last)/1000, 0.05);
  last = t;
  now = t/1000;

  /* キャラのリグは常に更新(メニュー中も呼吸・まばたきする) */
  ACTORS.forEach(a => a.chara.update(dt));

  if(state === "play"){
    const p = ACTORS.find(a => a.isPlayer);
    const c = ACTORS.find(a => !a.isPlayer);

    let ix = (keys["arrowright"]||keys["d"] ? 1 : 0) - (keys["arrowleft"]||keys["a"] ? 1 : 0);
    let iy = (keys["arrowdown"]||keys["s"] ? 1 : 0) - (keys["arrowup"]||keys["w"] ? 1 : 0);
    if(stick.active && Math.hypot(stick.x, stick.y) > 0.15){ ix = stick.x; iy = stick.y; }
    const spd = p.speed * (p.dash.active > 0 ? 1.5 : 1);
    moveActor(p, ix, iy, Math.hypot(ix, iy) > 0.01 ? spd : 0, dt);

    ACTORS.forEach(a => {
      if(a.dash.active > 0) a.dash.active -= dt;
      else a.dash.gauge = clamp(a.dash.gauge + dt/2.6, 0, 1);
    });
    dashGauge.style.transform = `scaleY(${p.dash.gauge})`;
    dashBtn.disabled = p.dash.gauge < 0.99 || p.dash.active > 0;

    updateAI(c, p, dt);
    updateAnim(p, c, dt);
    updateAnim(c, p, dt);
    render(p); render(c);

    const scale = 0.66 + 0.42*(((p.y + c.y)/2 - play.y0)/Math.max(play.h,1));
    if(now > safeUntil && Math.hypot(p.x - c.x, (p.y - c.y)*1.3) < 62*scale){
      doTag();
    }

    timeLeft -= dt;
    const sec = Math.max(0, Math.ceil(timeLeft));
    if(sec !== lastTickSec){
      lastTickSec = sec;
      $("timer").firstChild.nodeValue = sec;
      $("timer").classList.toggle("hurry", sec <= 5 && sec > 0);
      if(sec <= 5 && sec > 0) seTick();
    }
    if(timeLeft <= 0) endMatch();
  }
  requestAnimationFrame(frame);
}

/* メニュー画面用の初期配置 */
function menuPose(){
  A.x = play.x0 + play.w*0.3; A.y = play.y0 + play.h*0.5;
  B.x = play.x0 + play.w*0.7; B.y = play.y0 + play.h*0.5;
  setFace(A, "right"); setFace(B, "left");
  setLoop(A, "yura"); setLoop(B, "yura");
  render(A); render(B);
}
menuPose();
requestAnimationFrame(frame);
</script>
