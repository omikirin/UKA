<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG モーション ゲーム支援システム</title>
<style>
  :root{
    --bg:#171923; --panel:#1f2230; --panel2:#262a3c; --line:#333850;
    --text:#e8e9f0; --sub:#8f94ad; --accent:#ff7eb6; --accent2:#6ee7d8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{display:flex; align-items:baseline; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); flex:0 0 auto;}
  header h1{font-size:15px; letter-spacing:.08em;}
  header h1 .dot{color:var(--accent);}
  header span{font-size:11px; color:var(--sub);}
  main{flex:1; display:flex; min-height:0;}
  #stage{
    flex:1; position:relative; min-width:0;
    background:radial-gradient(ellipse at 50% 35%, #232840 0%, #171923 70%);
    display:flex; align-items:center; justify-content:center;
    cursor:crosshair; touch-action:none;
  }
  #stage svg{height:96%; max-width:100%; user-select:none;}
  #hint{
    position:absolute; left:14px; bottom:12px; font-size:11px; color:var(--sub);
    background:rgba(23,25,35,.7); padding:6px 10px; border-radius:8px; pointer-events:none;
  }
  #panel{
    flex:0 0 306px; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:14px 14px 24px;
  }
  h2{font-size:11px; color:var(--sub); letter-spacing:.15em; margin:18px 0 8px; text-transform:uppercase;}
  h2:first-child{margin-top:2px;}
  .param{
    display:grid; grid-template-columns:74px 1fr 44px; align-items:center;
    gap:8px; padding:5px 8px; border-radius:8px; position:relative;
  }
  .param::before{
    content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    border-radius:2px; background:transparent; transition:background .15s;
  }
  .param.live::before{background:var(--accent);}
  .param label{font-size:12px;}
  .param output{font-size:11px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px;
    background:var(--panel2); border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); cursor:pointer;
  }
  .toggles,.btns{display:flex; flex-wrap:wrap; gap:6px;}
  .toggle{
    font-size:12px; padding:6px 10px; border-radius:16px;
    background:var(--panel2); border:1px solid var(--line); cursor:pointer;
    color:var(--sub); transition:all .15s;
  }
  .toggle.on{color:var(--bg); background:var(--accent2); border-color:var(--accent2); font-weight:bold;}
  button.act{
    font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); cursor:pointer; transition:all .15s;
  }
  button.act:hover{border-color:var(--accent); color:var(--accent);}
  button.act:active{transform:scale(.95);}
  button.act.sel{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:bold;}
  button.act.sel:hover{color:var(--bg);}
  .charBtn{display:flex; align-items:center; gap:6px;}
  .charBtn .sw{width:12px; height:12px; border-radius:50%; display:inline-block;}
  #micStatus,#loadStatus{font-size:11px; color:var(--sub); margin-top:6px; min-height:14px;}
  #loadStatus.err{color:#ff8f8f;}
  select{
    font-size:12px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
  }
  input[type=file]{display:none;}
  @media (max-width:700px){
    main{flex-direction:column;}
    #stage{flex:1 1 52%;}
    #panel{flex:1 1 48%; border-left:none; border-top:1px solid var(--line);}
  }
</style>
</head>
<body>
<header>
  <h1>SVG モーション ゲーム支援システム<span class="dot">●</span></h1>
  <span>SVG差し替え対応:テンプレートを描き換えて自作キャラを動かせます</span>
</header>
<main>
  <div id="stage">
    <svg id="chara" viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint">🖱 追従 | キー: 1〜9,0=モーション / Q〜P=ループ / Esc=停止</div>
  </div>

  <div id="panel">
    <h2>キャラクター</h2>
    <div class="btns" id="charBtns"></div>
    <div class="btns" style="margin-top:8px">
      <select id="partSel"></select>
      <button class="act" id="loadBtn">📂 SVG読み込み</button>
      <button class="act" id="tplBtn">⬇ テンプレートSVG保存</button>
      <input type="file" id="fileInput" accept=".svg,image/svg+xml">
    </div>
    <div id="loadStatus"></div>
    <div id="fitBox" style="display:none">
      <h2>配置調整(読み込んだパーツ)</h2>
      <select id="fitSel" style="width:100%; margin-bottom:6px"></select>
      <div id="fitParams"></div>
    </div>

    <h2>パラメータ</h2>
    <div id="params"></div>

    <h2>口パク</h2>
    <div class="toggles">
      <div class="toggle" id="micBtn">🎤 マイク連動</div>
      <div class="toggle" data-auto="fakeTalk">自動口パク</div>
    </div>
    <div id="micStatus"></div>

    <h2>自動</h2>
    <div class="toggles">
      <div class="toggle on" data-auto="track">マウス追従</div>
      <div class="toggle on" data-auto="blink">自動まばたき</div>
      <div class="toggle on" data-auto="breath">呼吸</div>
      <div class="toggle on" data-auto="idle">アイドル揺れ</div>
    </div>

    <h2>ループモーション</h2>
    <div class="btns">
      <button class="act loop" data-loop="yura">ゆらゆら</button>
      <button class="act loop" data-loop="rhythm">リズム</button>
      <button class="act loop" data-loop="dance">ダンス</button>
      <button class="act loop" data-loop="talk">おしゃべり</button>
      <button class="act loop" data-loop="walk">歩き</button>
      <button class="act loop" data-loop="run">走り</button>
      <button class="act loop" data-loop="float">ぷかぷか</button>
      <button class="act loop" data-loop="sleep">すやすや</button>
      <button class="act loop" data-loop="cheer">おうえん</button>
      <button class="act loop" data-loop="stance">構え</button>
      <button class="act loop" data-loop="pace">うろうろ</button>
      <button class="act loop" data-loop="tremble">わなわな</button>
      <button class="act loop" data-loop="pump">ガッツ</button>
      <button class="act loop" data-loop="patrol">おおきく往復</button>
      <button class="act loop" data-loop="footwork">フットワーク</button>
    </div>

    <h2>モーション(単発)</h2>
    <div class="btns">
      <button class="act" data-motion="nod">うなずき</button>
      <button class="act" data-motion="shake">首を振る</button>
      <button class="act" data-motion="tilt">首かしげ</button>
      <button class="act" data-motion="wave">手を振る</button>
      <button class="act" data-motion="banzai">ばんざい</button>
      <button class="act" data-motion="surprise">びっくり</button>
      <button class="act" data-motion="jump">ジャンプ</button>
      <button class="act" data-motion="bow">ぺこり</button>
      <button class="act" data-motion="damage">ダメージ</button>
      <button class="act" data-motion="joy">よろこび</button>
      <button class="act" data-motion="down">がっかり</button>
      <button class="act" data-motion="lookaround">きょろきょろ</button>
      <button class="act" data-motion="victory">どや</button>
      <button class="act" data-motion="sigh">ため息</button>
      <button class="act" data-motion="dizzy">めまい</button>
      <button class="act" data-motion="trip">ずっこけ</button>
      <button class="act" data-motion="mojimoji">もじもじ</button>
      <button class="act" data-motion="beckon">おいで</button>
    </div>

    <h2>戦闘モーション <span style="font-weight:normal">(横向きキャラ推奨)</span></h2>
    <div class="btns">
      <button class="act" data-motion="slash">斬る</button>
      <button class="act" data-motion="thrust">突き</button>
      <button class="act" data-motion="guard">ガード</button>
      <button class="act" data-motion="backstep">バクステ</button>
      <button class="act" data-motion="knockback">のけぞり</button>
      <button class="act" data-motion="combo">連斬</button>
      <button class="act" data-motion="uppercut">切り上げ</button>
      <button class="act" data-motion="rush">突進斬り</button>
      <button class="act" data-motion="slide">スライディング</button>
      <button class="act" data-motion="tackle">体当たり</button>
      <button class="act" data-motion="hitaway">ヒット&アウェイ</button>
      <button class="act" data-motion="escape">大バクステ</button>
      <button class="act" data-motion="jumpin">飛び込み</button>
      <button class="act" data-motion="special">✦必殺(キャラ専用)</button>
      <button class="act" id="demoBtn">▶ 戦闘デモ(ループ)</button>
    </div>

    <h2>表情</h2>
    <div class="btns">
      <button class="act exp sel" data-exp="normal">通常</button>
      <button class="act exp" data-exp="happy">にこにこ</button>
      <button class="act exp" data-exp="angry">むっ</button>
      <button class="act exp" data-exp="shy">照れ</button>
      <button class="act exp" data-exp="sad">しょんぼり</button>
      <button class="act exp" data-exp="waku">わくわく</button>
    </div>
  </div>
</main>

<script>
"use strict";
/* エラーが起きたら真っ白ではなく画面に表示する */
window.addEventListener("error", e => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:8px;top:8px;right:8px;z-index:99;background:#5a1f2a;color:#ffd7d7;font-size:12px;padding:8px 10px;border-radius:8px;white-space:pre-wrap;";
  d.textContent = "⚠ エラー: " + e.message + (e.lineno ? " (line " + e.lineno + ")" : "");
  document.body.appendChild(d);
});
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const SVGNS = "http://www.w3.org/2000/svg";
function safeBBox(el){
  try{ const b = el.getBBox(); if(b) return b; }catch(_){}
  return {x:0, y:0, width:0, height:0};
}

function wrap(elm){
  const w = document.createElementNS(SVGNS, "g");
  elm.parentNode.insertBefore(w, elm);

  const q = id => svg.querySelector("#" + CSS.escape(id));

    pivots[m.id.slice(6)] = [ +m.getAttribute("cx") || 0, +m.getAttribute("cy") || 0 ];
    m.style.display = "none";
  });
  const bboxC = w => { const b = safeBBox(w); return [b.x + b.width/2, b.y + b.height/2]; };

  const r = {swings:[], eyes:[], brows:[], blush:[]};

  /* 揺れ物(hairBack等の内側にあるので先に処理) */
  svg.querySelectorAll('[id^="swing_"]').forEach(e => {
    const name = e.id.slice(6);
    const w = wrap(e);
    const p = pivots["swing_" + name] || bboxC(w);
    r.swings.push({
      w, p, s:{a:0, v:0},
      k:    +e.dataset.k    || 40,
      damp: +e.dataset.damp || 0.9,
      fz:   +e.dataset.fz   || 0.8,
      fx:   +e.dataset.fx   || 0.3,
      wag:    !!e.dataset.wag,
      twitch: !!e.dataset.twitch,
    });
  });
  /* 目・眉(レイヤーより先にwrap) */
  ["L","R"].forEach(side => {
    const e = q("eye" + side);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    const irisEl = q("iris" + side);
    r.eyes.push({
      w, cy: b.y + b.height/2,
      iris: irisEl ? wrap(irisEl) : null,
      ampX: b.width * 0.17, ampY: b.height * 0.12,
      closed: q("eye" + side + "Closed"),
    });
  });
  ["L","R"].forEach((side, i) => {
    const e = q("brow" + side);
    if(!e) return;
    const w = wrap(e);
    const [cx, cy] = bboxC(w);
    r.brows.push({w, cx, cy, sign: i === 0 ? -1 : 1});
  });
  /* 口:動的パス(組み込み) or mouthOpen/mouthClosed(カスタム) */
  const mouthDyn = q("mouth");
  if(mouthDyn){
    r.mouth = {dynamic: mouthDyn};
  }else{
    const mo = q("mouthOpen"), mc = q("mouthClosed");
    if(mo || mc){
      const w = mo ? wrap(mo) : null;
      let topY = 0;
      if(w){ const b = safeBBox(w); topY = b.y; }
      r.mouth = {open: w, openEl: mo, closed: mc, topY};
    }
  }
  ["blushL","blushR"].forEach(id => { const e = q(id); if(e) r.blush.push(e); });

  /* レイヤー(視差) */
  const layer = id => { const e = q(id); return e ? wrap(e) : null; };
  r.hairBack  = layer("hairBack");
  r.face      = layer("face");
  r.features  = layer("features");
  r.hairFront = layer("hairFront");

  /* 頭・体・腕 */
  const headEl = q("head");
  if(headEl){
    const w = wrap(headEl);
    /* pivot_neck(任意)= 首との接点。大きく傾くときの支点として使う */
    r.head = {w, p: pivots["head"] || bboxC(w), neck: pivots["neck"] || null};
  }
  const bodyEl = q("body");
  if(bodyEl){
    const w = wrap(bodyEl);
    const b = safeBBox(w);
    r.body = {w, p: pivots["body"] || [b.x + b.width/2, b.y + b.height]};
  }
  ["L","R"].forEach(side => {
    const e = q("arm" + side);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    r["arm" + side] = {w, p: pivots["arm" + side] || [b.x + b.width/2, b.y]};
  });
  /* 横向きキャラ: armF(手前腕)→右腕, armB(奥腕)→左腕 のスロットへ */
  [["F","R"],["B","L"]].forEach(([sd, slot]) => {
    const e = q("arm" + sd);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    r["arm" + slot] = {w, p: pivots["arm" + sd] || [b.x + b.width/2, b.y]};
  });
  /* 脚(横向きキャラ用) */
  ["F","B"].forEach(sd => {
    const e = q("leg" + sd);
    if(!e) return;
    const w = wrap(e);
    const b = safeBBox(w);
    r["leg" + sd] = {w, p: pivots["leg" + sd] || [b.x + b.width/2, b.y]};
  });

  rig = r;
}

/* ================================================================
   キャラの構築・読み込み(defs / body / head に分けて管理)
================================================================ */
let charKey = "koharu";
const loadStatus = $("loadStatus");
let customText = null;
let parts = {viewBox:"0 0 420 560", defs:"", body:"", head:"", rest:""};

const ser = new XMLSerializer();
function parseSVG(text){
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const root = doc.documentElement;
  if(root.nodeName !== "svg" || doc.querySelector("parsererror")){
    throw new Error("SVGとして読み込めませんでした");
  }
  return root;
}
/* トップレベルを defs / #body / #head / その他 に分解して文字列で保持 */
function splitRoot(root){
  const q = {viewBox: root.getAttribute("viewBox") || "0 0 420 560", defs:"", body:"", head:"", rest:""};
  [...root.children].forEach(ch => {
    const str = ser.serializeToString(ch);
    if(ch.tagName.toLowerCase() === "defs") q.defs += str;
    else if(ch.id === "body") q.body = str;
    else if(ch.id === "head") q.head = str;
    else q.rest += str;
  });
  return q;
}
function compose(){
  svg.setAttribute("viewBox", parts.viewBox);
  svg.innerHTML = parts.defs + parts.rest + parts.body + parts.head;
  enforceLayers();
  buildRig();
  applyFits();
}

/* ================================================================
   レイヤー自動整列:idを認識して正しい前後関係に並べ替える
   (SVG内の記述順に関係なく、必ず 前髪>顔パーツ>輪郭>後ろ髪 等になる)
================================================================ */
/* el を含んでいる parent 直下の子要素を返す(fitラッパー等を挟んでいてもOK) */
function childOf(parent, el){
  let n = el;
  while(n && n.parentNode !== parent) n = n.parentNode;
  return n;
}
/* ids の順に parent の末尾へ移動 = 後のものほど前面になる */
function orderIn(parent, ids){
  ids.forEach(id => {
    const el = svg.querySelector("#" + CSS.escape(id));
    if(!el) return;
    const ch = childOf(parent, el);
    if(ch) parent.appendChild(ch);
  });
}
function enforceLayers(){
  const q = id => svg.querySelector("#" + CSS.escape(id));
  /* ルート:体の前に頭 */
  orderIn(svg, ["body", "head"]);
  /* 頭の中:後ろ髪 < 輪郭 < 顔パーツ < 前髪 */
  const head = q("head");
  if(head){
    orderIn(head, ["hairBack", "face", "features", "hairFront"]);
    /* featuresの外に直接置かれた顔パーツ(差し替えで読み込んだ口など)を
       輪郭より前・前髪より後ろの層へ移動する */
    const FACE_PART_IDS = ["browL","browR","eyeL","eyeR","irisL","irisR",
      "eyeLClosed","eyeRClosed","mouth","mouthOpen","mouthClosed","blushL","blushR"];
    const featCh  = q("features")  ? childOf(head, q("features"))  : null;
    const frontCh = q("hairFront") ? childOf(head, q("hairFront")) : null;
    [...head.children].forEach(ch => {
      if(ch === featCh || ch === frontCh) return;
      const isLooseFacePart = FACE_PART_IDS.some(id =>
        ch.id === id || (ch.querySelector && ch.querySelector("#" + id)));
      if(!isLooseFacePart) return;
      if(frontCh) head.insertBefore(ch, frontCh);
      else head.appendChild(ch);
    });
  }
  /* 顔パーツの中:眉 < 目 < 頬紅 < 口 */
  const feat = q("features");
  if(feat) orderIn(feat, [
    "browL", "browR",
    "eyeL", "eyeLClosed", "eyeR", "eyeRClosed",
    "blushL", "blushR",
    "mouth", "mouthClosed", "mouthOpen",
  ]);
  /* 体の中:しっぽ・腕は胴体の後ろへ */
  const body = q("body");
  if(body){
    ["armR", "armL"].forEach(id => {
      const el = q(id);
      if(!el || el.dataset.front) return;   /* data-front="1" は前面のまま */
      const ch = childOf(body, el);
      if(ch) body.insertBefore(ch, body.firstChild);
    });
    body.querySelectorAll('[id^="swing_"][data-wag]').forEach(el => {
      if(el.dataset.front) return;
      const ch = childOf(body, el);
      if(ch && ch.parentNode === body) body.insertBefore(ch, body.firstChild);
    });
  }
}
function report(prefix){
  const found = [];
  if(rig.head) found.push("頭");
  if(rig.body) found.push("体");
  if(rig.eyes.length) found.push("目×" + rig.eyes.length);
  if(rig.mouth) found.push("口");
  if(rig.brows.length) found.push("眉");
  if(rig.armL || rig.armR) found.push("腕");
  if(rig.legF || rig.legB) found.push("脚");
  if(rig.swings.length) found.push("揺れ物×" + rig.swings.length);
  loadStatus.className = "";
  loadStatus.textContent = found.length
    ? prefix + " 認識: " + found.join(" / ")
    : "⚠ 動かせるidが見つかりません(表示のみ)。テンプレートのid名を参考にしてください";
}

function buildBuiltin(){
  const c = CHARACTERS[charKey];
  const root = parseSVG(
    `<svg viewBox="${c.viewBox || "0 0 420 560"}" xmlns="http://www.w3.org/2000/svg">${charSVG(c)}</svg>`);
  parts = splitRoot(root);
  resetFits();
  compose();
}
function buildCustom(text){
  parts = splitRoot(parseSVG(text));
  resetFits();
  compose();
  report("✅");
}

/* ================================================================
   パーツ指定読み込み + 配置調整(スケール/位置)
================================================================ */
const PART_OPTIONS = [
  ["full",        "全体(まるごと)"],
  ["head",        "顔まわり全部"],
  ["hairFront",   "前髪"],
  ["hairBack",    "後ろ髪"],
  ["face",        "輪郭"],
  ["features",    "顔パーツ一式"],
  ["browL",       "左眉"],
  ["browR",       "右眉"],
  ["eyeL",        "左目"],
  ["eyeR",        "右目"],
  ["mouthOpen",   "口(開)"],
  ["mouthClosed", "口(閉)"],
  ["body",        "体"],
  ["armL",        "左腕"],
  ["armR",        "右腕"],
  ["armF",        "手前腕(横向き)"],
  ["armB",        "奥腕(横向き)"],
  ["legF",        "前脚(横向き)"],
  ["legB",        "奥脚(横向き)"],
  ["weapon",      "武器"],
  ["swing_add",   "揺れ物として追加"],
];
const PART_LABELS = Object.fromEntries(PART_OPTIONS);

/* defs内のidを改名して衝突を防ぐ。改名後のdefs文字列を返す */
let importSeq = 0;
function renameDefs(root){
  importSeq++;
  const rename = {};
  root.querySelectorAll("defs [id]").forEach(e => {
    const nid = e.id + "_imp" + importSeq;
    rename[e.id] = nid;
    e.setAttribute("id", nid);
  });
  if(Object.keys(rename).length){
    root.querySelectorAll("*").forEach(e => {
      for(const at of [...e.attributes]){
        let val = at.value;
        for(const [o, n] of Object.entries(rename)){
          val = val.split(`url(#${o})`).join(`url(#${n})`);
          if((at.name === "href" || at.name === "xlink:href") && val === "#" + o) val = "#" + n;
        }
        if(val !== at.value) e.setAttribute(at.name, val);
      }
    });
  }
  let defsStr = "";
  [...root.children].forEach(ch => {
    if(ch.tagName.toLowerCase() === "defs") defsStr += ser.serializeToString(ch);
  });
  return defsStr;
}
const partsToStr = cdoc => [...cdoc.documentElement.children].map(ch => ser.serializeToString(ch)).join("");
const parseFrag = str => new DOMParser().parseFromString(`<svg xmlns="${SVGNS}">${str}</svg>`, "image/svg+xml");

function removeIdFromParts(id){
  for(const key of ["head","body","rest"]){
    if(!parts[key]) continue;
    const cdoc = parseFrag(parts[key]);
    const t = cdoc.querySelector("#" + CSS.escape(id));
    if(t){ t.remove(); parts[key] = partsToStr(cdoc); }
  }
}

/* 配置調整(fit):読み込んだパーツを包むグループに transform を適用 */
const fits = {};
let fitCount = 0;
function applyFits(){
  Object.entries(fits).forEach(([id, f]) => {
    const el = svg.querySelector("#" + CSS.escape(id));
    if(el) el.setAttribute("transform",
      `translate(${f.x},${f.y}) translate(${f.cx},${f.cy}) scale(${f.s}) translate(${-f.cx},${-f.cy})`);
  });
}
function resetFits(){
  Object.keys(fits).forEach(k => delete fits[k]);
  refreshFitUI(null);
}
function refreshFitUI(sel){
  const box = $("fitBox"), fs = $("fitSel");
  const keys = Object.keys(fits);
  if(!keys.length){ box.style.display = "none"; return; }
  box.style.display = "";
  fs.innerHTML = keys.map(k => `<option value="${k}">${fits[k].label}</option>`).join("");
  fs.value = sel || keys[keys.length - 1];
  syncFitSliders();
}
function syncFitSliders(){
  const f = fits[$("fitSel").value];
  if(!f) return;
  fitRows.forEach(r => {
    r.slider.value = f[r.k];
    r.out.textContent = (+f[r.k]).toFixed(r.dec);
  });
}

/* パーツ指定読み込み本体 */
function loadPart(targetId, text){
  const root = parseSVG(text);
  const defsStr = renameDefs(root);

  /* ファイル内に同じidがあればそれを、なければ非defs全体を対象パーツにする */
  let content = targetId.startsWith("swing_add")
    ? null : root.querySelector("#" + CSS.escape(targetId));
  if(!content){
    content = root.ownerDocument.createElementNS(SVGNS, "g");
    content.setAttribute("id", targetId);
    [...root.children].forEach(ch => {
      if(ch.tagName.toLowerCase() !== "defs") content.appendChild(ch);
    });
  }

  /* fitラッパーで包む(配置調整用) */
  fitCount++;
  const fitId = "fit" + fitCount;
  const wrapEl = root.ownerDocument.createElementNS(SVGNS, "g");
  wrapEl.setAttribute("id", fitId);
  wrapEl.appendChild(content);

  /* 口を差し替える場合、組み込みの自動生成口(#mouth)を除去 */
  if(targetId.startsWith("mouth")) removeIdFromParts("mouth");

  /* 現在の構成へ差し込み */
  let replaced = false;
  if(targetId === "head"){ parts.head = ser.serializeToString(wrapEl); replaced = true; }
  else if(targetId === "body"){ parts.body = ser.serializeToString(wrapEl); replaced = true; }
  else{
    for(const key of ["head", "body", "rest"]){
      if(!parts[key]) continue;
      const cdoc = parseFrag(parts[key]);
      const hit = cdoc.querySelector("#" + CSS.escape(targetId));
      if(hit){
        hit.parentNode.replaceChild(cdoc.importNode(wrapEl, true), hit);
        parts[key] = partsToStr(cdoc);
        replaced = true;
        break;
      }
    }
    if(!replaced){
      /* 既存パーツが無ければ追加。顔パーツは features の中に入れて
         輪郭より前・前髪より後ろの正しい層に収める */
      const cdoc = parseFrag(parts.head || '<g id="head"></g>');
      const isFacePart = /^(brow|eye|iris|mouth|blush)/.test(targetId);
      const container = (isFacePart && cdoc.querySelector("#features"))
        || cdoc.querySelector("#head") || cdoc.documentElement;
      container.appendChild(cdoc.importNode(wrapEl, true));
      parts.head = partsToStr(cdoc);
    }
  }
  parts.defs += defsStr;

  const label = PART_LABELS[targetId] || (targetId.startsWith("swing_add") ? "揺れ物" : targetId);
  fits[fitId] = {s:1, x:0, y:0, cx:0, cy:0, label: label + " #" + fitCount};
  compose();
  const felm = svg.querySelector("#" + fitId);
  if(felm){
    const b = safeBBox(felm);
    fits[fitId].cx = b.x + b.width/2;
    fits[fitId].cy = b.y + b.height/2;
  }
  refreshFitUI(fitId);
  report("🧩 「" + label + "」を" + (replaced ? "差し替えました。" : "追加しました。"));
}

/* 配置調整スライダーを構築 */
const fitDefs = [
  {k:"s", name:"倍率",  min:0.2,  max:3,   step:0.01, dec:2},
  {k:"x", name:"位置X", min:-200, max:200, step:1,    dec:0},

];

  const row = document.createElement("div");

    <input type="range" min="${d.min}" max="${d.max}" step="${d.step}">
    <output></output>`;
  const slider = row.querySelector("input"), out = row.querySelector("output");
  slider.addEventListener("input", () => {
    const f = fits[$("fitSel").value];

    f[d.k] = parseFloat(slider.value);

});

/* SVG読み込み(パーツ選択に応じて全体 or 指定パーツ) */
$("loadBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const mode = partSel.value;
      if(mode === "full"){
        customText = reader.result;
        buildCustom(customText);
        if(!customBtn){
          customBtn = addCharBtn("カスタム", "#aaa", () => { try{ buildCustom(customText); }catch(_){} });
        }
        document.querySelectorAll(".charBtn").forEach(x => x.classList.remove("sel"));
        customBtn.classList.add("sel");
      }else if(mode === "swing_add"){
        loadPart("swing_add" + (fitCount + 1), reader.result);
      }else{
        loadPart(mode, reader.result);
      }
    }catch(err){
      loadStatus.className = "err";
      loadStatus.textContent = "⚠ " + err.message;
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

 pivot_〇〇 の circle は回転支点(読み込み時に非表示になります)。

  row.innerHTML = `<label>${d.name}</label>
    <input type="range" min="${d.min}" max="${d.max}" step="0.01" value="${d.def}">
    <output>${d.def.toFixed(1)}</output>`;
  const slider = row.querySelector("input");
  slider.addEventListener("input", () => {
    tgt[d.key] = cur[d.key] = parseFloat(slider.value);
    userHold[d.key] = performance.now() + 1500;
  });
  paramsBox.appendChild(row);
  rows[d.key] = {row, slider, out: row.querySelector("output")};
});

/* ================================================================
   自動トグル / マウス追従 / まばたき
================================================================ */
const auto = {track:true, blink:true, breath:true, idle:true, fakeTalk:false};
document.querySelectorAll(".toggle[data-auto]").forEach(t => {
  t.addEventListener("click", () => {
    const k = t.dataset.auto;
    auto[k] = !auto[k];
    t.classList.toggle("on", auto[k]);
  });
});

const stage = $("stage");
let mouse = {x:0, y:0};
function track(e){
  const r = stage.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  mouse.x = ((p.clientX - r.left) / r.width  - 0.5) * 2;
  mouse.y = ((p.clientY - r.top)  / r.height - 0.5) * 2;
}
stage.addEventListener("mousemove", track);
stage.addEventListener("touchmove", e => { track(e); e.preventDefault(); }, {passive:false});
stage.addEventListener("touchstart", track);

let blinkT = 0, nextBlink = 2;
function blinkValue(dt){
  if(!auto.blink) return null;
  nextBlink -= dt;
  if(nextBlink <= 0 && blinkT <= 0){
    blinkT = 0.28;
    /* たまに二連まばたき(ぱちぱち) */
    nextBlink = Math.random() < 0.22 ? 0.34 : 1.5 + Math.random()*4;
  }
  if(blinkT > 0){
    blinkT -= dt;
    const p = 1 - Math.max(blinkT,0)/0.28;
    return p < .5 ? 1 - p*2 : (p-.5)*2;
  }
  return null;
}

/* ================================================================
   口パク:マイク連動 + 自動口パク
================================================================ */
let micOn = false, audioCtx = null, analyser = null, micData = null, micStream = null;
let mouthMic = 0, mouthFake = 0, fakeTimer = 0, fakeTarget = 0;
const micBtn = $("micBtn"), micStatus = $("micStatus");

micBtn.addEventListener("click", async () => {
  if(micOn){
    micOn = false;
    micBtn.classList.remove("on");
    if(micStream) micStream.getTracks().forEach(t => t.stop());
    micStatus.textContent = "";
    return;
  }
  try{
    micStatus.textContent = "マイクの許可を待っています…";
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    micData = new Uint8Array(analyser.fftSize);
    micOn = true;
    micBtn.classList.add("on");
    micStatus.textContent = "🎙 マイクの音量で口が動きます。話しかけてみてください";
  }catch(err){
    micStatus.textContent = "⚠ マイクを使えませんでした(権限拒否 or 非対応環境)。「自動口パク」をどうぞ";
  }
});
function micLevel(){
  analyser.getByteTimeDomainData(micData);
  let sum = 0;
  for(let i = 0; i < micData.length; i++){
    const d = (micData[i] - 128) / 128;
    sum += d * d;
  }
  return Math.sqrt(sum / micData.length);
}

        o.posX = -14 + 139*p; o.angleZ = 10 - 32*p; o.jumpY = 4 - 4*p;
        o.legF = 24*Math.sin(p*Math.PI*3); o.legB = -24*Math.sin(p*Math.PI*3);
        o.armL = 0.3; o.armR = 0.3; o.mouthOpen = 0.5; }
      else if(t < 0.65){ const p = (t-0.5)/0.15;
        o.posX = 125 - 45*p; o.angleZ = -22 + 30*p;
        o.jumpY = -8*Math.sin(p*Math.PI); o.armL = 0.3; o.armR = 0.3; }
      else{ const p = 1-(t-0.65)/0.35;
        o.posX = 80*p; o.angleZ = 8*p; } }},
  hitaway:  {dur:1.0, fn:(t,o)=>{                     /* ヒット&アウェイ */
      if(t < 0.3){ const p = Math.sin((t/0.3)*Math.PI/2);
        o.posX = 118*p; o.armR = 0.2*p;
        o.legF = 20*Math.sin(t*22); o.legB = -20*Math.sin(t*22); }
      else if(t < 0.42){ const p = (t-0.3)/0.12;
        o.posX = 118 + 6*p; o.armR = 0.2 + 0.95*p;
        o.legF = -18; o.legB = 14; o.mouthOpen = 0.5; }
      else if(t < 0.7){ const p = (t-0.42)/0.28;
        o.posX = 124 - 170*p; o.jumpY = -18*Math.sin(p*Math.PI);
        o.angleZ = 10*p; o.armR = 1.15 - 1.15*p; }
      else{ const p = 1-(t-0.7)/0.3;
        o.posX = -46*p; o.angleZ = 10*p; } }},
  escape:   {dur:0.8, fn:(t,o)=>{                     /* 大バクステ: 二段跳びで後退 */
      const env = t < 0.25 ? t/0.25 : t < 0.65 ? 1 : (1-t)/0.35;
      o.posX = -120*env;
      o.jumpY = -16*Math.abs(Math.sin(t*Math.PI*2)) * (t < 0.8 ? 1 : (1-t)*5);
      o.angleZ = 10*env;
      o.legF = -16*Math.sin(t*Math.PI*2); o.legB = 16*Math.sin(t*Math.PI*2); }},
  jumpin:   {dur:1.0, fn:(t,o)=>{                     /* 飛び込み斬り: 大ジャンプ→着地 */
      if(t < 0.2){ const p = t/0.2;
        o.jumpY = 12*p; o.armR = -0.4*p; o.angleY = -6*p; }
      else if(t < 0.6){ const p = (t-0.2)/0.4;
        o.jumpY = 12 - 84*Math.sin(p*Math.PI); o.posX = 120*p;
        o.armR = -0.4 + 1.6*p; o.angleY = -6 + 16*p; o.angleZ = -10*p;
        o.legF = -26*p; o.legB = 20*p;
        if(p > 0.6) o.mouthOpen = 0.6; }
      else if(t < 0.75){ const p = (t-0.6)/0.15;
        o.jumpY = 10*Math.sin(p*Math.PI); o.posX = 120;
        o.armR = 1.2 - 0.6*p; o.angleY = 10 - 10*p;
        o.legF = -26 + 12*p; o.legB = 20 - 10*p; }
      else{ const p = 1-(t-0.75)/0.25;
        o.posX = 120*p; o.armR = 0.6*p;
        o.jumpY = -8*Math.sin((1-p)*Math.PI); } }},
};

const BATTLE_DEMO = [

function runDemoStep(i){
  if(!demoOn) return;
  const st = BATTLE_DEMO[i % BATTLE_DEMO.length];
  if(st.exp) setExpressionByName(st.exp);
  if(st.loop !== undefined) setLoop(st.loop);
  let waitMs = (st.wait || 0) * 1000;
  if(st.motion){
    playMotion(st.motion);
    waitMs += MOTIONS[st.motion].dur * 1000 + 100;
  }
  demoTimer = setTimeout(() => runDemoStep(i + 1), Math.max(waitMs, 60));
}

  demoOn = !!on;

/* ================================================================
   口(組み込みキャラの動的パス) / バネ
================================================================ */
function mouthPath(open, form){
  const cx=210, cy=289, w=13+open*9, curve=form*7, h=open*17;
  if(open < 0.06){
    return `M ${cx-w},${cy} Q ${cx},${cy+curve} ${cx+w},${cy}`;
  }
  return `M ${cx-w},${cy} Q ${cx},${cy+curve*0.6} ${cx+w},${cy}
          Q ${cx+w*0.7},${cy+h} ${cx},${cy+h}
          Q ${cx-w*0.7},${cy+h} ${cx-w},${cy} Z`;
}
function spring(s, target, k, damp, dt){
  s.v += (target - s.a) * k * dt;
  s.v *= Math.pow(damp, dt*60);
  s.a += s.v * dt;
}

/* ================================================================
   メインループ
================================================================ */
let last = performance.now(), idleT = 0;
const prevShown = {};

function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  idleT += dt;

  if(auto.track){
    if(!held("angleX")) tgt.angleX = mouse.x * 28;
    if(!held("angleY")) tgt.angleY = -mouse.y * 24;
    if(!held("eyeX"))   tgt.eyeX   = mouse.x;
    if(!held("eyeY"))   tgt.eyeY   = mouse.y;
    if(!held("bodyZ"))  tgt.bodyZ  = mouse.x * 5;
  }
  if(auto.idle && !held("angleZ")) tgt.angleZ = Math.sin(idleT*0.7)*3;
  /* アイドル仕草: 待機中(モーション・ループなし)に小さな可愛い動きを自動再生 */
  if(auto.idle && !motion && !loopKey){
    microNext -= dt;
    if(microNext <= 0){
      microNext = 5 + Math.random()*7;
      const mm = MICRO[(Math.random()*MICRO.length)|0];
      motion = {t:0, name:"_micro", dur:mm.dur, fn:mm.fn};
    }
  }
  const breath = auto.breath ? (Math.sin(idleT*1.6)+1)/2 : 0;

  const off = {};
  if(motion){
    motion.t += dt/motion.dur;
    if(motion.t >= 1){
      const ended = motion.name;
      motion = null;
      if(ended !== "_micro"){
      if(window.chara && typeof window.chara.onMotionEnd === "function") window.chara.onMotionEnd(ended);
      if(window.parent !== window) window.parent.postMessage({chara:{event:"motionEnd", name:ended}}, "*");
      /* Flutter(webview_flutter JavaScriptChannel)向け通知 */
      if(window.FlutterBridge) FlutterBridge.postMessage(JSON.stringify({event:"motionEnd", name:ended}));
      }
    }else{
      motion.fn(motion.t, off);
    }
  }
  let lo = {};
  if(loopKey){ loopT += dt; lo = LOOPS[loopKey](loopT); }

  const ease = 1 - Math.pow(0.0015, dt);
  DEFS.forEach(d => { cur[d.key] += (tgt[d.key] - cur[d.key]) * ease; });

  const v = {...cur};
  ["angleX","angleY","angleZ","bodyZ","armL","armR","legF","legB","eyeX","eyeY"].forEach(k => {
    v[k] += (off[k] || 0) + (lo[k] || 0);
  });
  v.eyeX = clamp(v.eyeX, -1, 1);
  v.eyeY = clamp(v.eyeY, -1, 1);
  /* 戦闘モーションで振りかぶり(負)や大振り(1超)を許容 */
  v.armL = clamp(v.armL, -0.6, 1.3);
  v.armR = clamp(v.armR, -0.6, 1.3);
  const posX = (off.posX || 0) + (lo.posX || 0);   // 前後移動(踏み込み・ノックバック)

  let eyeOpen = v.eyeOpen * exp.eyeMul + (off.eyeBoost || 0);
  const blink = blinkValue(dt);
  if(blink !== null) eyeOpen *= blink;
  if(off.eyeScale !== undefined) eyeOpen *= off.eyeScale;
  if(lo.eyeScale  !== undefined) eyeOpen *= lo.eyeScale;
  eyeOpen = clamp(eyeOpen, 0, 1.25);

  if(micOn && analyser){
    const lvl = clamp((micLevel() - 0.015) * 14, 0, 1);
    mouthMic += (lvl - mouthMic) * Math.min(1, dt*22);
  }else mouthMic *= 0.9;
  if(auto.fakeTalk){
    fakeTimer -= dt;
    if(fakeTimer <= 0){
      fakeTimer = 0.06 + Math.random()*0.13;
      fakeTarget = Math.random() < 0.25 ? 0 : Math.random()*0.9;
    }
    mouthFake += (fakeTarget - mouthFake) * Math.min(1, dt*22);
  }else mouthFake *= 0.9;

  const mouthOpen = clamp(Math.max(
    v.mouthOpen,
    exp.mouthOpen*0.6 + v.mouthOpen*0.4,
    off.mouthOpen || 0,
    lo.mouthMin || 0,
    mouthMic, mouthFake
  ), 0, 1);
  const talking = mouthMic > 0.05 || (auto.fakeTalk && mouthFake > 0.05);
  const mouthForm = talking ? v.mouthForm*0.6 : (v.mouthForm*0.5 + exp.mouthForm*0.5);
  const browY = exp.browY + (off.browY || 0) + (lo.browY || 0);
  const browA = exp.browA;

  /* ---- リグへ反映 ---- */
  const r = rig;
  if(!r){ requestAnimationFrame(loop); return; }
  const jy = (off.jumpY || 0) + (lo.jumpY || 0);
  const brY = -breath*3;

  if(r.body){
    const s = 1 + breath*0.012;
    const [px, py] = r.body.p;
    r.body.w.setAttribute("transform",
      `translate(${posX},${jy + brY*0.6}) rotate(${v.bodyZ} ${px} ${py}) translate(0,${py*(1-s)}) scale(1,${s})`);
  }
  if(r.head){
    const [px, py] = r.head.p;
    /* 首すっぽ抜け防止: 傾き(角度Z)が大きいほど回転支点を
       首の接点(pivot_neck)側へ滑らかに寄せる。小さな揺れは従来の支点のまま */
    let ry = py;
    if(r.head.neck){
      const nt = Math.min(1, Math.abs(v.angleZ) / 16);
      ry = py + (r.head.neck[1] - py) * nt;
    }
    r.head.w.setAttribute("transform",
      `translate(${v.angleX*0.9 + posX},${-v.angleY*0.7 + jy + brY}) rotate(${v.angleZ} ${px} ${ry})`);
  }
  if(r.hairBack)  r.hairBack.setAttribute("transform",  `translate(${-v.angleX*0.35},${v.angleY*0.22})`);
  if(r.face)      r.face.setAttribute("transform",      `translate(${-v.angleX*0.10},${v.angleY*0.06})`);
  if(r.features)  r.features.setAttribute("transform",  `translate(${v.angleX*0.45},${-v.angleY*0.30})`);
  if(r.hairFront) r.hairFront.setAttribute("transform", `translate(${v.angleX*0.18},${-v.angleY*0.12})`);

  const closed = eyeOpen < 0.15;
  r.eyes.forEach(eye => {
    const sy = Math.max(eyeOpen, eye.closed ? 0.02 : 0.06);
    eye.w.setAttribute("transform", `translate(0,${eye.cy*(1-sy)}) scale(1,${sy})`);
    if(eye.closed){
      eye.w.style.opacity = closed ? 0 : 1;
      eye.closed.style.opacity = closed ? 1 : 0;
    }
    if(eye.iris) eye.iris.setAttribute("transform",
      `translate(${v.eyeX*eye.ampX},${v.eyeY*eye.ampY})`);
  });
  r.brows.forEach(b => {
    b.w.setAttribute("transform", `translate(0,${browY}) rotate(${b.sign*browA} ${b.cx} ${b.cy})`);
  });
  if(r.mouth){
    if(r.mouth.dynamic){
      r.mouth.dynamic.setAttribute("d", mouthPath(mouthOpen, mouthForm));
      r.mouth.dynamic.setAttribute("fill", mouthOpen < 0.06 ? "none" : "#b34d63");
    }else{
      const opened = mouthOpen >= 0.06;
      if(r.mouth.closed) r.mouth.closed.style.opacity = opened ? 0 : 1;
      if(r.mouth.open){
        r.mouth.openEl.style.opacity = opened ? 1 : 0;
        const s = Math.max(mouthOpen, 0.1);
        r.mouth.open.setAttribute("transform",
          `translate(0,${r.mouth.topY*(1-s)}) scale(1,${s})`);
      }
    }
  }
  r.blush.forEach(b => b.style.opacity = exp.blush);

  if(r.armL){
    const deg = v.armL*150 - ((off.armWigL || 0) + (lo.armWigL || 0));
    r.armL.w.setAttribute("transform", `rotate(${deg} ${r.armL.p[0]} ${r.armL.p[1]})`);
  }
  if(r.armR){
    const deg = -v.armR*150 + ((off.armWigR || 0) + (lo.armWigR || 0));
    r.armR.w.setAttribute("transform", `rotate(${deg} ${r.armR.p[0]} ${r.armR.p[1]})`);
  }
  if(r.legF) r.legF.w.setAttribute("transform", `rotate(${v.legF} ${r.legF.p[0]} ${r.legF.p[1]})`);
  if(r.legB) r.legB.w.setAttribute("transform", `rotate(${v.legB} ${r.legB.p[0]} ${r.legB.p[1]})`);
  r.swings.forEach(p => {
    let target;
    if(p.wag){
      target = -v.bodyZ*2 + Math.sin(idleT*2.2)*12;
    }else{
      target = -v.angleZ*p.fz - v.angleX*p.fx;
      if(p.twitch && Math.random() < dt*0.35) p.s.v += 90*(Math.random()-0.5);
    }
    spring(p.s, target, p.k, p.damp, dt);
    p.w.setAttribute("transform", `rotate(${p.s.a} ${p.p[0]} ${p.p[1]})`);
  });

  /* ---- パネル表示 ---- */
  DEFS.forEach(d => {
    const k = d.key, row = rows[k];
    const val = cur[k];
    row.out.textContent = val.toFixed(Math.abs(d.max) <= 1 ? 2 : 1);
    if(document.activeElement !== row.slider) row.slider.value = val;
    const moving = Math.abs(val - (prevShown[k] ?? val)) > (d.max - d.min) * 0.002;
    row.row.classList.toggle("live", moving);
    prevShown[k] = val;
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
