<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131320'/%3E%3Cpath d='M32 56 L13 43 L8 9 L26 21 Q32 17 38 21 L56 9 L51 43 Z' fill='%23D9A94C'/%3E%3C/svg%3E">
<meta name="theme-color" content="#131320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦闘シーン — SVG モーション ゲーム支援システム</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;}
  #scene{position:relative; width:100%; height:100%; background:#87c8ea; overflow:hidden;}
  #scene.shake{animation:shake .25s;}
  @keyframes shake{
    0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)}
    40%{transform:translate(7px,-3px)} 60%{transform:translate(-5px,2px)} 80%{transform:translate(4px,-2px)}
  }
  /* 背景 */
  #bgSvg,#bgImg{position:absolute; inset:0; width:100%; height:100%;}
  #bgImg{object-fit:cover; display:none;}
  .cloud{animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(-15%);} to{transform:translateX(115%);}}
  /* キャラ */
  /* 画面幅が狭くても重ならないよう、サイズは画面幅にも連動させて端に寄せる */
  .fighter{position:absolute; bottom:2vh;
    height:min(58vh, 34vw); width:min(58vh, 34vw);
    transition:transform .18s ease-out; pointer-events:none;}
  .fighter iframe{width:100%; height:100%; border:none; background:transparent;}
  #pWrap{left:4vw;}
  #eWrap{right:4vw;}
  /* HPバー */
  .hud{position:absolute; top:12px; width:28%; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.5); font-size:14px; font-weight:bold;}
  #pHud{left:16px;} #eHud{right:16px; text-align:right;}
  .hpOuter{height:16px; margin-top:4px; background:rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.8); border-radius:9px; overflow:hidden;}
  .hpInner{height:100%; width:100%; border-radius:6px;
    background:linear-gradient(#8ef78e,#35c14f); transition:width .25s;}
  #eHud .hpInner{background:linear-gradient(#ff9d9d,#e04545); float:right;}
  /* メッセージ */
  #msg{position:absolute; top:34%; left:0; right:0; text-align:center;
    font-size:42px; font-weight:bold; color:#fff; letter-spacing:.1em;
    text-shadow:0 2px 8px rgba(0,0,0,.5); opacity:0; transition:opacity .3s;
    pointer-events:none;}
  #msg.show{opacity:1;}
  /* エフェクト */
  .spark{position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, #fff 0%, #ffe066 40%, rgba(255,150,50,0) 70%);
    animation:spark .35s ease-out forwards;}
  @keyframes spark{from{transform:scale(.3); opacity:1;} to{transform:scale(1.6); opacity:0;}}
  .dmg{position:absolute; font-size:30px; font-weight:bold; color:#ffec6e;
    text-shadow:0 2px 4px rgba(0,0,0,.6); pointer-events:none;
    animation:rise .8s ease-out forwards;}
  .dmg.toPlayer{color:#ff8f8f;}
  @keyframes rise{from{transform:translateY(0); opacity:1;} to{transform:translateY(-60px); opacity:0;}}
  .guardTxt{color:#8fd8ff !important;}
  /* 操作 */
  #controls{position:absolute; top:60px; left:0; right:0;
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
  #controls button{
    font-size:15px; font-weight:bold; padding:12px 20px; border-radius:12px;
    border:2px solid rgba(255,255,255,.85); color:#fff; cursor:pointer;
    background:rgba(20,26,44,.72); backdrop-filter:blur(2px); transition:all .12s;
    font-family:inherit;
  }
  #controls button:hover{background:rgba(50,60,95,.85);}
  #controls button:active{transform:scale(.94);}
  #controls button:disabled{opacity:.35; cursor:default;}
  #controls button.sub{font-size:12px; padding:10px 12px; font-weight:normal;}
  input[type=file]{display:none;}
  #hint{position:absolute; top:112px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.85); font-size:12px; text-shadow:0 1px 3px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="scene">
  <!-- 背景(SVG。あとで画像に差し替え可能) -->

        <stop offset="0%" stop-color="#6db4e8"/>

        <stop offset="100%" stop-color="#eaf6fd"/>

      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9ed36a"/>
        <stop offset="100%" stop-color="#5da03f"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="675" fill="url(#sky)"/>
    <circle cx="1010" cy="110" r="52" fill="#fff2b8" stroke="#ffe27a" stroke-width="8" opacity=".95"/>

    <g class="cloud" style="animation-duration:70s">
      <g fill="#ffffff" opacity=".9">
        <ellipse cx="180" cy="120" rx="70" ry="24"/><ellipse cx="230" cy="106" rx="46" ry="20"/><ellipse cx="130" cy="108" rx="40" ry="17"/>
      </g>
    </g>
    <g class="cloud" style="animation-duration:105s; animation-delay:-40s">
      <g fill="#ffffff" opacity=".75">
        <ellipse cx="520" cy="70" rx="58" ry="19"/><ellipse cx="562" cy="58" rx="36" ry="15"/>
      </g>
    </g>
    <!-- 遠い山 -->
    <path d="M-20,470 L150,260 L260,400 L370,240 L520,470 Z" fill="#9db4d8"/>
    <path d="M330,470 L560,210 L700,380 L820,250 L1050,470 Z" fill="#8aa3cc"/>
    <path d="M760,470 L950,290 L1080,390 L1240,300 L1260,470 Z" fill="#9db4d8"/>
    <!-- 雪冠 -->
    <path d="M560,210 L604,262 L580,256 L560,272 L540,254 L522,262 Z" fill="#f2f7fd"/>
    <path d="M370,240 L402,282 L382,276 L366,290 L350,274 L338,282 Z" fill="#f2f7fd"/>
    <!-- 近い丘 -->
    <path d="M-20,675 L-20,520 C180,440 360,470 520,520 C700,575 900,470 1220,530 L1220,675 Z" fill="#7cbf58"/>
    <!-- 地面 -->
    <rect x="0" y="560" width="1200" height="115" fill="url(#ground)"/>
    <path d="M0,560 C200,548 420,566 640,556 C860,548 1040,564 1200,556 L1200,575 L0,575 Z" fill="#b7e08c" opacity=".8"/>
    <!-- 草と花 -->
    <g stroke="#3f7d2c" stroke-width="4" stroke-linecap="round">
      <path d="M120,640 v-22 M132,640 v-16 M144,640 v-20"/>
      <path d="M1010,650 v-20 M1024,650 v-14 M1038,650 v-19"/>
      <path d="M580,660 v-18 M592,660 v-13"/>
    </g>
    <g>
      <circle cx="200" cy="612" r="7" fill="#ff9ec0"/><circle cx="196" cy="606" r="4" fill="#ffd0e2"/>
      <circle cx="940" cy="622" r="7" fill="#ffd166"/><circle cx="936" cy="616" r="4" fill="#ffe9b0"/>
    </g>
  </svg>
  <img id="bgImg" alt="">

  <!-- キャラクター(左:ほんチい / 右:こてつ・左向き) -->
  <div class="fighter" id="pWrap">
    <iframe id="pFrame" allowtransparency="true"></iframe>
  </div>
  <div class="fighter" id="eWrap">
    <iframe id="eFrame" allowtransparency="true"></iframe>
  </div>

  <!-- HUD -->
  <div class="hud" id="pHud">ほんチい(正面)<div class="hpOuter"><div class="hpInner" id="pHp"></div></div></div>
  <div class="hud" id="eHud">ほんチい(横)<div class="hpOuter"><div class="hpInner" id="eHp"></div></div></div>
  <div id="msg"></div>
  <div id="hint">斬る・突きで攻撃 / 敵の攻撃はガードで軽減 / 必殺は大ダメージ(クールタイム長め)</div>

  <div id="controls">
    <button id="btnSlash">⚔ 斬る</button>
    <button id="btnThrust">➤ 突き</button>
    <button id="btnGuard">🛡 ガード</button>
    <button id="btnSpecial">✦ 必殺</button>
    <button class="sub" id="btnBg">🖼 背景画像を読み込み</button>
    <button class="sub" id="btnBgSvg" style="display:none">⛰ SVG背景に戻す</button>
    <button class="sub" id="btnReset">↺ リセット</button>
    <input type="file" id="bgInput" accept="image/*">
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const scene = $("scene");
const pFrame = $("pFrame"), eFrame = $("eFrame");
const pWrap = $("pWrap"), eWrap = $("eWrap");

/* ---------------- キャラ制御(postMessage) ---------------- */
function send(frame, cmd, arg, arg2){
  frame.contentWindow.postMessage({chara:{cmd, arg, arg2}}, "*");
}
let ready = 0;
function initFighter(frame){
  send(frame, "auto", "track", false);   // マウス追従OFF(戦闘中は正面を見る)
  send(frame, "loop", "stance");         // 構え
}
pFrame.addEventListener("load", () => { initFighter(pFrame); if(++ready === 2) startBattle(); });
eFrame.addEventListener("load", () => { initFighter(eFrame); send(eFrame, "expression", "angry"); if(++ready === 2) startBattle(); });

/* ---------------- 戦闘状態 ---------------- */
const state = {
  p: {hp:100, max:100},
  e: {hp:100, max:100},
  over: false,
  guardUntil: 0,
  cooldownUntil: 0,
};
const ACTIONS = {
  slash:   {btn:"btnSlash",   dmg:[12,17], cd:1.1, impact:0.42},
  thrust:  {btn:"btnThrust",  dmg:[8,12],  cd:0.75, impact:0.28},
  special: {btn:"btnSpecial", dmg:[26,34], cd:4.5, impact:0.82},
};
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = ([a,b]) => Math.round(rand(a,b));

/* ---------------- 表示 ---------------- */
function updateHp(){
  $("pHp").style.width = Math.max(0, state.p.hp / state.p.max * 100) + "%";
  $("eHp").style.width = Math.max(0, state.e.hp / state.e.max * 100) + "%";
}
function showMsg(text, ms){
  const m = $("msg");
  m.textContent = text;
  m.classList.add("show");
  if(ms) setTimeout(() => m.classList.remove("show"), ms);
}
function center(wrap){
  const r = wrap.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height*0.55];
}
function spark(x, y){
  const d = document.createElement("div");
  d.className = "spark";
  d.style.left = x + "px"; d.style.top = y + "px";
  scene.appendChild(d);
  setTimeout(() => d.remove(), 400);
}
function dmgText(x, y, text, toPlayer, guard){
  const d = document.createElement("div");
  d.className = "dmg" + (toPlayer ? " toPlayer" : "") + (guard ? " guardTxt" : "");
  d.textContent = text;
  d.style.left = (x - 20 + rand(-14,14)) + "px";
  d.style.top = (y - 60) + "px";
  scene.appendChild(d);
  setTimeout(() => d.remove(), 850);
}
function shake(){
  scene.classList.remove("shake");
  void scene.offsetWidth;
  scene.classList.add("shake");
}
function lunge(wrap, dx){
  wrap.style.transform = `translateX(${dx}px)`;
  setTimeout(() => wrap.style.transform = "", 260);
}

/* ---------------- プレイヤーの攻撃 ---------------- */
function playerAttack(name){
  if(state.over || performance.now() < state.cooldownUntil) return;
  const act = ACTIONS[name];
  state.cooldownUntil = performance.now() + act.cd * 1000;
  setButtons();
  send(pFrame, "motion", name);
  lunge(pWrap, name === "special" ? 110 : 70);
  setTimeout(() => {
    if(state.over) return;
    const dmg = randInt(act.dmg);
    state.e.hp -= dmg;
    send(eFrame, "motion", "knockback");
    lunge(eWrap, 40);
    const [x, y] = center(eWrap);
    spark(x - 40, y);
    dmgText(x, y, "-" + dmg, false, false);
    shake();
    updateHp();
    checkEnd();
  }, act.impact * 1000);
}
function playerGuard(){
  if(state.over || performance.now() < state.cooldownUntil) return;
  state.cooldownUntil = performance.now() + 700;
  state.guardUntil = performance.now() + 1300;
  setButtons();
  send(pFrame, "motion", "guard");
}
$("btnSlash").addEventListener("click", () => playerAttack("slash"));
$("btnThrust").addEventListener("click", () => playerAttack("thrust"));
$("btnSpecial").addEventListener("click", () => playerAttack("special"));
$("btnGuard").addEventListener("click", playerGuard);
window.addEventListener("keydown", e => {
  if(e.key === "1") playerAttack("slash");
  if(e.key === "2") playerAttack("thrust");
  if(e.key === "3") playerGuard();
  if(e.key === "4") playerAttack("special");
});
function setButtons(){
  const wait = performance.now() < state.cooldownUntil;
  ["btnSlash","btnThrust","btnGuard","btnSpecial"].forEach(id => {
    $(id).disabled = state.over || wait;
  });
}
setInterval(setButtons, 120);

/* ---------------- 敵AI(こてつ) ---------------- */
let aiTimer = null;
function enemyTurn(){
  if(state.over) return;
  const useSpecial = state.e.hp < 40 && Math.random() < 0.3;
  const name = useSpecial ? "special" : (Math.random() < 0.6 ? "slash" : "thrust");
  const act = ACTIONS[name];
  send(eFrame, "motion", name);
  lunge(eWrap, name === "special" ? -110 : -70);
  setTimeout(() => {
    if(state.over) return;
    const guarded = performance.now() < state.guardUntil;
    let dmg = randInt(act.dmg);
    if(guarded){
      dmg = Math.max(1, Math.round(dmg * 0.2));
      send(pFrame, "motion", "guard");
    }else{
      send(pFrame, "motion", "knockback");
      shake();
    }
    state.p.hp -= dmg;
    lunge(pWrap, guarded ? -14 : -40);
    const [x, y] = center(pWrap);
    spark(x + 40, y);
    dmgText(x, y, (guarded ? "ガード! -" : "-") + dmg, true, guarded);
    updateHp();
    checkEnd();
  }, act.impact * 1000);
  aiTimer = setTimeout(enemyTurn, rand(1700, 3000));
}

/* ---------------- 勝敗 ---------------- */
function checkEnd(){
  if(state.over) return;
  if(state.e.hp <= 0){
    state.over = true;
    clearTimeout(aiTimer);
    send(eFrame, "loop", null);
    send(eFrame, "motion", "down");
    send(eFrame, "expression", "sad");
    send(pFrame, "expression", "happy");
    setTimeout(() => send(pFrame, "motion", "victory"), 400);
    showMsg("🌸 ほんチい(正面)の勝利!");
  }else if(state.p.hp <= 0){
    state.over = true;
    clearTimeout(aiTimer);
    send(pFrame, "loop", null);
    send(pFrame, "motion", "down");
    send(pFrame, "expression", "sad");
    send(eFrame, "expression", "happy");
    setTimeout(() => send(eFrame, "motion", "victory"), 400);
    showMsg("ほんチい(横)の勝利…");
  }
  setButtons();
}

/* ---------------- 開始・リセット ---------------- */
function startBattle(){
  state.p.hp = state.p.max;
  state.e.hp = state.e.max;
  state.over = false;
  state.guardUntil = 0;
  state.cooldownUntil = 0;
  $("msg").classList.remove("show");
  updateHp();
  initFighter(pFrame);
  initFighter(eFrame);
  send(pFrame, "expression", "normal");
  send(eFrame, "expression", "angry");
  showMsg("⚔ 戦闘開始!", 1200);
  clearTimeout(aiTimer);
  aiTimer = setTimeout(enemyTurn, 2200);
  setButtons();
}
$("btnReset").addEventListener("click", startBattle);

/* ---------------- 背景画像の差し替え ---------------- */
$("btnBg").addEventListener("click", () => $("bgInput").click());
$("bgInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    $("bgImg").src = reader.result;
    $("bgImg").style.display = "block";
    $("bgSvg").style.display = "none";
    $("btnBgSvg").style.display = "";
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});
$("btnBgSvg").addEventListener("click", () => {
  $("bgImg").style.display = "none";
  $("bgSvg").style.display = "";
  $("btnBgSvg").style.display = "none";
});

/* ================================================================
   キャラ本体(svg-motion-system.html)を丸ごと内蔵して srcdoc で起動。
   外部ファイル不要=このHTML単体でどこでも動く。
   各iframeには window.__CHARA_CONFIG でキャラ・向き・透過を指定する。
================================================================ */
const APP_SRC = new TextDecoder().decode(
  Uint8Array.from(atob(APP_B64), ch => ch.charCodeAt(0)));
function bootFighter(frame, config){
  const cfgTag = '<scr' + 'ipt>window.__CHARA_CONFIG=' + JSON.stringify(config) + '</scr' + 'ipt>';
  frame.srcdoc = APP_SRC.replace("<body>", "<body>" + cfgTag);
}
bootFighter(pFrame, {embed:1, clear:1, char:"koharu"});
bootFighter(eFrame, {embed:1, clear:1, char:"honchii_side", face:"left"});
</script>
</body>
</html>
