<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忍陣 — シノビジン</title>
<style>
  :root{
    --sumi:#14121a;        /* 墨 background */
    --sumi2:#1e1b26;
    --washi:#ece3d0;       /* 和紙 text */
    --washi-dim:#a89f8c;
    --ai:#3d6489;          /* 藍 自軍 */
    --ai-bright:#5b8fbf;
    --shu:#d8483b;         /* 朱 敵軍 */
    --shu-bright:#f06a5a;
    --sui:#5fa88c;         /* 翠 特殊 */
    --kin:#d9a93f;         /* 金 大将 */
    --line:#2c2836;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #241f30 0%, var(--sumi) 60%);
    color:var(--washi);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:14px; gap:12px; overflow-x:hidden;
  }
  header{text-align:center; user-select:none;}
  header h1{
    font-size:30px; letter-spacing:.35em; font-weight:700;
    text-indent:.35em;
    background:linear-gradient(#f4ecda,#c9bfa4); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .sub{font-size:11px; color:var(--washi-dim); letter-spacing:.3em; margin-top:2px;}

  /* 巻物のターン表示 */
  #banner{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  .stageTag{
    padding:5px 14px; border-radius:2px; font-size:13px; letter-spacing:.15em; font-weight:700;
    color:var(--kin); border:1px solid rgba(217,169,63,.45); background:rgba(217,169,63,.08);
    font-family:"Hiragino Mincho ProN",serif;
  }
  .turnTag{
    padding:5px 16px; border-radius:2px; font-size:13px; letter-spacing:.12em; font-weight:700;
    border:1px solid var(--line); background:var(--sumi2);
  }
  .turnTag.me{color:var(--ai-bright); border-color:var(--ai);}
  .turnTag.foe{color:var(--shu-bright); border-color:var(--shu);}
  .phase{font-size:12px; color:var(--washi-dim); letter-spacing:.1em;}

  #main{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; justify-content:center;}

  /* 盤面 */
  #boardWrap{position:relative;}
  #board{
    display:grid; gap:2px; padding:10px;
    background:linear-gradient(135deg,#efe6d2,#ddd0b4);
    border:2px solid #b7a889; border-radius:3px;
    box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 0 0 1px #cabf9f;
  }
  .cell{
    width:52px; height:52px; position:relative;
    background:rgba(30,24,40,.04);
    border:1px solid rgba(60,40,20,.12);
    cursor:default; transition:background .1s;
    display:flex; align-items:center; justify-content:center;
  }
  .cell.terrain-tree{ background:rgba(70,110,80,.22); }
  .cell.terrain-water{
    background:
      repeating-linear-gradient(-8deg,
        rgba(210,235,255,.10) 0 2px, transparent 2px 9px),
      linear-gradient(180deg,#28405e,#1b2c44);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(150,200,255,.15);
    border-color:rgba(20,40,70,.6);
    cursor:not-allowed;
  }
  .cell.terrain-roof{ background:rgba(90,70,60,.20); }
  .cell.terrain-shrine{
    background:radial-gradient(circle, rgba(255,226,140,.55) 0%, rgba(217,169,63,.25) 55%, rgba(30,24,40,.04) 80%);
    box-shadow:inset 0 0 0 2px rgba(217,169,63,.6), 0 0 14px rgba(217,169,63,.35);
    animation:shrineGlow 2.4s ease-in-out infinite alternate;}
  @keyframes shrineGlow{ from{box-shadow:inset 0 0 0 2px rgba(217,169,63,.5), 0 0 8px rgba(217,169,63,.25);}
        to{box-shadow:inset 0 0 0 2px rgba(255,226,140,.85), 0 0 20px rgba(217,169,63,.55);} }
  .unit.god svg{ filter:drop-shadow(0 0 7px rgba(255,150,60,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  .cell.move{ background:rgba(91,143,191,.30); cursor:pointer; }
  .cell.move:hover{ background:rgba(91,143,191,.48); }
  .cell.atk{ background:rgba(216,72,59,.32); cursor:crosshair; }
  .cell.atk:hover{ background:rgba(216,72,59,.5); }
  .cell.sel{ box-shadow:inset 0 0 0 3px var(--kin); }
  .coordLabel{position:absolute; font-size:8px; color:rgba(40,30,20,.35); top:1px; left:2px; pointer-events:none; font-family:monospace;}

  /* ユニット駒 */
  .itemScroll{position:absolute; inset:6px; pointer-events:none; z-index:1;
        animation:itemFloat 1.6s ease-in-out infinite alternate;}
  .itemScroll svg{width:100%; height:100%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  @keyframes itemFloat{ from{transform:translateY(0);} to{transform:translateY(-3px);} }
  .unit{width:48px; height:50px; position:relative; pointer-events:none;
        transition:transform .18s ease-out, filter .15s;}
  .unit svg{width:100%; height:100%; display:block;
        filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));}
  .unit.acted{ filter:grayscale(.7) opacity(.6); }
  .unit.leader::after{
    content:"大"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--sumi); background:var(--kin);
    width:15px; height:15px; border-radius:50%; line-height:15px; text-align:center;
    font-family:"Hiragino Mincho ProN",serif; font-weight:700;
    box-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .hpbar{position:absolute; bottom:-5px; left:4px; right:4px; height:4px;
        background:rgba(0,0,0,.45); border-radius:2px; overflow:hidden;}
  .hpbar > i{display:block; height:100%; transition:width .25s;}
  .side-me   .hpbar > i{ background:linear-gradient(#8fd0f0,var(--ai-bright)); }
  .side-foe  .hpbar > i{ background:linear-gradient(#ffb0a0,var(--shu-bright)); }

  /* 斬撃・手裏剣エフェクト */
  .fx{position:absolute; pointer-events:none; z-index:20;}
  .slash{width:60px; height:60px; margin:-30px 0 0 -30px;}
  .slash path{stroke:#fff; stroke-width:4; fill:none; stroke-linecap:round;
        animation:slashDraw .28s ease-out forwards;}
  @keyframes slashDraw{ from{stroke-dasharray:0 90;} to{stroke-dasharray:90 0; opacity:0;} }
  .splash{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
        background:radial-gradient(circle,#fff 0%,#f0d0b0 30%,rgba(216,72,59,0) 70%);
        animation:pop .32s ease-out forwards;}
  @keyframes pop{ from{transform:scale(.3);opacity:1;} to{transform:scale(1.6);opacity:0;} }
  .float{position:absolute; z-index:21; font-family:"Hiragino Kaku Gothic ProN",sans-serif;
        font-weight:700; font-size:19px; pointer-events:none;
        text-shadow:0 2px 3px rgba(0,0,0,.6); animation:rise .8s ease-out forwards;}
  @keyframes rise{ from{transform:translateY(0);opacity:1;} to{transform:translateY(-42px);opacity:0;} }

  /* 側パネル */
  #side{width:250px; display:flex; flex-direction:column; gap:12px;
        font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  .card{background:var(--sumi2); border:1px solid var(--line); border-radius:4px; padding:12px;}
  .card h2{font-size:11px; letter-spacing:.2em; color:var(--washi-dim); margin-bottom:8px;
        font-weight:700; text-transform:uppercase;}
  #info .noSel{font-size:12px; color:var(--washi-dim);}
  .infoName{font-family:"Hiragino Mincho ProN",serif; font-size:19px; letter-spacing:.08em; margin-bottom:2px;}
  .infoRole{font-size:11px; color:var(--sui); letter-spacing:.1em; margin-bottom:10px;}
  .stat{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px dashed var(--line);}
  .stat b{font-variant-numeric:tabular-nums; letter-spacing:.05em;}
  .stat.hp b{color:var(--sui);}

  .acts{display:flex; gap:8px; margin-top:10px;}
  .btn{flex:1; font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.08em;
        padding:9px 6px; border-radius:4px; cursor:pointer; transition:all .12s;
        border:1px solid var(--line); background:#26222f; color:var(--washi);}
  .btn:hover:not(:disabled){border-color:var(--ai); color:var(--ai-bright);}
  .btn:active:not(:disabled){transform:scale(.96);}
  .btn:disabled{opacity:.32; cursor:default;}
  .btn.wide{width:100%;}
  .btn.end{border-color:var(--shu); color:var(--shu-bright);}
  .btn.end:hover{background:rgba(216,72,59,.14);}

  #log{height:150px; overflow-y:auto; font-size:11.5px; line-height:1.7; color:var(--washi-dim);}
  #log .me{color:var(--ai-bright);}
  #log .foe{color:var(--shu-bright);}
  #log .sys{color:var(--kin);}

  .legend{font-size:10.5px; color:var(--washi-dim); line-height:1.9; letter-spacing:.03em;}
  .legend b{color:var(--washi);}

  /* 会話ウィンドウ */
  #dlg{position:fixed; inset:0; z-index:40; display:none; cursor:pointer;
        align-items:flex-end; justify-content:center;
        background:linear-gradient(transparent 55%, rgba(8,6,14,.72));}
  #dlg.show{display:flex;}
  .dlgBox{width:min(720px,94vw); margin-bottom:26px; padding:16px 22px 12px;
        background:linear-gradient(#211d2c,#191622);
        border:1px solid #4a4258; border-left:4px solid var(--kin);
        border-radius:4px; box-shadow:0 12px 36px rgba(0,0,0,.6);
        font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
  .dlgName{font-family:"Hiragino Mincho ProN",serif; font-size:16px; font-weight:700;
        letter-spacing:.12em; margin-bottom:6px;}
  .dlgText{font-size:14.5px; line-height:1.9; color:var(--washi); min-height:3.6em;}
  .dlgFoot{display:flex; justify-content:space-between; margin-top:8px;
        font-size:10.5px; color:var(--washi-dim); letter-spacing:.1em;}
  /* 台詞吹き出し */
  .bubble{position:absolute; z-index:22; transform:translate(-50%,-100%);
        max-width:180px; padding:7px 11px; border-radius:8px;
        background:#f2ecdf; color:#211c14;
        font-family:"Hiragino Kaku Gothic ProN",sans-serif;
        font-size:11.5px; font-weight:700; line-height:1.5; pointer-events:none;
        box-shadow:0 4px 12px rgba(0,0,0,.4);
        animation:bubbleIn 2.1s ease forwards;}
  .bubble::after{content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
        border:6px solid transparent; border-top-color:#f2ecdf; border-bottom:none;}
  .bubble.b-foe{background:#3a2226; color:#ffd8d0;}
  .bubble.b-foe::after{border-top-color:#3a2226;}
  @keyframes bubbleIn{
    0%{opacity:0; transform:translate(-50%,-90%) scale(.85);}
    8%{opacity:1; transform:translate(-50%,-100%) scale(1);}
    85%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-108%);}
  }
  /* レベル表示 */
  .lvlBadge{position:absolute; top:-3px; right:-1px; z-index:2;
        font-family:"Hiragino Kaku Gothic ProN",sans-serif; font-size:6.5px; font-weight:700;
        color:#14121a; background:rgba(125,184,232,.92);
        padding:0 2.5px; border-radius:5px; box-shadow:0 1px 1px rgba(0,0,0,.4);
        pointer-events:none; line-height:1.5;}
  .expbar{height:5px; background:rgba(0,0,0,.4); border-radius:3px; overflow:hidden; margin-top:4px;}
  .expbar > i{display:block; height:100%; background:linear-gradient(90deg,#8fd0a0,#5fa88c); transition:width .3s;}
  .lvUpFx{position:absolute; z-index:23; transform:translate(-50%,-50%); pointer-events:none;
        font-family:"Hiragino Mincho ProN",serif; font-size:15px; font-weight:700; color:#ffe27a;
        text-shadow:0 0 8px rgba(217,169,63,.9), 0 2px 3px rgba(0,0,0,.7);
        letter-spacing:.15em; animation:lvUp 1.1s ease-out forwards; white-space:nowrap;}
  @keyframes lvUp{ 0%{transform:translate(-50%,-30%) scale(.6); opacity:0;}
        20%{transform:translate(-50%,-60%) scale(1.15); opacity:1;}
        100%{transform:translate(-50%,-130%) scale(1); opacity:0;} }

  /* イズナ激怒の炎 */
  .rageFire{position:absolute; inset:-4px; z-index:19; pointer-events:none; border-radius:3px;
        background:radial-gradient(circle at 50% 65%, #fff2a0 0%, #ff9a3c 35%, #e0402a 65%, rgba(120,10,10,0) 90%);
        animation:rageBurn .9s ease-out forwards; mix-blend-mode:screen;}
  @keyframes rageBurn{
    0%{opacity:0; transform:scale(.4);}
    25%{opacity:1; transform:scale(1.1);}
    70%{opacity:.85; transform:scale(1);}
    100%{opacity:0; transform:scale(1.25);} }
  .rageFlash{position:fixed; inset:0; z-index:45; pointer-events:none;
        background:radial-gradient(circle, rgba(255,120,60,.35), rgba(160,20,20,.15));
        animation:rageFlash .8s ease-out forwards;}
  @keyframes rageFlash{ 0%{opacity:0;} 20%{opacity:1;} 100%{opacity:0;} }

  /* マップ選択カード内の選択ボタン */
  .mapOpts{display:flex; gap:8px; margin-top:10px;}
  .mapOpts button{flex:1; font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.06em;
        padding:7px 4px; border-radius:4px; cursor:pointer; transition:all .12s;
        border:1px solid var(--line); background:#26222f; color:var(--washi);}
  .mapOpts button:hover{border-color:var(--kin); color:var(--kin);}

  /* マップ選択 */
  #mapsel{position:fixed; inset:0; z-index:55; display:none;
        align-items:center; justify-content:center; flex-direction:column; gap:18px;
        background:rgba(10,8,16,.88); backdrop-filter:blur(3px); padding:20px;}
  #mapsel.show{display:flex;}
  #mapsel h2{font-family:"Hiragino Mincho ProN",serif; font-size:24px; letter-spacing:.3em;
        text-indent:.3em; color:var(--kin);}
  #mapsel .hint{font-size:12px; color:var(--washi-dim); letter-spacing:.12em;
        font-family:"Hiragino Kaku Gothic ProN",sans-serif;}
  #mapChoices{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
  .mapCard{width:250px; padding:16px 18px; border-radius:5px; cursor:pointer; text-align:left;
        background:linear-gradient(#242030,#1a1724); border:1px solid #4a4258;
        transition:all .15s; font-family:"Hiragino Kaku Gothic ProN",sans-serif; color:var(--washi);}
  .mapCard:hover{transform:translateY(-4px); border-color:var(--kin);
        box-shadow:0 10px 26px rgba(0,0,0,.55);}
  .mapCard .mTitle{font-family:"Hiragino Mincho ProN",serif; font-size:18px; letter-spacing:.1em;
        color:var(--kin); margin-bottom:6px;}
  .mapCard .mDesc{font-size:12px; line-height:1.8; color:var(--washi-dim);}
  .mapCard .mBoss{font-size:11px; margin-top:8px; color:var(--shu-bright); letter-spacing:.08em;}

  /* 勝敗オーバーレイ */
  #overlay{position:fixed; inset:0; z-index:50; display:none;
        align-items:center; justify-content:center; text-align:center;
        background:rgba(10,8,16,.82); backdrop-filter:blur(3px);}
  #overlay.show{display:flex;}
  #overlay .box{padding:38px 54px;}
  #overlay .kanji{font-family:"Hiragino Mincho ProN",serif; font-size:76px; letter-spacing:.3em;
        text-indent:.3em; margin-bottom:8px;}
  #overlay .win .kanji{color:var(--kin);}
  #overlay .lose .kanji{color:var(--shu-bright);}
  #overlay .msg{font-size:14px; color:var(--washi-dim); letter-spacing:.1em; margin-bottom:22px;
        font-family:"Hiragino Kaku Gothic ProN",sans-serif;}
  #overlay button{font-family:"Hiragino Kaku Gothic ProN",sans-serif; font-size:15px; font-weight:700;
        padding:12px 40px; border-radius:4px; cursor:pointer; letter-spacing:.15em;
        border:1px solid var(--kin); background:transparent; color:var(--kin); transition:all .15s;}
  #overlay button:hover{background:var(--kin); color:var(--sumi);}

  @media (max-width:640px){
    .cell{width:38px;height:38px;} .unit{width:34px;height:34px;}
    #side{width:100%; max-width:420px;}
  }
</style>
</head>
<body>
<header>
  <h1>忍陣</h1>
  <div class="sub">S H I N O B I &nbsp; J I N</div>
</header>

<div id="banner">
  <span class="stageTag" id="stageTitle">第一幕</span>
  <span class="turnTag me" id="turnTag">自軍のターン</span>
  <span class="phase" id="phaseTxt">駒を選んでください</span>
</div>

<div id="main">
  <div id="boardWrap"><div id="board"></div></div>

  <div id="side">
    <div class="card" id="info">
      <h2>選択中の忍</h2>
      <div class="noSel">盤上の駒をタップすると詳細が出ます。</div>
    </div>

    <div class="card">
      <button class="btn end wide" id="endTurnBtn">ターン終了 ▸</button>
      <button class="btn wide" id="debugSkip" style="margin-top:8px; opacity:.55; font-size:11px;">おわりから（三幕クリア後・デバッグ）</button>
      <button class="btn wide" id="debugSkip3" style="margin-top:6px; opacity:.55; font-size:11px;">三章から（デバッグ）</button>
    </div>

    <div class="card">
      <h2>戦況</h2>
      <div id="log"></div>
    </div>

    <div class="card">
      <h2>凡例</h2>
      <div class="legend">
        <b style="color:var(--kin)">大</b> 大将（倒されると敗北）<br>
        <b style="color:var(--ai-bright)">青マス</b> 移動できる場所<br>
        <b style="color:var(--shu-bright)">朱マス</b> 攻撃できる相手<br>
        森=回避↑ / 水=移動不可 / 屋根=防御↑
      </div>
    </div>
  </div>
</div>

<div id="dlg"><div class="dlgBox">
  <div class="dlgName" id="dlgName"></div>
  <div class="dlgText" id="dlgText"></div>
  <div class="dlgFoot"><span id="dlgStep"></span><span>タップで進む ▼</span></div>
</div></div>

<div id="mapsel">
  <h2>進軍先を選べ</h2>
  <div class="hint">次に攻める地を選択してください（タップで出陣）</div>
  <div id="mapChoices"></div>
</div>

<div id="overlay"><div class="box" id="overlayBox">
  <div class="kanji" id="overlayKanji">勝</div>
  <div class="msg" id="overlayMsg"></div>
  <button id="restartBtn">もう一戦</button>
  <button id="restartBtn2" style="display:none; margin-left:12px;">最初から</button>
</div></div>

<script>
"use strict";
/* ===================================================================
   忍陣 — テンミリオン風のマス目戦術SRPG（忍者テーマ・オリジナル）
   ・敵の大将を討てば勝ち／自分の大将が落ちれば負け
   ・自軍キャラ名は既存モーションシステムの忍者から引き継ぎ
     （疾風ハヤテ・息吹イブキ・イズナ・クオン）
=================================================================== */
const COLS=9, ROWS=8, TILE=52;
const $=s=>document.querySelector(s);
const board=$("#board");
board.style.gridTemplateColumns=`repeat(${COLS},1fr)`;

/* ---- 兵種定義（忍術っぽい役割） ---- */
const CLASS={
  taisho:{ name:"頭領", role:"大将・斬撃", hp:30, atk:9, def:3, move:3, range:1, evd:10 },
  slash: { name:"斬撃", role:"接近戦",     hp:24, atk:8, def:2, move:3, range:1, evd:12 },
  throw: { name:"手裏剣", role:"遠隔",     hp:18, atk:7, def:1, move:2, range:3, evd:8  },
  genjutsu:{name:"幻術", role:"広範囲",    hp:16, atk:6, def:1, move:3, range:2, evd:14 },
  heal:  { name:"回復", role:"癒し手",     hp:16, atk:3, def:1, move:3, range:1, evd:10, heal:8 },
  uka:   { name:"双刃", role:"遠撃と癒し・イズナの妹", hp:20, atk:7, def:2, move:4, range:2, evd:16, heal:6 },
  ukagod:{ name:"大炎神", role:"覚醒・焔を統べる者", hp:34, atk:12, def:4, move:5, range:2, evd:20, heal:10 },
  nise:  { name:"幻影", role:"偽りの姉", hp:14, atk:6, def:1, move:3, range:1, evd:20 },
  onmyo: { name:"陰陽師", role:"式神・超遠隔", hp:20, atk:8, def:2, move:3, range:3, evd:12 },
  shishou:{name:"師範", role:"団子と式神・シオンの師匠", hp:24, atk:9, def:2, move:3, range:2, evd:14, heal:7 },
  bomb:  { name:"爆撃", role:"爆弾・周囲を巻き込む", hp:18, atk:8, def:1, move:3, range:2, evd:10 },
  oni:   { name:"鬼衆", role:"敵・重装",   hp:22, atk:7, def:3, move:2, range:1, evd:4  },
  karasu:{ name:"烏", role:"敵・遊撃",     hp:16, atk:6, def:1, move:3, range:2, evd:12 },
};

/* ============================================================
   ステージ定義（3幕）

let units=[];
function makeRoster(){
  const st=STAGES[stageIdx];
  TERRAIN=st.terrain;
  const mine=[
    U("me","taisho","疾風ハヤテ",1,7),
    U("me","slash","息吹イブキ",0,6),
    U("me","throw","イズナ",2,6),
    U("me","genjutsu","ジン",1,5,true),
    U("me","heal","クオン",0,4),
  ];
  const sp=!!st.special;
  if(UKA_JOINED && !sp){
    if(UKA_GOD) mine.push(U("me","ukagod","大炎神ウカ",2,7));
    else mine.push(U("me","uka","ウカ",2,7));
  }
  if(SHION_JOINED && (st.ch2 || sp)){
    mine.push(U("me","onmyo","シオン",0,5));
    mine.push(U("me","shishou","アンネ",1,4));
    mine.push(U("me","bomb","ほんチい",0,3));
  }
  if(sp){ // 外伝: イズナは死亡中・ウカは敵側
    const ix=mine.findIndex(u=>u.name==="イズナ");
    if(ix>=0) mine.splice(ix,1);
  }
  // 大将の器：大将役はHP+6（脆い兵種でも大将を張れるように）
  mine.forEach(u=>{ if(u.leader){ u.maxhp+=6; u.hp=u.maxhp; } });
  // レベル成長を適用（名前ごとに持ち越し）
  mine.forEach(u=>{
    const p=progOf(u.name);
    u.maxhp+=p.hp; u.hp=u.maxhp;
    u.atkBonus=p.atk; u.defBonus=p.def;
  });
  // HP持ち越し（クリア報酬として最大値の40%回復、倒れた仲間は半分で復帰）
  if(carryHP){
    mine.forEach(u=>{
      const prev=carryHP[u.name];
      if(prev===undefined) return;
      if(prev<=0) u.hp=Math.ceil(u.maxhp*0.5);
      else u.hp=Math.min(u.maxhp, prev+Math.ceil(u.maxhp*0.4));
    });
  }
  const srcFoes=(!sp&&(UKA_JOINED||!UKA_ENABLED))?st.foes.filter(f=>f[0]!=="uka"):st.foes;
  const ngHp=1+NG_PLUS*0.45, ngAtk=1+NG_PLUS*0.22;
  const foes=srcFoes.map(([cls,name,x,y,leader])=>{
    const u=U("foe",cls,name,x,y,!!leader);
    u.maxhp=Math.round(u.maxhp*st.buff.hp*ngHp);
    u.hp=u.maxhp;
    u.atkBuff=st.buff.atk*ngAtk;
    return u;
  });
  units=[...mine,...foes];
  // ジンの秘伝書バフ適用
  const jin=mine.find(u=>u.name==="ジン");
  if(jin&&JIN_BUFF.maxhp){ jin.maxhp+=JIN_BUFF.maxhp; jin.hp=Math.min(jin.maxhp, jin.hp+JIN_BUFF.maxhp); }
  units.forEach((u,i)=>u.id=i);
  sanitizeSpawns();
}
function U(side,cls,name,x,y,leader=false){
  const c=CLASS[cls];
  return {side,cls,name,x,y,leader,maxhp:c.hp,hp:c.hp,acted:false,el:null,atkBuff:1,cd:0};
}
function atkOf(u){
  let a=Math.round(CLASS[u.cls].atk*(u.atkBuff||1));
  a+=(u.atkBonus||0);
  if(u.name==="ジン") a+=JIN_BUFF.atk;
  return a;
}

function expNeed(lv){ return 18 + lv*12; }
function gainExp(u, amt){
  if(u.side!=="me" || u.hp<=0) return;
  const p=progOf(u.name);
  p.exp+=amt;
  let leveled=false;
  while(p.exp>=expNeed(p.lv)){
    p.exp-=expNeed(p.lv);
    p.lv++;
    p.atk+=1; p.hp+=3;
    if(p.lv%2===0) p.def+=1;
    u.maxhp+=3; u.hp=Math.min(u.maxhp, u.hp+3);
    u.atkBonus=(u.atkBonus||0)+1;
    if(p.lv%2===0) u.defBonus=(u.defBonus||0)+1;
    leveled=true;
  }
  if(leveled){
    lvUpFx(u, p.lv);
    log(`<span class="sys">${u.name}、Lv${p.lv} に上がった！ 攻+1 / 体力+3${p.lv%2===0?" / 防+1":""}</span>`);
    const sk=SKILLS[u.name];
    if(sk && p.lv>=sk.lv && p.lv-1<sk.lv){
      log(`<span class="sys">★${u.name}、技「${sk.name}」を会得！</span>`);
      speak(u,`技「${sk.name}」、会得！`);

  }

function skillHit(a,t,mult,noEvade){
  if(t.hp<=0) return;
  if(!noEvade){
    const evd=CLASS[t.cls].evd + terrainEvd(t);
    if(Math.random()*100 < evd){
      fx(t,"miss","回避","#cfe6ff");
      log(`${t.name} が技を回避`);
      return;
    }
  }
  const def=defOf(t)+terrainDef(t);
  const dmg=Math.max(1, Math.round(atkOf(a)*mult) + rnd(-1,1) - def);
  t.hp-=dmg;
  fx(t, a.cls==="throw"||a.cls==="bomb"?"splash":"slash", "-"+dmg, "#ffe27a");
  refreshUnit(t);
  gainExp(a, 4 + (t.hp<=0?(t.leader?35:22):0));
  log(`<span class="me">${a.name}</span> の技 → <b>${t.name}</b> に ${dmg}`);
  if(t.hp<=0) handleDeath(t,a);
}
function finishSkill(u,sk){
  u.cd=sk.cd;
  log(`<span class="sys">${u.name}、技「${sk.name}」！（再使用まで${sk.cd}ターン）</span>`);
  skillUser=null; skillTargets=[];
  endAction(u);
}
function execTargetSkill(a,t){
  const sk=skillOf(a);
  shake();
  if(sk.kind==="multi"){
    for(let i=0;i<sk.hits;i++) setTimeout(()=>skillHit(a,t,sk.mult,false), i*260);
    setTimeout(()=>finishSkill(a,sk), sk.hits*260);
  } else if(sk.kind==="sure"){
    skillHit(a,t,sk.mult,true);
    finishSkill(a,sk);
  } else if(sk.kind==="blast"){
    skillHit(a,t,sk.mult,false);
    const pos={x:t.x,y:t.y};
    setTimeout(()=>{
      units.filter(v=>v.hp>0 && v!==a && v!==t
          && dist(v,pos)<=sk.splashR
          && (!sk.foesOnly || v.side!==a.side))
        .forEach((v,i)=>setTimeout(()=>skillHit(a,v,sk.mult*sk.splash,false), i*150));
    },300);
    setTimeout(()=>finishSkill(a,sk), 900);
  }
}
function runInstantSkill(u,sk){
  if(sk.kind==="healAll"||sk.kind==="healArea"){
    const targets=alive("me").filter(t=>
      t.hp<t.maxhp && (sk.kind==="healAll" || dist(u,t)<=sk.radius));
    targets.forEach((t,i)=>setTimeout(()=>{
      t.hp=Math.min(t.maxhp, t.hp+sk.amt);
      fx(t,"heal","+"+sk.amt,"#8fd0a0");
      refreshUnit(t);
    }, i*130));
    gainExp(u, 12);
    finishSkill(u,sk);
  } else if(sk.kind==="aoeSelf"){
    shake();
    const targets=alive("foe").filter(t=>dist(u,t)<=sk.radius);
    targets.forEach((t,i)=>setTimeout(()=>skillHit(u,t,sk.mult,false), i*160));
    setTimeout(()=>finishSkill(u,sk), Math.max(1,targets.length)*160+200);
  }
}

/* 水や重なりの上に湧かないよう最寄りの安全マスへ退避 */
function sanitizeSpawns(){
  const taken=new Set();
  for(const u of units){
    const bad=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||TERRAIN[y][x]===2||taken.has(x+","+y);
    if(!bad(u.x,u.y)){ taken.add(u.x+","+u.y); continue; }
    // BFSで最寄りの空きマス
    const q=[[u.x,u.y]], seen=new Set([u.x+","+u.y]);
    let found=null;
    while(q.length&&!found){
      const [x,y]=q.shift();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy,k=nx+","+ny;
        if(nx<0||ny<0||nx>=COLS||ny>=ROWS||seen.has(k))continue;
        seen.add(k);
        if(!bad(nx,ny)){ found=[nx,ny]; break; }
        q.push([nx,ny]);
      }
    }
    if(found){ u.x=found[0]; u.y=found[1]; }
    taken.add(u.x+","+u.y);
  }
}

const CAST_MAP_ME={ "疾風ハヤテ":"HAYATE","息吹イブキ":"IBUKI","イズナ":"IZUNA","ジン":"JIN","クオン":"QUON","シオン":"SHION","アンネ":"ANNE","ほんチい":"HONCHII" };
const SWAMP_IDX=STAGES.findIndex(st=>st.title==="亡霊の沼");
function castKey(u){
  if(u.name==="ロトン") return "ROTTEN_CN";   // ボスは公式ロトン
  if(u.side==="foe" && stageIdx===SWAMP_IDX) return "ROTON"; // 眷属は泥の姿で統一
  if(u.name==="ウカ"||u.name==="大炎神ウカ"||u.name==="狂乱ウカ") return "UKA";
  if(u.cls==="nise") return "IZUNA";
  if(u.side==="me") return CAST_MAP_ME[u.name]||"HAYATE";
  if(u.cls==="taisho"||u.cls==="slash") return "DAN"; // ボス・辻斬り:斬
  if(u.cls==="oni")    return "KANAONI";  // 鬼衆:金鬼
  if(u.cls==="karasu") return "KARURA";   // 烏:カルラ(烏天狗)
  return "SHION";                          // 手裏剣兵:紫苑
}
function tokenSVG(u){
  const body=CAST[castKey(u)];
  const flip = u.side==="foe" ? '<g transform="translate(680,0) scale(-1,1)">'+body+'</g>' : body;
  return '<svg viewBox="100 -10 480 680" xmlns="http://www.w3.org/2000/svg">'+flip+'</svg>';
}

/* ---- 盤面描画 ---- */
let cells=[];
function drawBoard(){
  board.innerHTML=""; cells=[];
  for(let y=0;y<ROWS;y++){ cells[y]=[]; for(let x=0;x<COLS;x++){
    const c=document.createElement("div");
    c.className="cell";
    const t=TERRAIN[y][x];
    if(t===1)c.classList.add("terrain-tree");
    if(t===2)c.classList.add("terrain-water");
    if(t===3)c.classList.add("terrain-roof");
    if(t===4)c.classList.add("terrain-shrine");
    c.dataset.x=x; c.dataset.y=y;
    c.addEventListener("click",()=>onCellClick(x,y));
    board.appendChild(c); cells[y][x]=c;
  }}
  units.forEach(placeUnit);
  placeItem();
}
function placeItem(){
  stageItem=null;
  const st=STAGES[stageIdx];
  if(!st.item||itemPicked[stageIdx]) return;
  const {x,y}=st.item;
  const e=document.createElement("div");
  e.className="itemScroll";
  e.title="幻術の秘伝書(ジン専用)";
  e.innerHTML=`<svg viewBox="0 0 40 40">
    <rect x="7" y="10" width="26" height="20" rx="3" fill="#e8ddc0" stroke="#7a5a2a" stroke-width="2.5"/>
    <rect x="4" y="8" width="6" height="24" rx="3" fill="#8e48a8" stroke="#4a2858" stroke-width="2"/>
    <rect x="30" y="8" width="6" height="24" rx="3" fill="#8e48a8" stroke="#4a2858" stroke-width="2"/>
    <path d="M14 16 h12 M14 20 h12 M14 24 h8" stroke="#7a5a2a" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
  cells[y][x].appendChild(e);
  stageItem={x,y,el:e};
}
function placeUnit(u){
  const el=document.createElement("div");
  el.className="unit side-"+u.side+(u.leader?" leader":"")+(u.cls==="ukagod"?" god":"");
  el.innerHTML=tokenSVG(u)+`<div class="hpbar"><i></i></div>`;
  el.addEventListener("click",e=>{e.stopPropagation(); onUnitClick(u);});
  el.style.pointerEvents="auto";
  u.el=el; refreshUnit(u); moveUnitEl(u);
  cells[u.y][u.x].appendChild(el);
}
function moveUnitEl(u){ cells[u.y][u.x].appendChild(u.el); }
function refreshUnit(u){
  if(!u.el) return;
  u.el.querySelector(".hpbar > i").style.width=Math.max(0,u.hp/u.maxhp*100)+"%";
  u.el.classList.toggle("acted", u.acted && u.side==="me");
  let b=u.el.querySelector(".lvlBadge");
  if(u.side==="me"){
    const lv=progOf(u.name).lv;
    if(!b){ b=el("div","lvlBadge"); u.el.appendChild(b); }
    b.textContent="L"+lv;
  } else if(b){ b.remove(); }
}

/* ---- 状態 ---- */
let turn="me", sel=null, mode="idle";
let moveCells=[], atkTargets=[];

function unitAt(x,y){ return units.find(u=>u.hp>0 && u.x===x && u.y===y); }
function alive(side){ return units.filter(u=>u.hp>0 && u.side===side); }

/* ---- 移動範囲（BFS・水は不可） ---- */
function reachable(u){
  const cost={}; const key=(x,y)=>x+","+y;
  cost[key(u.x,u.y)]=0; const q=[[u.x,u.y]]; const out=[];
  while(q.length){
    const [x,y]=q.shift(); const d=cost[key(x,y)];
    if(d>=CLASS[u.cls].move) continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if(TERRAIN[ny][nx]===2) continue;           // 水は通れない
      const occ=unitAt(nx,ny);
      if(occ && occ.side!==u.side) continue;       // 敵で塞がれる
      const nd=d+1;
      if(cost[key(nx,ny)]===undefined || nd<cost[key(nx,ny)]){
        cost[key(nx,ny)]=nd;
        if(!occ) out.push([nx,ny]);
        q.push([nx,ny]);
      }
    }
  }
  return out;
}
function inRange(u,x,y){ return Math.abs(u.x-x)+Math.abs(u.y-y)<=CLASS[u.cls].range; }
function targetsFrom(u){
  const r=[];
  units.forEach(t=>{ if(t.hp<=0) return;
    if(inRange(u,t.x,t.y)){
      if(u.cls==="heal"){ if(t.side===u.side && t.hp<t.maxhp) r.push(t); }
      else if(u.cls==="uka"||u.cls==="ukagod"||u.cls==="shishou"){
        if(t.side!==u.side) r.push(t);
        else if(t.hp<t.maxhp) r.push(t);   // 傷ついた味方も回復対象
      }
      else if(t.side!==u.side) r.push(t);
    }
  });
  return r;
}

/* 姉妹の掛け合い（イズナ⇔敵ウカ） */
let sisterBanterIdx=0;
const SISTER_BANTER=[
  ["ウカ！　手加減しないよ！","のぞむところ……ちょっとだけ手加減して？"],
  ["千円くらい、お姉ちゃんが払ってあげるから！","ほ、ほんと!?　……じゃなくて！　忍びに二言はないの！"],
  ["帰ったら一緒にごはん、食べよ？","うっ……その手には、乗らないんだから……！"],
  ["妹の借金の取り立てに来ました！","言い方ぁ！！"],
];
const UKA_SORRY=["ごめんっ、これも千円のため！","姉さんの仲間だけど、ごめんね！","あとで謝るから！　今は許して！"];
function sisterBanter(a,d){
  if(a.name==="イズナ" && d.name==="ウカ" && d.side==="foe"){
    const pair=SISTER_BANTER[sisterBanterIdx++ % SISTER_BANTER.length];
    speak(a, pair[0]);
    setTimeout(()=>{ if(d.hp>0) speak(d, pair[1]); }, 1150);
    return true;
  }
  if(a.name==="ウカ" && a.side==="foe" && d.side==="me"){
    if(d.name==="イズナ"){
      speak(a,"ごめんね姉さんっ！");
      setTimeout(()=>{ if(d.hp>0) speak(d,"痛っ……この子ったら！"); }, 1150);
    } else if(Math.random()<0.5){
      speak(a, UKA_SORRY[Math.floor(Math.random()*UKA_SORRY.length)]);
    }
    return true;
  }
  return false;
}
const HONCHII_VOICE=["ぽいチい。","どーんチい。","いい風チい。","着火チい。","5さいチい。"];
function doAttack(a,d){
  const attacker=a, defender=d;
  const sideCls = a.side==="me"?"me":"foe";
  if(a!==d) sisterBanter(a,d);
  if(a.cls==="bomb"&&a!==d&&Math.random()<0.6) speak(a, HONCHII_VOICE[Math.floor(Math.random()*HONCHII_VOICE.length)]);
  if(a.cls==="heal" || ((a.cls==="uka"||a.cls==="ukagod"||a.cls==="shishou") && d.side===a.side)){
    const amt=CLASS[a.cls].heal;
    defender.hp=Math.min(defender.maxhp, defender.hp+amt);
    fx(defender,"heal","+"+amt,"#8fd0a0");
    log(`<span class="${sideCls}">${a.name}</span> が <b>${defender.name}</b> を ${amt} 回復`);
    if(a.name==="アンネ"&&d.name==="シオン"){
      speak(a,"師匠に任せな、シオン。");
      setTimeout(()=>{ if(d.hp>0) speak(d,"……ありがとうございます、師匠。"); },1150);
    }
    gainExp(a, 12);
    endAction(a); return;
  }
  // 命中判定
  const evd=CLASS[defender.cls].evd + terrainEvd(defender);
  if(Math.random()*100 < evd){
    fx(defender,"miss","回避","#cfe6ff");
    log(`<span class="${sideCls}">${a.name}</span> の攻撃を ${defender.name} が回避`);
    endAction(a); return;
  }
  const def=defOf(defender) + terrainDef(defender);
  let dmg=Math.max(1, atkOf(a) + rnd(-1,2) - def);
  defender.hp-=dmg;
  const kind = a.cls==="throw"?"splash":"slash";
  fx(defender,kind,"-"+dmg, a.side==="me"?"#ffec6e":"#ff9d9d");
  shake();
  log(`<span class="${sideCls}">${a.name}</span> → <b>${defender.name}</b> に ${dmg} ダメージ`);

  if(defender.hp<=0){
    gainExp(a, 10 + (defender.leader?35:22));
    handleDeath(defender,a);
    refreshUnit(defender); endAction(a); return;
  } else {
    // 反撃（隣接・生存・射程内なら）
    if(defender.hp>0 && a.cls!=="throw" && CLASS[defender.cls].range>=dist(a,defender) && defender.cls!=="heal"){
      setTimeout(()=>{
        if(a.hp<=0) return;
        let cdmg=Math.max(1, atkOf(defender) + rnd(-1,1) - (defOf(a)+terrainDef(a)));
        a.hp-=cdmg; fx(a,"slash","-"+cdmg,"#ffb0a0"); refreshUnit(a);
        log(`<span class="${defender.side==='me'?'me':'foe'}">${defender.name}</span> の反撃 ${cdmg}`);
        gainExp(defender, 6 + (a.hp<=0?(a.leader?35:22):0));
        if(a.hp<=0){ handleDeath(a,defender); }
        refreshUnit(defender);
      },340);
    }
  }
  gainExp(a, 8);
  refreshUnit(defender);
  // ほんチいの爆弾: 着弾点の隣接1マスを巻き込む（敵味方問わず・シュール仕様）
  if(a.cls==="bomb"){
    const sp=Math.max(1, Math.round(dmg*0.4));
    const hitPos={x:defender.x,y:defender.y};
    setTimeout(()=>{
      units.filter(t=>t.hp>0 && t!==a && t!==defender && dist(t,hitPos)===1)
        .forEach((t,i)=>{
          setTimeout(()=>{
            if(t.hp<=0) return;
            t.hp-=sp;
            fx(t,"splash","-"+sp,"#ffc06e");
            refreshUnit(t);
            log(`<span class="sys">爆風が ${t.name} を巻き込んだ (${sp})</span>`);
            if(t.hp<=0) handleDeath(t, a.side!==t.side?a:null);
          }, i*130);
        });
    }, 300);
  }
  endAction(a);
}

/* ---- 敵AI ---- */
const NISE_WHISPERS=["ウカ、大好きよ。","ずっと一緒よ、ウカ。","わたしを見て？　ねえさんはここよ。","いい子ね、ウカ。もっと暴れて？"];
const UKA_RAGE=["黙れ！　ねえさんの声はそんなんじゃない！","うるさいうるさいうるさい！","おまえたちは、ぜんぶ偽物だ！！"];
function foeTurn(){
  // 外伝: 偽イズナが愛を囁き、ウカが怒り狂う
  if(SPECIAL.active){
    const nise=alive("foe").filter(u=>u.cls==="nise");
    const uka=alive("foe").find(u=>u.name==="狂乱ウカ");
    if(nise.length&&uka){
      const n=nise[Math.floor(Math.random()*nise.length)];
      speak(n, NISE_WHISPERS[Math.floor(Math.random()*NISE_WHISPERS.length)]);
      setTimeout(()=>{ if(uka.hp>0) speak(uka, UKA_RAGE[Math.floor(Math.random()*UKA_RAGE.length)]); }, 1100);
    }
  }
  const foes=alive("foe").slice();
  let i=0;
  (function step(){
    if(i>=foes.length){ endTurn(); return; }
    const u=foes[i++];
    if(u.hp<=0){ step(); return; }
    // 最も近い自軍を狙う
    const targets=alive("me");
    if(!targets.length){ step(); return; }
    targets.sort((a,b)=>dist(u,a)-dist(u,b));
    // 大将を優先的に（近ければ）
    let goal=targets[0];
    const near=targets.filter(t=>dist(u,t)<=CLASS[u.cls].move+CLASS[u.cls].range);
    if(near.some(t=>t.leader)) goal=near.find(t=>t.leader);

    // 射程内に入れる移動先を探す
    const opts=reachable(u); opts.push([u.x,u.y]);
    let best=null, bestScore=-1e9;
    for(const [x,y] of opts){
      const d=Math.abs(x-goal.x)+Math.abs(y-goal.y);
      const canHit = alive("me").some(t=>Math.abs(x-t.x)+Math.abs(y-t.y)<=CLASS[u.cls].range);
      let s=-d + (canHit?50:0) + (TERRAIN[y][x]===1?3:0);
      if(s>bestScore){ bestScore=s; best=[x,y]; }
    }
    if(best && (best[0]!==u.x||best[1]!==u.y)){ u.x=best[0]; u.y=best[1]; moveUnitEl(u); }

    // 攻撃
    setTimeout(()=>{
      const hitable=alive("me").filter(t=>dist(u,t)<=CLASS[u.cls].range);
      if(hitable.length){
        hitable.sort((a,b)=>a.hp-b.hp);
        const killable=hitable.filter(t=>t.hp<=atkOf(u)-defOf(t));
        const tgt = hitable.find(t=>t.leader)
                 || killable[0]
                 || hitable.find(t=>t.cls==="heal")
                 || hitable[0];
        doAttack(u,tgt);
      }
      setTimeout(step,420);
    },260);
  })();
}

/* ---- エフェクト等 ---- */
function fx(u,kind,text,color){
  const cell=cells[u.y][u.x]; const wrap=$("#boardWrap");
  const r=cell.getBoundingClientRect(); const br=wrap.getBoundingClientRect();
  const cx=r.left-br.left+r.width/2, cy=r.top-br.top+r.height/2;
  if(kind==="slash"){
    const s=el("div","fx slash"); s.style.left=cx+"px"; s.style.top=cy+"px";
    s.innerHTML=`<svg viewBox="0 0 60 60"><path d="M8 46 Q30 10 52 40"/></svg>`;
    wrap.appendChild(s); setTimeout(()=>s.remove(),320);
  } else if(kind==="splash"){
    const s=el("div","fx splash"); s.style.left=cx+"px"; s.style.top=cy+"px";
    wrap.appendChild(s); setTimeout(()=>s.remove(),340);
  }
  const f=el("div","float"); f.textContent=text; f.style.color=color||"#fff";
  f.style.left=(cx-10)+"px"; f.style.top=(cy-14)+"px";
  wrap.appendChild(f); setTimeout(()=>f.remove(),800);
}
function shake(){ board.animate(
  [{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(3px,-2px)'},{transform:'translate(0,0)'}],
  {duration:180}); }
function el(t,c){ const e=document.createElement(t); e.className=c; return e; }
function dist(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function log(html){ const d=$("#log"); d.insertAdjacentHTML("afterbegin",`<div>${html}</div>`); }

  } else if(win && st.chFinal && st.ch===2){
    $("#overlayKanji").textContent="討";
    $("#overlayMsg").textContent="常闇ノ皇、消滅——だが皇は器にすぎなかった。常世ノ門が、静かに開く。物語は第三章へ。";
    btn.textContent="第三章へ ▸";
    btn.onclick=()=>{ ov.classList.remove("show");
      carryHP=snapshotHP();
      startChapter3(); };
  } else if(win && st.chFinal && st.ch===3){
    $("#overlayKanji").textContent="終";
    $("#overlayMsg").textContent=`終焉ノ神ヨミ、消滅。すべての夜が明けた——完。${NG_PLUS>0?`（${NG_PLUS+1}周目クリア）`:""} 周回プレイでは成長を引き継ぎ、敵がさらに強くなる。`;
    btn.textContent="周回プレイへ ▸";
    btn.onclick=()=>{ ov.classList.remove("show"); newGamePlus(); };
    btn2.textContent="最初から";
    btn2.style.display="inline-block";
    btn2.onclick=()=>{ ov.classList.remove("show"); fullReset(); };
  } else if(win && !isFinal){
    $("#overlayKanji").textContent="討";
    $("#overlayMsg").textContent=`${st.bossName}を討ち取った。だが敵はさらに奥に潜む——`;
    btn.textContent="進軍先を選ぶ ▸";
    btn.onclick=()=>{ ov.classList.remove("show");
      carryHP=snapshotHP();
      openMapSelect(st.next); };
  } else if(win && isFinal){
    $("#overlayKanji").textContent="勝";
    $("#overlayMsg").textContent="総大将・大天狗を討った——だが月が翳る。物語は、第二章へ。";
    btn.textContent="第二章へ ▸";
    btn.onclick=()=>{ ov.classList.remove("show");
      carryHP=snapshotHP();
      startChapter2(); };
  } else {
    $("#overlayKanji").textContent="敗";
    $("#overlayMsg").textContent=`大将ジン、討たれる。${st.title}にて里の望みは潰えた…`;
    btn.textContent="この幕をやり直す";
    btn.onclick=()=>{ ov.classList.remove("show"); restart(); };
  }
  if(win){
    const lines=applyVictoryBonuses();
    showDialog(lines, ()=>ov.classList.add("show"));
  } else {
    ov.classList.add("show");
  }
}

/* ---- 全リセット ---- */
function fullReset(){
  stageIdx=0; carryHP=null; actNum=1;
  JIN_BUFF={atk:0,maxhp:0}; itemPicked=STAGES.map(()=>false);
  UKA_JOINED=false; UKA_GOD=false; UKA_ENABLED=true; PROGRESS={};
  SPECIAL={active:false, done:false, izunaRevived:false, returnStage:0, returnAct:1};
  CH2=false; CH3=false; CH2_CLEARED={}; SHION_JOINED=false;
  NG_PLUS=0; TRAIN_RET=null;
  restart();
}

/* ---- 周回プレイ: レベル・秘伝書を引き継ぎ、敵が強くなる ---- */
function newGamePlus(){
  NG_PLUS++;
  stageIdx=0; carryHP=null; actNum=1;
  itemPicked=STAGES.map(()=>false);
  UKA_JOINED=false; UKA_GOD=false; UKA_ENABLED=true;
  SPECIAL={active:false, done:false, izunaRevived:false, returnStage:0, returnAct:1};
  CH2=false; CH3=false; CH2_CLEARED={}; SHION_JOINED=false; TRAIN_RET=null;
  log(`<span class="sys">【${NG_PLUS+1}周目】レベルと秘伝書を引き継いで、物語が最初から始まる。敵は大幅に強化！</span>`);
  restart();
}

/* ---- 第三章開始 ---- */
const CH3_INTRO=[
  {name:"シオン", color:C_ME, text:"皇の骸から、瘴気が門へ……。常世ノ門が、開いています。"},
  {name:"ジン", color:C_ME, text:"皇は器にすぎなかったか。真の主——終焉ノ神・ヨミ。"},
  {name:"アンネ", color:C_ME, text:"やれやれ、団子はまだお預けかい。……いいさ、弟子の門出だ。付き合うよ。"},
  {name:"ほんチい", color:"var(--kin)", text:"まだ、あばれるチい。"},
  {name:"疾風ハヤテ", color:C_ME, text:"雪原と火口、二つの関の先に門はある。修行場で腕を磨くのも忘れるな。"},
  {name:"―", color:"var(--kin)", text:"【第三章 開幕】雪原と火口は何度でも往来可能。両方を制せば常世ノ門が開く。修行場も引き続き使える。"},
];
function startChapter3(){
  CH3=true;
  STAGES.forEach((st,i)=>{ if(st.ch===3) delete CH2_CLEARED[i]; });
  showDialog(CH3_INTRO, ()=>openChapterSelect(3));
}

/* ---- 第二章開始（新キャラ・シオン加入） ---- */
const CH2_INTRO=[
  {name:"ジン", color:C_ME, text:"大天狗は討った。……だが、この空。月が、翳っていく。"},
  {name:"？？？", color:"var(--kin)", text:"——常闇ノ皇。大天狗の背後に潜みし、真の敵の仕業です。"},
  {name:"疾風ハヤテ", color:C_ME, text:"何者だ！"},
  {name:"シオン", color:"var(--kin)", text:"陰陽師、シオン。月を守る家系の者。式神の腕、里のために振るいましょう。"},
  {name:"クオン", color:C_ME, text:"射程3の遠距離攻撃……！　た、頼もしい……！"},
  {name:"シオン", color:"var(--kin)", text:"魔城への道は峠と沼、二つの関に塞がれています。何度でも往き来し、力を蓄えなさい。"},
  {name:"アンネ", color:"var(--kin)", text:"シオンや〜、置いてくんじゃないよ〜。……あ、この里、団子屋あるかい？"},
  {name:"シオン", color:"var(--kin)", text:"師匠……今は団子より常闇ノ皇です。"},
  {name:"アンネ", color:"var(--kin)", text:"わーってるよ。……あたしの弟子に傷ひとつ付けさせやしない。それだけは、団子に誓うさね。"},
  {name:"ほんチい", color:"var(--kin)", text:"ほんチい。5さいの、かわいいおんなのこチい。"},
  {name:"クオン", color:C_ME, text:"か、かわいい……！　あれ、でもその手に持ってるのって……"},
  {name:"ほんチい", color:"var(--kin)", text:"……。（無言で爆弾を構えた）"},
  {name:"疾風ハヤテ", color:C_ME, text:"おい、なぜ爆弾を構える。まだ敵はいないぞ。"},
  {name:"ほんチい", color:"var(--kin)", text:"すぶり、チい。"},
  {name:"―", color:"var(--kin)", text:"【第二章 開幕】シオン・アンネ・ほんチいが仲間になった！ 峠と沼は何度でも再戦でき、経験値を稼げる。両方を制せば魔城が開く。"},
];
function startChapter2(){
  CH2=true; CH2_CLEARED={};
  SHION_JOINED=true;
  progOf("シオン");   // 成長枠を確保
  showDialog(CH2_INTRO, ()=>openChapterSelect(2));
}

/* ---- 章マップ選択（行ったり戻ったり・再戦可・修行場付き） ---- */
function avgPartyLv(){
  const names=["疾風ハヤテ","息吹イブキ","イズナ","ジン","クオン"];
  if(UKA_JOINED) names.push(UKA_GOD?"大炎神ウカ":"ウカ");
  if(SHION_JOINED) names.push("シオン","アンネ","ほんチい");
  return names.reduce((a,n)=>a+progOf(n).lv,0)/names.length;
}
function enterTraining(ret){
  TRAIN_RET=ret;
  const t=STAGES[TRAIN_IDX];
  const lv=avgPartyLv();
  t.buff={ hp: 0.8 + lv*0.22, atk: 0.9 + lv*0.09 };
  stageIdx=TRAIN_IDX;
  restart();
}
function trainingCard(box, ms, ret){
  const t=STAGES[TRAIN_IDX];
  const card=el("div","mapCard");
  card.style.borderColor="var(--sui)";
  card.innerHTML=`
    <div class="mTitle" style="color:var(--sui)">${t.title}</div>
    <div class="mDesc">${t.intro}</div>
    <div class="mBoss" style="color:var(--sui)">相手：${t.bossName}（現在の練度 Lv${avgPartyLv().toFixed(1)} に応じて強化）</div>`;
  card.onclick=()=>{ ms.classList.remove("show"); enterTraining(ret); };
  box.appendChild(card);
}
function openChapterSelect(ch){
  const ms=$("#mapsel"), box=$("#mapChoices");
  box.innerHTML="";
  const idxs=STAGES.map((st,i)=>st.ch===ch?i:-1).filter(i=>i>=0);
  const fields=idxs.filter(i=>!STAGES[i].chFinal);
  const finalUnlocked=fields.every(i=>CH2_CLEARED[i]);
  idxs.forEach(i=>{
    const st=STAGES[i];
    const card=el("div","mapCard");
    const locked=st.chFinal&&!finalUnlocked;
    const cleared=!!CH2_CLEARED[i];
    card.innerHTML=`
      <div class="mTitle">${st.title}${cleared?'　<span style="font-size:11px;color:var(--sui)">討伐済</span>':''}</div>
      <div class="mDesc">${st.intro}</div>
      <div class="mBoss">${locked?'<span style="color:var(--washi-dim)">※二つの関を制すれば道が開く</span>':`敵将：${st.bossName}${cleared?'（再戦・経験値稼ぎ可）':''}`}</div>`;
    if(locked){ card.style.opacity=".45"; card.style.cursor="default"; }
    else card.onclick=()=>{
      ms.classList.remove("show");
      stageIdx=i; actNum++;
      restart();
    };
    box.appendChild(card);
  });
  trainingCard(box, ms, {ch:ch});
  ms.classList.add("show");
}

/* ---- 外伝の決着: ウカ帰還（イズナ復活済みなら大炎神覚醒） ---- */
function endSpecial(){
  const awakened=SPECIAL.izunaRevived;
  let lines;
  if(awakened){
    UKA_GOD=true;
    lines=[
      {name:"狂乱ウカ", color:C_FOE, text:"はぁ……はぁ……ねえさん……ほんものの、ねえさん……"},
      {name:"イズナ", color:C_ME, text:"ずっとそばにいるよ。……おかえり、ウカ。"},
      {name:"ウカ", color:C_UKA, text:"あたしの中の炎が……姉さんを守る力に、変わっていく……！"},
      {name:"―", color:"var(--kin)", text:"ウカは【大炎神ウカ】として覚醒した！　焔を統べる力を得て、再び仲間になった。"},
    ];
  } else {
    lines=[
      {name:"狂乱ウカ", color:C_FOE, text:"はっ……あたし、何を……"},
      {name:"ジン", color:C_ME, text:"幻は払った。……見ろ、祠の光が。イズナの魂が還ってくる。"},
      {name:"イズナ", color:C_ME, text:"……ウカ。心配、かけたね。"},
      {name:"ウカ", color:C_UKA, text:"ねえさん……！　ごめん、ごめんなさい……！"},
      {name:"―", color:"var(--kin)", text:"イズナが息を吹き返した。ウカも正気に戻り、再び仲間になった。"},
    ];
  }
  showDialog(lines, ()=>{
    SPECIAL.active=false; SPECIAL.done=true;
    UKA_JOINED=true;
    stageIdx=SPECIAL.returnStage;
    actNum=SPECIAL.returnAct;
    carryHP=null;   // 決意も新たに全快で元の戦場へ
    restart();
  });
}

/* ---- マップ選択 ---- */
function openMapSelect(nextIdxs){
  const ms=$("#mapsel"), box=$("#mapChoices");
  box.innerHTML="";
  // 選択肢が1つでもカードで見せる（世界観重視）
  nextIdxs.forEach(i=>{
    const st=STAGES[i];
    const card=el("div","mapCard");
    const hasUka=st.foes.some(f=>f[0]==="uka")&&!UKA_JOINED;
    const go=(ukaOn)=>{
      ms.classList.remove("show");
      UKA_ENABLED=ukaOn;
      stageIdx=i; actNum++;
      restart();
    };
    card.innerHTML=`
      <div class="mTitle">${st.title}</div>
      <div class="mDesc">${st.intro}</div>
      <div class="mBoss">敵将：${st.bossName}${hasUka?'　<span style="color:var(--kin)">※ウカの影あり</span>':''}</div>`;
    if(hasUka){
      const opts=el("div","mapOpts");
      const b1=document.createElement("button"); b1.textContent="ウカあり（勧誘可）";
      const b2=document.createElement("button"); b2.textContent="ウカなし";
      b1.onclick=e=>{e.stopPropagation(); go(true);};
      b2.onclick=e=>{e.stopPropagation(); go(false);};
      opts.appendChild(b1); opts.appendChild(b2);
      card.appendChild(opts);
    } else {
      card.onclick=()=>go(true);
    }
    box.appendChild(card);
  });
  trainingCard(box, ms, {next:nextIdxs});
  ms.classList.add("show");
}
function snapshotHP(){
  const o={};
  units.filter(u=>u.side==="me").forEach(u=>o[u.name]=u.hp);
  return o;
}
function restart(){
  turn="me"; sel=null; mode="idle";
  if(SPECIAL.active) SPECIAL.izunaRevived=false;
  $("#log").innerHTML="";
  boot();
}

/* ---- 起動 ---- */
function boot(){
  makeRoster(); drawBoard(); setBanner();
  phaseTxt("駒を選んでください");
  const st=STAGES[stageIdx];
  const KAN=["","一","二","三","四","五","六","七","八","九","十"];
  const ngTag=NG_PLUS>0?`〔${NG_PLUS+1}周目〕`:"";
  $("#stageTitle").textContent=(st.training?"修行　":st.special?"外伝　":`第${KAN[actNum]||actNum}幕　`)+st.title+ngTag;
  $("#endTurnBtn").onclick=()=>{ if(turn==="me") endTurn(); };
  $("#debugSkip").onclick=()=>{
    // 三幕クリア相当の状態を用意して第二章へ
    ["疾風ハヤテ","息吹イブキ","イズナ","ジン","クオン","ウカ"].forEach(n=>{
      PROGRESS[n]={lv:4, exp:0, atk:3, hp:9, def:2};
    });
    UKA_JOINED=true; UKA_GOD=false; UKA_ENABLED=true;
    JIN_BUFF={atk:2, maxhp:4};
    SPECIAL={active:false, done:false, izunaRevived:false, returnStage:0, returnAct:1};
    carryHP=null; actNum=3;
    log(`<span class="sys">【デバッグ】三幕クリア後の状態で第二章へ。</span>`);
    startChapter2();
  };
  $("#debugSkip3").onclick=()=>{
    ["疾風ハヤテ","息吹イブキ","イズナ","ジン","クオン","ウカ","大炎神ウカ","シオン","アンネ","ほんチい"].forEach(n=>{
      PROGRESS[n]={lv:7, exp:0, atk:6, hp:18, def:3};
    });
    UKA_JOINED=true; UKA_GOD=true; UKA_ENABLED=true;
    SHION_JOINED=true; CH2=true;
    JIN_BUFF={atk:4, maxhp:8};
    SPECIAL={active:false, done:true, izunaRevived:false, returnStage:0, returnAct:1};
    carryHP=null; actNum=6;
    log(`<span class="sys">【デバッグ】二章クリア後の状態で第三章へ。</span>`);
    startChapter3();
  };
  log(`<span class="sys">${st.title}。${st.intro}</span>`);
  let d=STAGE_DIALOGUE[stageIdx]||[];
  if((stageIdx===1||stageIdx===3)&&UKA_JOINED) d=STAGE2_DIALOGUE_JOINED;
  else if((stageIdx===1||stageIdx===3)&&!UKA_ENABLED){
    // ウカなし選択時はウカ絡みの台詞を除いた導入
    d=d.filter(l=>l.name!=="ウカ"&&!/ウカ/.test(l.text));
    if(!d.length) d=[{name:"疾風ハヤテ", color:C_ME, text:"敵陣は静かだ。……油断せず、行くぞ。"}];
  }
  showDialog(d);
}
/* 会話送り(一度だけ登録) */
$("#dlg").addEventListener("click",()=>{
  dlgIdx++;
  if(dlgIdx>=dlgLines.length){
    $("#dlg").classList.remove("show");
    const f=dlgDone; dlgDone=null; if(f)f();
  } else renderDlg();
});
boot();
</script>
