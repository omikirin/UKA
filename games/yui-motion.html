<meta charset="UTF-8">

<title>ゆい 口パク・視線システム</title>
<style>
  :root{
    --bg:#fdeef2; --panel:#fff7f9; --line:#f0cdd8;
    --ink:#5a3a45; --sub:#a97e8d; --accent:#e8543f; --accent2:#d4708f;
  }
  *{box-sizing:border-box; margin:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; min-height:100vh;
  }
  #stage{
    position:relative;
    flex:1; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #ffffff 0%, var(--bg) 70%);
    cursor:crosshair;
  }
  #stage svg{ height:min(92vh,760px); width:auto; max-width:96%; transition:height .25s; }
  #stage.tv svg{
    height:auto; width:min(92%, 1100px); aspect-ratio:16/9;
    background:#fff; border-radius:10px;
    box-shadow:0 8px 30px rgba(212,112,143,.25), 0 0 0 6px #fff, 0 0 0 8px #f0cdd8;
  }
  #panel{
    width:300px; background:var(--panel); border-left:1px solid var(--line);
    padding:20px 18px; display:flex; flex-direction:column; gap:18px;
  }
  h1{ font-size:15px; letter-spacing:.12em; color:var(--accent2); font-weight:600 }
  h1 small{ display:block; color:var(--sub); font-size:10px; letter-spacing:.2em; margin-top:4px; font-weight:400 }
  .sec{ border-top:1px solid var(--line); padding-top:14px }
  .sec h2{ font-size:11px; color:var(--sub); letter-spacing:.15em; margin-bottom:10px }
  .row{ display:flex; gap:8px; flex-wrap:wrap }
  button{
    font:inherit; font-size:12px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--line); background:#ffffff; color:var(--ink); cursor:pointer;
  }
  button:hover{ border-color:var(--accent) }
  button.on{ background:var(--accent); border-color:var(--accent); color:#fff }
  textarea{
    width:100%; height:64px; font:inherit; font-size:13px; resize:none;
    background:#ffffff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px;
  }
  label.sl{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--sub) }
  input[type=range]{ flex:1; accent-color:var(--accent) }
  #status{ font-size:11px; color:var(--sub); min-height:14px }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const svgRoot = document.querySelector('#stage svg');
const status = $('status');

/* ========== 手の動き ========== */
// ボーン: 腕(肩) → 前腕(肘) → 手(手首)。FKで上腕の回転を前腕に合成
// 袂(垂れ袖)は腕に付いていくが、向きはカウンター回転で常に垂れ下がったまま
const boneArmL = svgRoot.getElementById('腕L');     // pivot 163,248
const boneArmR = svgRoot.getElementById('腕R');     // pivot 237,248
const boneForeL = svgRoot.getElementById('前腕L');  // pivot 160,298
const boneForeR = svgRoot.getElementById('前腕R');  // pivot 240,298
const boneHandL = svgRoot.getElementById('手L');    // pivot 158.2,354
const boneHandR = svgRoot.getElementById('手R');    // pivot 241.8,354
const sleeveL = svgRoot.getElementById('袖L_下');   // pivot 158,293
const sleeveR = svgRoot.getElementById('袖R_下');   // pivot 242,293

let gesture = 'none';
const ang = {armL:0, armR:0, foreL:0, foreR:0, handL:0, handR:0};
const tgt = {armL:0, armR:0, foreL:0, foreR:0, handL:0, handR:0};

function setGesture(g){
  gesture = g;
  ['hgNone','hgWave','hgRaise','hgBanzai'].forEach(id=>$(id).classList.remove('on'));
  ({none:'hgNone', wave:'hgWave', raise:'hgRaise', banzai:'hgBanzai'})[g] &&
    $({none:'hgNone',wave:'hgWave',raise:'hgRaise',banzai:'hgBanzai'}[g]).classList.add('on');
}
$('hgNone').onclick   = ()=>setGesture('none');
$('hgWave').onclick   = ()=>setGesture('wave');
$('hgRaise').onclick  = ()=>setGesture('raise');
$('hgBanzai').onclick = ()=>setGesture('banzai');

function handLoop(ts){
  const t = ts/1000;
  if(gesture==='none'){
    tgt.armL=0; tgt.armR=0; tgt.foreL=0; tgt.foreR=0; tgt.handL=0; tgt.handR=0;
  }else if(gesture==='droop'){
    // しょんぼり: 両腕を内側にだらん、かすかに揺れる
    const s = Math.sin(t*1.2)*1.5;
    tgt.armL=-7+s; tgt.armR=-7+s; tgt.foreL=-4; tgt.foreR=-4;
    tgt.handL=-6; tgt.handR=-6;
  }else if(gesture==='wave'){
    tgt.armR  = 50;                        // 肘を体の横に上げる
    tgt.foreR = 125 + Math.sin(t*6)*10;    // 手が顔の下(あご〜首の横)あたりでフリフリ
    tgt.handR = Math.sin(t*6 + 0.5)*15;
    tgt.armL=0; tgt.foreL=0; tgt.handL=0;
  }else if(gesture==='raise'){
    tgt.armR  = 30;
    tgt.foreR = 125;
    tgt.handR = 5 + Math.sin(t*1.5)*3;
    tgt.armL=0; tgt.foreL=0; tgt.handL=0;
  }else if(gesture==='banzai'){
    const sway = Math.sin(t*2.2)*4;
    tgt.armL  = 135 + sway; tgt.foreL = 30;   // 耳の横まで挙げる
    tgt.armR  = 135 + sway; tgt.foreR = 30;
    tgt.handL = Math.sin(t*2.2)*10;
    tgt.handR = Math.sin(t*2.2)*10;
  }
  for(const k in ang) ang[k] += (tgt[k]-ang[k]) * 0.15;

  // 上腕(肩ピボット)
  boneArmL.setAttribute('transform',  `rotate(${ ang.armL} 163 248)`);
  boneArmR.setAttribute('transform',  `rotate(${-ang.armR} 237 248)`);
  // 前腕は肩回転を合成(FK): 肩まわり→肘まわりの順で回す
  boneForeL.setAttribute('transform', `rotate(${ ang.armL} 163 248) rotate(${ ang.foreL} 160 298)`);
  boneForeR.setAttribute('transform', `rotate(${-ang.armR} 237 248) rotate(${-ang.foreR} 240 298)`);
  // 手首(前腕の子なのでローカル回転のみ)
  boneHandL.setAttribute('transform', `rotate(${ ang.handL} 158.2 354)`);
  boneHandR.setAttribute('transform', `rotate(${-ang.handR} 241.8 354)`);
  // 袂: 腕に付いて移動するが、合計回転をキャンセルして常に垂直に垂らす
  sleeveL.setAttribute('transform', `rotate(${-(ang.armL+ang.foreL)} 158 293)`);
  sleeveR.setAttribute('transform', `rotate(${ (ang.armR+ang.foreR)} 242 293)`);
  requestAnimationFrame(handLoop);
}
requestAnimationFrame(handLoop);

/* ========== 手の形(グー・チョキ・パー) ========== */
// 各指グループをピボット基準の縦スケールで折りたたむ(甲側から見た2D表現)
const fingers = {
  親指L:   {el:svgRoot.getElementById('親指L'),   px:147.4, py:361.4},
  人差指L: {el:svgRoot.getElementById('人差指L'), px:150.6, py:372.2},
  中指L:   {el:svgRoot.getElementById('中指L'),   px:155.2, py:372.2},
  薬指L:   {el:svgRoot.getElementById('薬指L'),   px:159.8, py:372.2},
  小指L:   {el:svgRoot.getElementById('小指L'),   px:164.4, py:372.2},
  親指R:   {el:svgRoot.getElementById('親指R'),   px:252.6, py:361.4},
  人差指R: {el:svgRoot.getElementById('人差指R'), px:249.4, py:372.2},
  中指R:   {el:svgRoot.getElementById('中指R'),   px:244.8, py:372.2},
  薬指R:   {el:svgRoot.getElementById('薬指R'),   px:240.2, py:372.2},
  小指R:   {el:svgRoot.getElementById('小指R'),   px:235.6, py:372.2},
};
for(const k in fingers){
  fingers[k].s = 1; fingers[k].t = 1;
  fingers[k].base = fingers[k].el.getAttribute('transform') || ''; // 親指の rotate(-28…) 等を保持
}

const FOLD = 0.45, THUMB_FOLD = 0.5;  // 折った指も短い節として見える畳み具合
const SHAPES = {
  paper:    ()=>1,
  rock:     k => k.startsWith('親指') ? THUMB_FOLD : FOLD,
  scissors: k => (k.startsWith('人差指') || k.startsWith('中指')) ? 1
                : k.startsWith('親指') ? THUMB_FOLD : FOLD,
};
function setHandShape(shape){
  for(const k in fingers) fingers[k].t = SHAPES[shape](k);
  ['hsPaper','hsRock','hsScissors'].forEach(id=>$(id).classList.remove('on'));
  $({paper:'hsPaper', rock:'hsRock', scissors:'hsScissors'}[shape]).classList.add('on');
}
$('hsPaper').onclick    = ()=>setHandShape('paper');
$('hsRock').onclick     = ()=>setHandShape('rock');
$('hsScissors').onclick = ()=>setHandShape('scissors');

function fingerLoop(){
  for(const k in fingers){
    const f = fingers[k];
    f.s += (f.t - f.s) * 0.25;
    f.el.setAttribute('transform',
      `${f.base} translate(${f.px},${f.py}) scale(1,${f.s.toFixed(3)}) translate(${-f.px},${-f.py})`);
  }
  requestAnimationFrame(fingerLoop);
}
requestAnimationFrame(fingerLoop);

/* ========== じゃんけん ========== */
const callout = $('callout');
let jankenBusy = false;
function say(text, ms){
  callout.textContent = text;
  callout.style.opacity = 1;
  if(ms) setTimeout(()=>{ if(callout.textContent===text) callout.style.opacity = 0; }, ms);
}

// ユーザーの手選択ボタン(ステージ下部に出す)
const choiceBox = document.createElement('div');
choiceBox.style.cssText = 'position:absolute; bottom:6%; left:50%; transform:translateX(-50%);'
  + 'display:none; gap:10px;';
['グー','チョキ','パー'].forEach((label,i)=>{
  const b = document.createElement('button');
  b.textContent = label;
  b.style.cssText = 'font-size:18px; padding:12px 22px; border-radius:12px;'
    + 'border:2px solid #d4708f; background:#fff; color:#5a3a45; cursor:pointer; font-weight:700;';
  b.onclick = ()=> resolveJanken(['rock','scissors','paper'][i]);
  choiceBox.appendChild(b);
});
document.getElementById('stage').appendChild(choiceBox);

const NAMES = {rock:'グー', scissors:'チョキ', paper:'パー'};
const BEATS = {rock:'scissors', scissors:'paper', paper:'rock'}; // key が value に勝つ

let aikoMode = false; // あいこ継続中は掛け声が「しょっ!」になる

/* しょんぼり演出: うつむき+半目+への字口+腕だらん */
const headG   = svgRoot.getElementById('頭');
const ribbonG = svgRoot.getElementById('リボン');
const backHairG = svgRoot.getElementById('後ろ髪');
const eyeLHalf = svgRoot.getElementById('目L_半目');
const eyeRHalf = svgRoot.getElementById('目R_半目');
let blinkSuspend = false;

let droopHead = 0;   // 0〜1: しょんぼりのうつむき量(揺れループが参照)
function shonbori(ms=3200){
  stopTalk();
  setGesture('droop');
  droopHead = 1;   // うつむきはアイドル揺れループ側で合成
  // 半目+への字口+視線を落とす
  blinkSuspend = true;
  eyeLNorm.style.display='none'; eyeRNorm.style.display='none';
  eyeLHalf.style.display='';     eyeRHalf.style.display='';
  setMouth(3);
  const prevMode = gazeMode;
  gazeMode = 'fix'; gazeTarget = {x:0, y:1};   // 目線も下へ

  setTimeout(()=>{
    droopHead = 0;
    eyeLHalf.style.display='none'; eyeRHalf.style.display='none';
    eyeLNorm.style.display='';     eyeRNorm.style.display='';
    setMouth(0);
    blinkSuspend = false;
    gazeTarget = {x:0, y:0};
    setGazeMode(prevMode);
    setGesture('none');
  }, ms);
}

$('btnJanken').onclick = ()=>{
  if(jankenBusy) return;
  jankenBusy = true;
  aikoMode = false;
  $('btnJanken').classList.add('on');

  // 手を上げてグー
  setGesture('wave');
  setHandShape('rock');
  say('最初はーぐー!');
  startTalk(0,'さいしょはーぐー');

  setTimeout(()=>{
    say('じゃんけん…');
    startTalk(0,'じゃんけん');
    status.textContent = '手を選んでね!';
    choiceBox.style.display = 'flex';   // ここでユーザーの入力を待つ
  }, 1200);
};

function resolveJanken(userHand){
  choiceBox.style.display = 'none';
  const yuiHand = ['rock','scissors','paper'][Math.floor(Math.random()*3)];
  setHandShape(yuiHand);
  say(aikoMode ? 'しょっ!' : 'ぽんっ!');
  startTalk(0, aikoMode ? 'しょっ' : 'ぽん');

  const draw = (userHand === yuiHand);
  const userWin = (BEATS[userHand] === yuiHand);

  setTimeout(()=>{
    if(draw){
      // あいこ → 「あいこで〜」と続けて再度入力待ち
      aikoMode = true;
      say('あいこで〜');
      startTalk(0,'あいこでー');
      status.textContent = `二人とも${NAMES[yuiHand]}! あいこ! もう一度選んでね`;
      setTimeout(()=>{ choiceBox.style.display = 'flex'; }, 800);
      return;
    }
    const result = userWin ? 'あなたの勝ち!' : 'ゆいの勝ち!';
    if(userWin){ say('ゆいは' + NAMES[yuiHand] + '…まけたぁ…', 3000); shonbori(); }
    else { say('ゆいは' + NAMES[yuiHand] + '! ' + result, 3000); setGesture('banzai'); startTalk(0,'やったー'); }
    status.textContent = `あなた:${NAMES[userHand]} / ゆい:${NAMES[yuiHand]} → ${result}`;
    aikoMode = false;
    setTimeout(()=>{
      jankenBusy = false;
      $('btnJanken').classList.remove('on');
    }, 1300);
  }, 700);
}


/* ========== アイドル揺れ(頭ゆっくり+髪の遅れ追従) ========== */
const sideHairL = svgRoot.getElementById('横髪L');
const sideHairR = svgRoot.getElementById('横髪R');
const sideBaseL = sideHairL.getAttribute('transform') || '';
const sideBaseR = sideHairR.getAttribute('transform') || '';
let droopSm = 0; // うつむきのなめらか補間値

function swayLoop(ts){
  const t = ts/1000;
  droopSm += ((typeof droopHead!=='undefined'?droopHead:0) - droopSm) * 0.08;

  // 頭: ゆっくり左右に傾く+かすかな上下
  const headA = 1.6*Math.sin(t*0.9) + droopSm*2;         // 傾き(度)
  const headY = 1.2*Math.sin(t*1.8) + droopSm*6;          // 上下
  const headT = `translate(0,${headY.toFixed(2)}) rotate(${headA.toFixed(2)} 200 218)`;
  headG.setAttribute('transform', headT);
  ribbonG.setAttribute('transform', headT);

  // 後ろ髪: 位相を遅らせ振幅を大きく=髪が遅れてついてくる
  const hairA = 1.6*1.5*Math.sin(t*0.9 - 0.7) + droopSm*2;
  backHairG.setAttribute('transform',
    `translate(0,${headY.toFixed(2)}) rotate(${hairA.toFixed(2)} 200 150)`); // 髪はやや上を支点に

  // 横髪: さらに遅れて根本からしなる
  const sideA = 2.4*Math.sin(t*0.9 - 1.1);
  sideHairL.setAttribute('transform', `${sideBaseL} rotate(${sideA.toFixed(2)} 166 105)`);
  sideHairR.setAttribute('transform', `${sideBaseR} rotate(${sideA.toFixed(2)} 234 105)`);

  requestAnimationFrame(swayLoop);
}
requestAnimationFrame(swayLoop);

/* ========== 録画モード ========== */
// SVGを毎フレームcanvasへ描画してMediaRecorderでwebm録画(掛け声テキストも焼き込み)
let recorder = null, recChunks = [], recRAF = 0, recBusyFrame = false;
const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');

function currentViewRect(){
  const vb = svgRoot.getAttribute('viewBox').split(/\s+/).map(Number);
  return {x:vb[0], y:vb[1], w:vb[2], h:vb[3]};
}

let recFrames = 0;
function drawRecFrame(){
  if(recBusyFrame){ recRAF = requestAnimationFrame(drawRecFrame); return; }
  recBusyFrame = true;
  // 現在のviewBoxのままcanvasサイズを明示して直描画(dataURL方式: file://でも動く)
  let xml = new XMLSerializer().serializeToString(svgRoot);
  xml = xml.replace('<svg', `<svg width="${recCanvas.width}" height="${recCanvas.height}"`);
  const img = new Image();
  img.onload = ()=>{
    recCtx.fillStyle = '#ffffff';
    recCtx.fillRect(0,0,recCanvas.width,recCanvas.height);
    recCtx.drawImage(img, 0, 0, recCanvas.width, recCanvas.height);
    // 掛け声を焼き込み
    if(callout.style.opacity === '1' && callout.textContent){
      recCtx.font = '700 '+Math.round(recCanvas.height*0.09)+'px "Hiragino Kaku Gothic ProN", sans-serif';
      recCtx.textAlign = 'center';
      recCtx.lineWidth = 8; recCtx.strokeStyle = '#ffffff';
      recCtx.fillStyle = '#d4708f';
      const ty = recCanvas.height*0.14;
      recCtx.strokeText(callout.textContent, recCanvas.width/2, ty);
      recCtx.fillText(callout.textContent, recCanvas.width/2, ty);
    }
    // 字幕テロップの焼き込み(下部・白縁取り文字)
    if(subtitle.style.opacity === '1' && subtitle.textContent){
      const fs = Math.round(recCanvas.height*0.06);
      recCtx.font = '800 '+fs+'px "Hiragino Kaku Gothic ProN", sans-serif';
      recCtx.textAlign = 'center';
      recCtx.lineJoin = 'round';
      const txt = subtitle.textContent;
      const bx = recCanvas.width/2, by = recCanvas.height*0.9;
      recCtx.lineWidth = fs*0.32; recCtx.strokeStyle = '#ffffff';
      recCtx.strokeText(txt, bx, by);
      recCtx.fillStyle = '#c25b7e';
      recCtx.fillText(txt, bx, by);
    }
    recFrames++;
    recBusyFrame = false;
  };
  img.onerror = ()=>{ recBusyFrame = false; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  recRAF = requestAnimationFrame(drawRecFrame);
}

function startRec(){
  const vr = currentViewRect();
  const isTV = Math.abs(vr.w/vr.h - 16/9) < 0.01;
  if(isTV){ recCanvas.width = 1280; recCanvas.height = 720; }
  else { recCanvas.width = 720; recCanvas.height = Math.round(720*vr.h/vr.w); }

  // 最初のフレームを即描画してからストリーム開始
  recCtx.fillStyle = '#ffffff';
  recCtx.fillRect(0,0,recCanvas.width,recCanvas.height);

  recChunks = [];
  const stream = recCanvas.captureStream(30);
  // mp4を最優先。isTypeSupportedがtrueでも実際のstartで失敗する環境があるため、
  // MediaRecorderの生成まで含めて順に試す
  const CANDIDATES = [
    'video/mp4;codecs=avc1.640028',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  recorder = null;
  let usedMime = '';
  for(const m of CANDIDATES){
    if(!MediaRecorder.isTypeSupported(m)) continue;
    try{
      recorder = new MediaRecorder(stream, {mimeType:m, videoBitsPerSecond: 6_000_000});
      usedMime = m;
      break;
    }catch(err){ /* 次の候補へ */ }
  }
  if(!recorder){
    try{ recorder = new MediaRecorder(stream); usedMime = recorder.mimeType || 'video/webm'; }
    catch(err){
      status.textContent = '録画エラー: このブラウザはMediaRecorder非対応です';
      return;
    }
  }
  const isMp4 = usedMime.startsWith('video/mp4');

  recorder.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onerror = e=>{
    status.textContent = '録画エラー: ' + (e.error ? e.error.name : '不明');
    stopRec();
  };
  recorder.onstop = ()=>{
    if(recChunks.length === 0){
      status.textContent = '録画データが空でした。もう一度お試しください(フレーム描画に失敗している可能性)';
      return;
    }
    const blob = new Blob(recChunks, {type: isMp4 ? 'video/mp4' : 'video/webm'});
    const link = $('recLink');
    link.href = URL.createObjectURL(blob);
    link.download = isMp4 ? 'yui_anime.mp4' : 'yui_anime.webm';
    link.textContent = isMp4 ? '↓ 動画を保存 (mp4)' : '↓ 動画を保存 (webm)';
    link.style.display = '';
    status.textContent = '録画完了 ('+Math.round(blob.size/1024)+'KB)! リンクから保存できます';
  };
  recFrames = 0;
  recorder.start(250);   // 250msごとにチャンク回収(取りこぼし防止)
  drawRecFrame();
  $('btnRec').classList.add('on');
  $('btnRec').textContent = '■ 録画停止';
  $('recLink').style.display = 'none';
  status.textContent = '録画中… ('+recCanvas.width+'x'+recCanvas.height+' / '+usedMime.split(';')[0]+')';
}
function stopRec(){
  cancelAnimationFrame(recRAF);
  if(recorder && recorder.state !== 'inactive') recorder.stop();
  $('btnRec').classList.remove('on');
  $('btnRec').textContent = '● 録画開始';
  if(recFrames === 0){
    status.textContent = '注意: フレームが1枚も描画できませんでした(SVG画像化に失敗)。ブラウザを変えてお試しください';
  }
}
$('btnRec').onclick = ()=> (recorder && recorder.state === 'recording') ? stopRec() : startRec();

/* ========== 画面切替(全身 / バストアップ) ========== */
const VIEWS = {
  full: '0 0 400 640',
  bust: '10 40 380 213.75'   // 16:9(TVサイズ)で頭〜胸元を横長フレーミング
};

function setView(v){
  svgRoot.setAttribute('viewBox', VIEWS[v]);

$('vwBust').onclick = ()=>setView('bust');

/* ========== 口パク ========== */
// 口グループに開口シェイプを注入(閉じ/半開き/開き の3段階)
const mouthG = svgRoot.getElementById('口');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

// 既存(にこっと閉じ口)= shape0
const shapeClosed = el('g',{id:'口_閉'});
while(mouthG.firstChild) shapeClosed.appendChild(mouthG.firstChild);
mouthG.appendChild(shapeClosed);

// 半開き
const shapeHalf = el('g',{id:'口_半開', style:'display:none'});
shapeHalf.appendChild(el('ellipse',{cx:200, cy:184, rx:5.5, ry:3.4, fill:'#8a3a3a'}));
shapeHalf.appendChild(el('path',{d:'M194.5,184 Q200,186.5 205.5,184', fill:'none', stroke:'#a05446','stroke-width':1.2}));
mouthG.appendChild(shapeHalf);

// 開き(あ)
const shapeOpen = el('g',{id:'口_開', style:'display:none'});
shapeOpen.appendChild(el('path',{d:'M193,180 Q200,178.5 207,180 Q207.5,189 200,190.5 Q192.5,189 193,180 Z', fill:'#7c2f33'}));
shapeOpen.appendChild(el('path',{d:'M195.5,188.5 Q200,185.5 204.5,188.5 Q200,191.5 195.5,188.5 Z', fill:'#d97a76'}));
mouthG.appendChild(shapeOpen);

// への字口(しょんぼり用)
const shapeSad = el('g',{id:'口_しょんぼり', style:'display:none'});
shapeSad.appendChild(el('path',{d:'M193,186 Q200,180.5 207,186', fill:'none', stroke:'#a05446','stroke-width':1.8,'stroke-linecap':'round'}));
mouthG.appendChild(shapeSad);

// ---- 母音口形(あ・い・う・え・お) ----
function makeMouth(id, children){
  const g = el('g',{id, style:'display:none'});
  children.forEach(c=>g.appendChild(c));
  mouthG.appendChild(g);
  return g;
}
const mA = makeMouth('口_あ', [   // 大きく縦に開く
  el('path',{d:'M193,179.5 Q200,178 207,179.5 Q207.5,189.5 200,191 Q192.5,189.5 193,179.5 Z', fill:'#7c2f33'}),
  el('path',{d:'M195.5,189 Q200,186 204.5,189 Q200,192 195.5,189 Z', fill:'#d97a76'})]);
const mI = makeMouth('口_い', [   // 横に細く
  el('path',{d:'M192.5,183.5 Q200,182 207.5,183.5 Q200,186.5 192.5,183.5 Z', fill:'#8a3a3a'}),
  el('path',{d:'M192.5,183.5 Q200,182 207.5,183.5', fill:'none', stroke:'#a05446','stroke-width':1})]);
const mU = makeMouth('口_う', [   // 小さくすぼめる
  el('ellipse',{cx:200, cy:184, rx:3, ry:3.4, fill:'#8a3a3a'})]);
const mE = makeMouth('口_え', [   // 横広めの半開き
  el('path',{d:'M193.5,181.5 Q200,180.5 206.5,181.5 Q206.5,187 200,187.8 Q193.5,187 193.5,181.5 Z', fill:'#8a3a3a'})]);
const mO = makeMouth('口_お', [   // 縦丸
  el('ellipse',{cx:200, cy:184.5, rx:4.2, ry:5, fill:'#7c2f33'}),
  el('ellipse',{cx:200, cy:186.5, rx:2.4, ry:1.6, fill:'#d97a76'})]);

const mouthShapes = [shapeClosed, shapeHalf, shapeOpen, shapeSad, mA, mI, mU, mE, mO];
const VOWEL_MOUTH = {a:4, i:5, u:6, e:7, o:8, n:0};
function setMouth(i){ mouthShapes.forEach((s,j)=> s.style.display = (i===j?'':'none')); }

// ---- 母音ごとの目の開き具合(あ=ぱっちり 〜 い=細める) ----
const VOWEL_EYE = {a:1.0, i:0.62, u:0.8, e:0.88, o:0.96, n:1.0};
const eyeLG = svgRoot.getElementById('目L');
const eyeRG = svgRoot.getElementById('目R');
const eyeBaseL = eyeLG.getAttribute('transform');
const eyeBaseR = eyeRG.getAttribute('transform');
let eyeOpen = 1, eyeOpenTgt = 1;
function eyeLoop(){
  eyeOpen += (eyeOpenTgt - eyeOpen) * 0.3;
  const k = eyeOpen.toFixed(3);
  eyeLG.setAttribute('transform', `${eyeBaseL} translate(183,157) scale(1,${k}) translate(-183,-157)`);
  eyeRG.setAttribute('transform', `${eyeBaseR} translate(217,157) scale(1,${k}) translate(-217,-157)`);
  requestAnimationFrame(eyeLoop);
}
requestAnimationFrame(eyeLoop);

// ---- かな→母音 ----
const KANA_V = {};
[['aあかさたなはまやらわがざだばぱゃぁァ'],['iいきしちにひみりぎじぢびぴぃィ'],
 ['uうくすつぬふむゆるぐずづぶぷゅっぅゥ'],['eえけせてねへめれげぜでべぺぇェ'],
 ['oおこそとのほもよろをごぞどぼぽょぉォ']].forEach(([s])=>{
  const v = s[0]; for(const ch of s.slice(1)) KANA_V[ch] = v;
});
function toHira(ch){ const c=ch.charCodeAt(0); return (c>=0x30A1&&c<=0x30F6)? String.fromCharCode(c-0x60) : ch; }
function vowelOf(ch, prev){
  const h = toHira(ch);
  if(h==='ー') return prev || 'a';       // 長音は前の母音を伸ばす
  if(h==='ん') return 'n';
  if(KANA_V[h]) return KANA_V[h];
  if(/[、。!?!? 　…]/.test(h)) return 'n'; // 句読点は口を閉じる
  return 'aiueo'[Math.floor(Math.random()*5)]; // 漢字などはランダム母音
}

let talkTimer = null, talkUntil = 0, talkScript = null, talkIdx = 0, lastVowel = 'a';
function applyVowel(v){
  setMouth(VOWEL_MOUTH[v]);
  eyeOpenTgt = VOWEL_EYE[v];
  lastVowel = (v==='n') ? lastVowel : v;
}
function talkTick(){
  const speed = +$('talkSpeed').value;
  let v;
  if(talkScript){
    if(talkIdx >= talkScript.length){ stopTalk(); return; }
    v = vowelOf(talkScript[talkIdx++], lastVowel);
  }else{
    v = 'aiueoau'[Math.floor(Math.random()*7)]; // フリートークはランダム母音(あ・う多め)
  }
  applyVowel(v);
  if(talkUntil && performance.now() > talkUntil){ stopTalk(); return; }
  talkTimer = setTimeout(talkTick, speed + Math.random()*40);
}
function startTalk(duration, text){
  stopTalk();
  talkScript = text ? [...text] : null;
  talkIdx = 0;
  talkUntil = duration ? performance.now()+duration : 0;
  $('btnTalk').classList.add('on'); $('btnTalk').textContent='しゃべる停止';
  status.textContent = '口パク中…';
  talkTick();
}
function stopTalk(){
  clearTimeout(talkTimer); talkTimer=null; talkUntil=0; talkScript=null;
  if(typeof subtitle!=='undefined') hideSubtitle();
  setMouth(0);
  eyeOpenTgt = 1;
  $('btnTalk').classList.remove('on'); $('btnTalk').textContent='しゃべる開始';
  status.textContent = '待機中';
}
$('btnTalk').onclick = ()=> talkTimer ? stopTalk() : startTalk(0);
const subtitle = $('subtitle');
function showSubtitle(text){ subtitle.textContent = text; subtitle.style.opacity = 1; }
function hideSubtitle(){ subtitle.style.opacity = 0; }

$('btnSpeak').onclick = ()=>{
  const t = $('talkText').value.trim();
  if(!t) return;
  startTalk(0, t);  // 1文字=1tick、テキストの母音どおりに口と目が動く
  showSubtitle(t);
  status.textContent = '「'+ t.slice(0,12) + (t.length>12?'…':'') +'」再生中';
};

/* ========== 視線 ========== */
const pupilL = svgRoot.getElementById('瞳L');
const pupilR = svgRoot.getElementById('瞳R');
let gazeMode = 'mouse';           // mouse | auto | fix
let gaze = {x:0,y:0};             // 現在値
let gazeTarget = {x:0,y:0};       // 目標値
let autoTimer = 0;

function setGazeMode(m){
  gazeMode = m;
  ['gzMouse','gzAuto','gzFix'].forEach(id=>$(id).classList.remove('on'));
  ({mouse:'gzMouse', auto:'gzAuto', fix:'gzFix'})[m] && $({mouse:'gzMouse',auto:'gzAuto',fix:'gzFix'}[m]).classList.add('on');
  if(m==='fix') gazeTarget = {x:0,y:0};
}
$('gzMouse').onclick = ()=>setGazeMode('mouse');
$('gzAuto').onclick  = ()=>setGazeMode('auto');
$('gzFix').onclick   = ()=>setGazeMode('fix');

document.getElementById('stage').addEventListener('mousemove', e=>{
  if(gazeMode!=='mouse') return;
  const r = svgRoot.getBoundingClientRect();
  const nx = ((e.clientX - r.left)/r.width  - 0.5) * 2;   // -1〜1
  const ny = ((e.clientY - r.top )/r.height - gazeAnchorY) * 2;  // ビューに応じた顔位置基準
  gazeTarget = { x: Math.max(-1,Math.min(1,nx)), y: Math.max(-1,Math.min(1,ny)) };
});

function gazeLoop(ts){
  // 自動モード: 1〜3秒ごとにランダムな視線先
  if(gazeMode==='auto' && ts > autoTimer){
    gazeTarget = { x:(Math.random()*2-1)*0.9, y:(Math.random()*2-1)*0.5 };
    autoTimer = ts + 1000 + Math.random()*2000;
  }
  // なめらか補間
  gaze.x += (gazeTarget.x - gaze.x) * 0.12;
  gaze.y += (gazeTarget.y - gaze.y) * 0.12;
  const R = +$('gazeRange').value;
  const tx = gaze.x * R, ty = gaze.y * R * 0.6;
  pupilL.setAttribute('transform', `translate(${tx},${ty})`);
  pupilR.setAttribute('transform', `translate(${tx},${ty})`);
  requestAnimationFrame(gazeLoop);
}
requestAnimationFrame(gazeLoop);

/* ========== まばたき ========== */
// 閉じ目シェイプ(下向きのゆるいカーブ=普通に目を閉じた形)を注入して一瞬切り替え
const eyeLNorm = svgRoot.getElementById('目L_通常');
const eyeRNorm = svgRoot.getElementById('目R_通常');

const eyeLShut = el('g',{id:'目L_閉じ', style:'display:none'});
eyeLShut.appendChild(el('path',{d:'M170,158 C176,163 190,163 195,157', fill:'none', stroke:'#4a1e22','stroke-width':3,'stroke-linecap':'round'}));
eyeLShut.appendChild(el('path',{d:'M172,163 C178,166.5 188,166.5 193,163', fill:'none', stroke:'#e0b391','stroke-width':1.2,'stroke-linecap':'round'}));
eyeLNorm.parentNode.insertBefore(eyeLShut, eyeLNorm.nextSibling);

const eyeRShut = el('g',{id:'目R_閉じ', style:'display:none'});
eyeRShut.appendChild(el('path',{d:'M230,158 C224,163 210,163 205,157', fill:'none', stroke:'#4a1e22','stroke-width':3,'stroke-linecap':'round'}));
eyeRShut.appendChild(el('path',{d:'M228,163 C222,166.5 212,166.5 207,163', fill:'none', stroke:'#e0b391','stroke-width':1.2,'stroke-linecap':'round'}));
eyeRNorm.parentNode.insertBefore(eyeRShut, eyeRNorm.nextSibling);

let blinkAuto = true, blinkTimer = null;

function blinkOnce(){
  if(blinkSuspend) return;   // しょんぼり中(半目)は瞬きしない
  eyeLNorm.style.display='none'; eyeRNorm.style.display='none';
  eyeLShut.style.display='';     eyeRShut.style.display='';
  setTimeout(()=>{
    eyeLNorm.style.display='';   eyeRNorm.style.display='';
    eyeLShut.style.display='none'; eyeRShut.style.display='none';
  }, 130);
}
function scheduleBlink(){
  blinkTimer = setTimeout(()=>{
    if(blinkAuto){
      blinkOnce();
      // たまに二連まばたき
      if(Math.random()<0.25) setTimeout(blinkOnce, 260);
    }
    scheduleBlink();
  }, 2500 + Math.random()*3500);
}
scheduleBlink();
$('btnBlinkOnce').onclick = blinkOnce;
$('btnBlink').onclick = e=>{
  blinkAuto = !blinkAuto;
  e.target.classList.toggle('on', blinkAuto);
  e.target.textContent = blinkAuto ? '自動まばたき ON' : '自動まばたき OFF';
};
