// ---- トレース+パーツ割り当て(FILL) ----
// 通常のトレース(現在のモード設定)を行い、最後に各パスを塗りシード由来の
// パーツへ割り当てて <g id=part> にまとめる。塗りは元画像の色のまま(FILL編集可)
function computeLabels(){
  const mask=$('maskCv'), base=$('baseCv'), w=mask.width, h=mask.height;
  const md=mask.getContext('2d').getImageData(0,0,w,h).data;
  const bd=base.getContext('2d').getImageData(0,0,w,h).data;
  const N=w*h;
  const partKeys=Object.keys(PARTS);
  let br=0,bg2=0,bb=0,bc=0;
  const samp=(x,y)=>{const i=(y*w+x)*4;br+=bd[i];bg2+=bd[i+1];bb+=bd[i+2];bc++;};
  for(let x=0;x<w;x+=3){samp(x,0);samp(x,h-1);}
  for(let y=0;y<h;y+=3){samp(0,y);samp(w-1,y);}
  br/=bc;bg2/=bc;bb/=bc;
  const fg=new Uint8Array(N);
  for(let i=0;i<N;i++){
    const dr=bd[i*4]-br,dg=bd[i*4+1]-bg2,db=bd[i*4+2]-bb;
    if(dr*dr+dg*dg+db*db>2500 || bd[i*4+3]<200) fg[i]=1;
  }
  const partRGB=partKeys.map(k=>{const hx=PARTS[k];
    return [parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)];});
  const label=new Int16Array(N).fill(-1);
  const q=new Int32Array(N); let qh=0,qt=0;
  for(let i=0;i<N;i++){
    if(md[i*4+3]<=40) continue;
    for(let p=0;p<partKeys.length;p++){
      const dr=md[i*4]-partRGB[p][0],dg=md[i*4+1]-partRGB[p][1],db=md[i*4+2]-partRGB[p][2];
      if(dr*dr+dg*dg+db*db<3600){ if(fg[i]){label[i]=p;q[qt++]=i;} break; }
    }
  }
  if(qt===0) return null;
  while(qh<qt){
    const i=q[qh++],p=label[i],x=i%w,y=(i/w)|0;
    if(x>0&&fg[i-1]&&label[i-1]<0){label[i-1]=p;q[qt++]=i-1;}
    if(x<w-1&&fg[i+1]&&label[i+1]<0){label[i+1]=p;q[qt++]=i+1;}
    if(y>0&&fg[i-w]&&label[i-w]<0){label[i-w]=p;q[qt++]=i-w;}
    if(y<h-1&&fg[i+w]&&label[i+w]<0){label[i+w]=p;q[qt++]=i+w;}
  }
  return {label,w,h,partKeys};
}

// パス内部の代表点を求めてラベルを引く(頂点平均→ダメなら頂点多数決)
function pathPart(d,lab){
  const nums=[...d.matchAll(/(-?\d+\.?\d*)[ ,](-?\d+\.?\d*)/g)]
    .map(m=>[parseFloat(m[1]),parseFloat(m[2])]);
  if(!nums.length) return -1;
  const look=(x,y)=>{
    const xi=Math.min(lab.w-1,Math.max(0,Math.round(x)));
    const yi=Math.min(lab.h-1,Math.max(0,Math.round(y)));
    return lab.label[yi*lab.w+xi];
  };
  let ax=0,ay=0;
  for(const [x,y] of nums){ax+=x;ay+=y;}
  const c=look(ax/nums.length, ay/nums.length);
  if(c>=0) return c;
  const votes={};
  for(const [x,y] of nums){const v=look(x,y);if(v>=0)votes[v]=(votes[v]||0)+1;}
  let best=-1,bn=0;
  for(const k in votes) if(votes[k]>bn){bn=votes[k];best=+k;}
  return best;
}

$('assignTrace').onclick=()=>{
  if(!paintReady) return;
  $('busy').classList.remove('hidden');
  setTimeout(()=>{
    try{
      const lab=computeLabels();
      if(!lab) throw new Error('前景に塗りがありません。キャラの上を塗ってください');
      const base=$('baseCv'), w=base.width, h=base.height;
      const imgd=base.getContext('2d').getImageData(0,0,w,h);
      if(mode==='mono'){
        const d=imgd.data;
        for(let i=0;i<w*h;i++){
          const l=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
          const v=l<128?0:255; d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255;
        }
      }
      let traced=ImageTracer.imagedataToSVG(imgd,options());
      {
        const bgc=estimateBg(base.getContext('2d').getImageData(0,0,w,h).data,w,h);
        traced=stripBgPaths(traced,mode==='mono'?[255,255,255]:bgc).svg;
      }
      // 各パスをパーツに振り分け(SVG化の最終段で割り当て)
      const buckets={}; lab.partKeys.forEach(k=>buckets[k]=[]); buckets.other=[];
      for(const m2 of traced.matchAll(/<path[^>]*\/>/g)){
        const tag=m2[0];
        const dm=tag.match(/d="([^"]+)"/); if(!dm) continue;
        // 背景色(ほぼ白全面)のパスは除外候補: 面積判定の代わりに最初のパス(全面)を除く
        const p=pathPart(dm[1],lab);
        (p>=0 ? buckets[lab.partKeys[p]] : buckets.other).push(tag);
      }
      const groups=[];
      for(const k of lab.partKeys)
        if(buckets[k].length) groups.push(`<g id="${k}" data-name="${PART_NAMES[k]}">${buckets[k].join('')}</g>`);
      if(buckets.other.length) groups.push(`<g id="other" data-name="未割り当て">${buckets.other.join('')}</g>`);
      svgStr=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${groups.join('')}</svg>`;
      $('svgHolder').innerHTML=svgStr;showBar();
      const s=$('svgHolder').querySelector('svg');
      if(s){s.style.width=w+'px';s.style.maxWidth='100%';s.style.height='auto';s.style.maxHeight='100%';s.style.display='block';}
      $('codeArea').value=prettySVG(svgStr);
      $('dl').disabled=$('copy').disabled=$('toKum').disabled=false;
      tab('svg');
      const cnt=lab.partKeys.filter(k=>buckets[k].length).length;
      $('stats').innerHTML=`トレース後にパーツ割り当てしました(${cnt}パーツ+未割り当て${buckets.other.length}パス)<br>各&lt;g id&gt;内のパスはFILLそのまま編集できます。不要な線はパス消しゴムで消せます`;
    }catch(err){
      $('stats').innerHTML='<span style="color:var(--danger)">生成エラー: '+err.message+'</span>';
    }
    $('busy').classList.add('hidden');
  },30);
};

7%E3%81%BE%E3%81%97%E3%81%9F%27%3B%7D%0A%7D%3B%0A%3C%2Fscript%3E%0A%3C%2Fbody%3E%0A%3C%2Fhtml%3E%0A");
let kumLoaded=false, kumReady=false, pendingSvg=null;
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='kumReady'){
    kumReady=true;
    if(pendingSvg){
      $('kumFrame').contentWindow.postMessage({type:'loadSVG',svg:pendingSvg},'*');
      pendingSvg=null;
    }
  }
});
function showMode(kum){
  document.querySelector('main').style.display=kum?'none':'grid';
  $('kumView').style.display=kum?'flex':'none';
  $('modeVec').style.background=kum?'var(--panel2)':'var(--accent)';
  $('modeVec').style.color=kum?'var(--text)':'#08221c';
  $('modeVec').style.border=kum?'1px solid var(--line)':'0';
  $('modeKum').style.background=kum?'var(--accent)':'var(--panel2)';
  $('modeKum').style.color=kum?'#08221c':'var(--text)';
  $('modeKum').style.border=kum?'0':'1px solid var(--line)';
  if(kum&&!kumLoaded){$('kumFrame').srcdoc=KUM_SRC;kumLoaded=true;}
}
$('modeVec').onclick=()=>showMode(false);
$('modeKum').onclick=()=>showMode(true);
$('toKum').onclick=()=>{
  if(!svgStr){$('stats').innerHTML='<span style="color:var(--danger)">先にSVGを生成してください</span>';return;}
  showMode(true);
  if(kumReady){
    $('kumFrame').contentWindow.postMessage({type:'loadSVG',svg:svgStr},'*');
  }else{
    pendingSvg=svgStr; // 組み立て側の起動完了通知を待って自動送信
  }
  $('stats').innerHTML='組み立てに送りました。②タブで取り込まれています';
};

$('dl').onclick=()=>{
  try{
    const a=document.createElement('a');
    a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
    a.download=fname+'.svg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    $('stats').innerHTML+='<br><span style="color:var(--muted)">※保存されない場合は下の「SVGコードを直接表示」からコピーしてください</span>';
  }catch(e){
    $('codeBox').open=true;
    $('codeArea').focus();$('codeArea').select();
  }
};
$('copy').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(svgStr);
    $('copy').textContent='コピーしました ✓';
  }catch(e){
    // クリップボードAPIが使えない環境: コード欄を開いて全選択
    $('codeBox').open=true;
    $('codeArea').focus();$('codeArea').select();
    try{document.execCommand('copy');$('copy').textContent='コピーしました ✓';}
    catch(e2){$('copy').textContent='下の欄からコピーしてください';}
  }
  setTimeout(()=>$('copy').textContent='SVGコードをコピー',2000);
};
</script>
