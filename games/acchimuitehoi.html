<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131320'/%3E%3Cpath d='M32 56 L13 43 L8 9 L26 21 Q32 17 38 21 L56 9 L51 43 Z' fill='%23D9A94C'/%3E%3C/svg%3E">
<meta name="theme-color" content="#131320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あっち向いてホイ vs 咲耶</title>
<style>
  :root{
    --night:#191926; --night2:#202032; --line:#343452;
    --text:#F4EFEA; --sub:#9a9ab8;
    --sakura:#F2A9C4; --sakura2:#E8789F; --gold:#E4C24F; --fox:#E8955C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--night); color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 16px; border-bottom:1px solid var(--line);
  }
  header h1{font-size:16px; letter-spacing:.14em;}
  header h1 b{color:var(--sakura);}
  header h1 small{font-size:11px; color:var(--sub); letter-spacing:.06em; margin-left:8px;}
  #score{display:flex; align-items:center; gap:10px; font-size:12px;}
  .scoreSide{display:flex; align-items:center; gap:6px;}
  .scoreSide .name{color:var(--sub); letter-spacing:.1em;}
  .pips{display:flex; gap:4px;}
  .pip{
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid var(--line); background:transparent;
    display:inline-flex; align-items:center; justify-content:center; font-size:11px;
    transition:all .25s;
  }
  .pip.on{border-color:transparent;}
  .pip.p.on::before{content:"🌸";}
  .pip.c.on::before{content:"🦊";}
  #vsdot{color:var(--line); font-size:14px;}

  /* ---------- ステージ ---------- */
  #stage{
    flex:1; position:relative; min-height:0;
    background:
      radial-gradient(ellipse at 50% 30%, #2b2b48 0%, transparent 60%),
      radial-gradient(circle at 12% 88%, rgba(242,169,196,.10), transparent 34%),
      radial-gradient(circle at 88% 14%, rgba(242,169,196,.08), transparent 30%),
      var(--night);
    overflow:hidden;
  }
  #chara{
    position:absolute; inset:0; width:100%; height:100%;
    border:none; background:transparent; pointer-events:none;
  }
  /* 呼び声(じゃんけんぽん!等)のスタンプ */
  #fx{
    position:absolute; left:50%; top:16%;
    transform:translateX(-50%) scale(0.4) rotate(-6deg);
    font-size:min(9vw,52px); font-weight:bold; letter-spacing:.1em;
    color:var(--sakura); -webkit-text-stroke:1.5px #3a2434;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
    opacity:0; pointer-events:none; white-space:nowrap;
  }
  #fx.pop{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stamp{
    0%{opacity:0; transform:translateX(-50%) scale(0.4) rotate(-6deg);}
    60%{opacity:1; transform:translateX(-50%) scale(1.12) rotate(2deg);}
    100%{opacity:1; transform:translateX(-50%) scale(1) rotate(0deg);}
  }
  /* 咲耶の手・向きの吹き出し */
  #cpuBubble{
    position:absolute; right:12%; top:14%;
    min-width:76px; padding:10px 14px; border-radius:18px 18px 18px 4px;
    background:#F7F1EA; color:#2a2a36; font-size:44px; line-height:1;
    text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.35);
    opacity:0; transform:scale(.5); transition:all .22s cubic-bezier(.2,1.5,.4,1);
  }
  #cpuBubble.show{opacity:1; transform:scale(1);}
  #cpuBubble .cap{display:block; font-size:10px; letter-spacing:.16em; color:#8a7a86; margin-top:6px;}
  /* プレイヤーの選択表示 */
  #playerBubble{
    position:absolute; left:12%; bottom:14%;
    min-width:76px; padding:10px 14px; border-radius:18px 18px 4px 18px;
    background:var(--sakura); color:#3a2434; font-size:44px; line-height:1;
    text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.35);
    opacity:0; transform:scale(.5); transition:all .22s cubic-bezier(.2,1.5,.4,1);
  }
  #playerBubble.show{opacity:1; transform:scale(1);}
  #playerBubble .cap{display:block; font-size:10px; letter-spacing:.16em; color:#6e3a52; margin-top:6px;}
  /* 桜吹雪 */
  .petal{
    position:absolute; font-size:22px; pointer-events:none;
    animation:fall 1.6s ease-in forwards;
  }
  @keyframes fall{
    0%{opacity:0; transform:translateY(-10px) rotate(0deg);}
    15%{opacity:1;}
    100%{opacity:0; transform:translateY(46vh) rotate(300deg);}
  }

  /* ---------- 操作ボード ---------- */
  #board{
    flex:0 0 auto; border-top:1px solid var(--line);
    background:var(--night2); padding:12px 16px 16px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #msg{font-size:14px; letter-spacing:.06em; min-height:20px; text-align:center;}
  #msg b{color:var(--sakura);}
  #btns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:64px; align-items:center;}
  button.game{
    font-family:inherit; font-size:15px; color:var(--text);
    background:var(--night); border:1.5px solid var(--line); border-radius:14px;
    padding:10px 18px; cursor:pointer; letter-spacing:.06em;
    transition:transform .12s, border-color .12s, background .12s;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  button.game .big{font-size:30px; line-height:1.1;}
  button.game .lbl{font-size:11px; color:var(--sub);}
  button.game:hover{border-color:var(--sakura); background:#262640;}
  button.game:active{transform:scale(.93);}
  button.game:focus-visible{outline:2px solid var(--sakura); outline-offset:2px;}
  button.game.primary{border-color:var(--sakura2); background:var(--sakura2); color:#fff;}
  button.game.primary .lbl{color:#ffd9e6;}
  .dirGrid{display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,auto); gap:8px; justify-items:center;}
  .dirGrid .up{grid-column:2; grid-row:1;}
  .dirGrid .left{grid-column:1; grid-row:2;}
  .dirGrid .down{grid-column:2; grid-row:2;}
  .dirGrid .right{grid-column:3; grid-row:2;}
  @media (prefers-reduced-motion:reduce){
    #fx.pop{animation:none; opacity:1; transform:translateX(-50%);}
    .petal{animation:none; opacity:0;}
    #cpuBubble,#playerBubble{transition:none;}
  }
</style>
</head>
<body>
<header>
  <h1>あっち向いて<b>ホイ</b><small>vs 咲耶(CryptoNinja 二次創作)</small></h1>
  <div id="score">
    <div class="scoreSide"><span class="name">あなた</span><span class="pips" id="pPips"></span></div>
    <span id="vsdot">─</span>
    <div class="scoreSide"><span class="pips" id="cPips"></span><span class="name">咲耶</span></div>
  </div>
</header>

<div id="stage">
  <iframe id="chara" allowtransparency="true" title="咲耶"></iframe>
  <div id="cpuBubble"><span id="cpuIcon"></span><span class="cap" id="cpuCap"></span></div>
  <div id="playerBubble"><span id="pIcon"></span><span class="cap" id="pCap"></span></div>
  <div id="fx"></div>
</div>

<div id="board">
  <div id="msg"></div>
  <div id="btns"></div>
</div>

  '<body><scr' + 'ipt>window.__CHARA_CONFIG={embed:1,clear:1,char:"cn_sakuya"}</scr' + 'ipt>');

const chara = (cmd, arg, arg2) => {
  try{ frame.contentWindow.postMessage({chara:{cmd, arg, arg2}}, "*"); }catch(_){}
};

/* ================================================================
   ちいさな効果音(WebAudio)
================================================================ */
let ac = null;
const tone = (f, dur=0.09, type="square", vol=0.05, when=0) => {
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, ac.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + when + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + when); o.stop(ac.currentTime + when + dur + 0.02);
};
const sePon  = () => tone(660, 0.1, "square", 0.06);
const seHoi  = () => { tone(520, 0.08); tone(780, 0.12, "square", 0.06, 0.09); };
const seGood = () => [523, 659, 784, 1046].forEach((f,i) => tone(f, 0.14, "triangle", 0.06, i*0.09));
const seBad  = () => [392, 330, 262].forEach((f,i) => tone(f, 0.16, "triangle", 0.06, i*0.11));
document.addEventListener("pointerdown", () => {
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
}, {once:true});

/* ================================================================
   表示部品
================================================================ */
const WIN_AT = 3;
let pScore = 0, cScore = 0;
function drawScore(){
  const mk = (n, cls) => Array.from({length:WIN_AT}, (_,i) =>
    `<span class="pip ${cls} ${i<n?"on":""}"></span>`).join("");
  $("pPips").innerHTML = mk(pScore, "p");
  $("cPips").innerHTML = mk(cScore, "c");
}
function call(text){
  const fx = $("fx");
  fx.classList.remove("pop");
  void fx.offsetWidth;
  fx.textContent = text;
  fx.classList.add("pop");
}
function clearCall(){ $("fx").classList.remove("pop"); $("fx").textContent = ""; }
function bubble(which, icon, cap){
  const box = $(which === "cpu" ? "cpuBubble" : "playerBubble");
  $(which === "cpu" ? "cpuIcon" : "pIcon").textContent = icon || "";
  $(which === "cpu" ? "cpuCap" : "pCap").textContent = cap || "";
  box.classList.toggle("show", !!icon);
}
function msg(html){ $("msg").innerHTML = html; }
function setButtons(list){
  const box = $("btns");
  box.innerHTML = "";
  list.forEach(b => {
    const el = document.createElement("button");
    el.className = "game" + (b.primary ? " primary" : "");
    el.innerHTML = (b.big ? `<span class="big">${b.big}</span>` : "") +
                   (b.lbl ? `<span class="lbl">${b.lbl}</span>` : "");
    if(!b.big && !b.lbl) el.textContent = b.text || "";
    if(b.text && (b.big||b.lbl)) el.prepend(document.createTextNode(b.text));
    if(b.cls) el.classList.add(b.cls);
    el.addEventListener("click", b.cb);
    box.appendChild(el);
  });
  return box;
}
function setDirButtons(cb){
  const box = $("btns");
  box.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "dirGrid";
  DIRS.forEach(d => {
    const el = document.createElement("button");
    el.className = "game " + d.k;
    el.innerHTML = `<span class="big">${d.arrow}</span><span class="lbl">${d.n}</span>`;
    el.addEventListener("click", () => cb(d));
    grid.appendChild(el);
  });
  box.appendChild(grid);
}
function petals(n = 14){
  const st = $("stage");
  for(let i = 0; i < n; i++){
    const p = document.createElement("span");
    p.className = "petal";
    p.textContent = "🌸";
    p.style.left = (8 + Math.random()*84) + "%";
    p.style.top = (Math.random()*18) + "%";
    p.style.animationDelay = (Math.random()*0.5) + "s";
    p.style.fontSize = (14 + Math.random()*16) + "px";
    st.appendChild(p);
    setTimeout(() => p.remove(), 2400);
  }
}

/* ================================================================
   ゲームデータ
================================================================ */
const HANDS = [
  {k:"g", e:"✊", n:"グー"},
  {k:"c", e:"✌️", n:"チョキ"},
  {k:"p", e:"✋", n:"パー"},
];
const BEATS = {g:"c", c:"p", p:"g"};   /* key が value に勝つ */
const DIRS = [
  {k:"up",    n:"うえ",   arrow:"⬆️", point:"👆", x:0,  y:-1},
  {k:"down",  n:"した",   arrow:"⬇️", point:"👇", x:0,  y:1},
  {k:"left",  n:"ひだり", arrow:"⬅️", point:"👈", x:-1, y:0},
  {k:"right", n:"みぎ",   arrow:"➡️", point:"👉", x:1,  y:0},
];

/* ================================================================
   ゲーム進行
================================================================ */
let busy = false;

async function startMatch(){
  pScore = 0; cScore = 0;
  drawScore();
  chara("expression", "normal");
  chara("loop", null);
  chara("look", 0, 0);
  clearCall();
  bubble("cpu", ""); bubble("player", "");
  jankenTurn(true);
}

function jankenTurn(first){
  msg(first
    ? "じゃんけんで勝ったほうが<b>指を差す</b>よ。先に " + WIN_AT + " 本とったら勝ち!"
    : "つぎのじゃんけん!手を選んでね");
  chara("expression", "normal");
  chara("loop", "yura");
  setButtons(HANDS.map(h => ({big:h.e, lbl:h.n, cb:() => playJanken(h)})));
}

async function playJanken(hand){
  if(busy) return; busy = true;
  setButtons([]);
  bubble("cpu", ""); bubble("player", "");
  bubble("player", hand.e, "あなた");
  chara("loop", "rhythm");
  chara("expression", "waku");
  call("じゃんけん…");
  sePon();
  await sleep(850);

  const cpu = rand(HANDS);
  chara("loop", null);
  chara("motion", "jump");
  call("ぽん!");
  seHoi();
  bubble("cpu", cpu.e, "咲耶");
  await sleep(750);

  if(cpu.k === hand.k){
    msg("あいこ! もう一回!");
    chara("motion", "tilt");
    await sleep(800);
    busy = false;
    bubble("cpu", ""); bubble("player", "");
    clearCall();
    msg("あいこで…しょ! 手を選んで!");
    setButtons(HANDS.map(h => ({big:h.e, lbl:h.n, cb:() => playJanken(h)})));
    return;
  }
  const playerWon = BEATS[hand.k] === cpu.k;
  if(playerWon){
    msg("じゃんけんは<b>あなたの勝ち</b>!");
    chara("expression", "sad");
    chara("motion", "surprise");
  }else{
    msg("じゃんけんは<b>咲耶の勝ち</b>!");
    chara("expression", "happy");
    chara("motion", "joy");
  }
  await sleep(1000);
  bubble("cpu", ""); bubble("player", "");
  clearCall();
  busy = false;
  pointPhase(playerWon);
}

function pointPhase(playerIsPointer){
  if(playerIsPointer){
    msg("<b>あっち向いてホイ!</b> 指を差す向きを選んで!(咲耶がその向きを向いたらポイント)");
    chara("expression", "waku");
    setDirButtons(d => resolvePoint(true, d));
  }else{
    msg("咲耶が指を差すよ…! <b>指と違う向き</b>を向いてかわそう!");
    chara("expression", "waku");
    chara("loop", "pump");
    setDirButtons(d => resolvePoint(false, d));
  }
}

async function resolvePoint(playerIsPointer, playerDir){
  if(busy) return; busy = true;
  setButtons([]);
  chara("loop", null);

  call("あっち向いて…");
  sePon();
  await sleep(750);

  const cpuDir = rand(DIRS);
  call("ホイ!");
  seHoi();

  if(playerIsPointer){
    /* あなたが指差し、咲耶が顔を向ける */
    bubble("player", playerDir.point, "あなたの指");
    chara("look", cpuDir.x, cpuDir.y);
    chara("motion", "surprise");
    await sleep(500);
    bubble("cpu", cpuDir.arrow, "咲耶の顔");
  }else{
    /* 咲耶が指差し、あなたが顔を向ける */
    bubble("cpu", cpuDir.point, "咲耶の指");
    chara("motion", "thrust");
    chara("look", cpuDir.x*0.6, cpuDir.y*0.6);
    await sleep(500);
    bubble("player", playerDir.arrow, "あなたの顔");
  }
  await sleep(700);

  const match = playerDir.k === cpuDir.k;
  const playerScored = playerIsPointer && match;
  const cpuScored = !playerIsPointer && match;

  if(playerScored){
    pScore++;
    drawScore();
    msg("ばっちり一致! <b>あなたのポイント!</b>");
    chara("expression", "sad");
    chara("motion", "damage");
    petals();
    seGood();
  }else if(cpuScored){
    cScore++;
    drawScore();
    msg("指された〜! <b>咲耶のポイント!</b>");
    chara("expression", "happy");
    chara("motion", "victory");
    seBad();
  }else{
    msg(playerIsPointer ? "かわされた! もう一回じゃんけん!" : "セーフ! もう一回じゃんけん!");
    chara("expression", playerIsPointer ? "happy" : "normal");
    chara("motion", playerIsPointer ? "tilt" : "sigh");
  }
  await sleep(1300);

  chara("look", 0, 0);
  bubble("cpu", ""); bubble("player", "");
  clearCall();
  busy = false;

  if(pScore >= WIN_AT || cScore >= WIN_AT){ matchEnd(); }
  else{ jankenTurn(false); }
}

function matchEnd(){
  const won = pScore >= WIN_AT;
  if(won){
    call("🌸 勝利 🌸");
    msg("<b>あなたの勝ち!</b> 咲耶はくやしそう…");
    chara("expression", "sad");
    chara("motion", "down");
    setTimeout(() => chara("loop", "tremble"), 1900);
    petals(24);
    seGood();
  }else{
    call("咲耶の勝ち!");
    msg("<b>咲耶の勝ち!</b> 完敗…もう一回挑戦する?");
    chara("expression", "happy");
    chara("loop", "cheer");
    seBad();
  }
  setButtons([{text:"もう一回勝負!", primary:true, cb:startMatch}]);
}

/* ================================================================
   起動
================================================================ */
drawScore();
msg("咲耶(CryptoNinja 非公式二次創作)と<b>あっち向いてホイ</b>で勝負!");
setButtons([{text:"はじめる", primary:true, cb:startMatch}]);
</script>
