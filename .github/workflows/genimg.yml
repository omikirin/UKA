name: 画像生成 (fal.ai)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '生成プロンプト(英語推奨)'
        required: true
        type: string
      path:
        description: '保存先パス(例: manga/img/ch03/cover.jpg)'
        required: true
        type: string
      aspect_ratio:
        description: '縦横比(nano-banana系: 1:1 / 3:4 / 4:3 / 9:16 / 16:9 / 21:9)'
        required: false
        default: '3:4'
        type: string
      model:
        description: 'falモデルID'
        required: false
        default: 'fal-ai/nano-banana-pro'
        type: choice
        options:
          - fal-ai/nano-banana-pro
          - fal-ai/nano-banana
          - fal-ai/flux/dev
          - fal-ai/flux/schnell
      image_size:
        description: 'flux系のみ使用(square_hd / portrait_4_3 / landscape_16_9 等)'
        required: false
        default: ''
        type: string
      image_urls:
        description: '参照画像URL(カンマ区切り)。編集系モデル(nano-banana-pro/edit等)で使用'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 画像を生成してダウンロード
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PROMPT: ${{ inputs.prompt }}
          OUT_PATH: ${{ inputs.path }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          IMAGE_SIZE: ${{ inputs.image_size }}
          IMAGE_URLS: ${{ inputs.image_urls }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${FAL_KEY:-}" ]; then
            echo "::error::リポジトリのSecretsにFAL_KEYが登録されていません" && exit 1
          fi
          # モデル系統に応じてパラメータを組み立てる
          body=$(jq -n \
            --arg p "$PROMPT" \
            --arg ar "$ASPECT_RATIO" \
            --arg sz "$IMAGE_SIZE" \
            --arg iu "$IMAGE_URLS" \
            '{prompt: $p, num_images: 1}
             + (if $ar != "" then {aspect_ratio: $ar} else {} end)
             + (if $sz != "" then {image_size: $sz} else {} end)
             + (if $iu != "" then {image_urls: ($iu | split(",") | map(gsub("^\\s+|\\s+$"; "")))} else {} end)')
          echo "model: $MODEL"
          resp=$(curl -sS -X POST "https://fal.run/$MODEL" \
            -H "Authorization: Key $FAL_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          url=$(echo "$resp" | jq -r '.images[0].url // empty')
          if [ -z "$url" ]; then
            echo "::error::生成に失敗しました" && echo "$resp" | jq . && exit 1
          fi
          mkdir -p "$(dirname "$OUT_PATH")"
          curl -sS -o "$OUT_PATH" "$url"
          ls -la "$OUT_PATH"

      - name: コミットしてプッシュ
        env:
          OUT_PATH: ${{ inputs.path }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT_PATH"
          git commit -m "画像生成: $OUT_PATH" -m "model: $MODEL" -m "prompt: $PROMPT"
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 3; }; done
