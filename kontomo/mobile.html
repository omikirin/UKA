<script>
// 素材を差し替えたときに古い画像が出ないようにする
const CACHE_BUST='?v='+Date.now();
const BODIES=['stand','armscrossed','wave','heart'];
const EYES=['open','half','happy','smile','closed','cry','dot','angry'];
const EYE_LABEL={open:'ふつう',half:'半目',happy:'嬉しい',smile:'にっこり',
                 closed:'目閉じ',cry:'泣き',dot:'点目',angry:'怒り'};
const BODY_LABEL={stand:'素立ち',armscrossed:'腕組み',wave:'手振り',heart:'ハート'};
const MOUTHS=['n','a','i','u','e','o'];
const MOUTH_REF_W=149;
let P={mouth_w:0.11,mouth_y:0.80,mouth_dx:0,mouth_dy:0,neck_overlap:0.10,body_front:true,
       heads:{},bodies:{}};
const IM={};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let curBody='stand', curEyes='open', curMouth='n';

function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
async function preload(){
  for(const b of BODIES) IM['body_'+b]=await load(`parts/body_${b}.png${CACHE_BUST}`);
  for(const e of EYES)   IM['head_'+e]=await load(`parts/head_${e}.png${CACHE_BUST}`);
  for(const m of MOUTHS) IM['mouth_'+m]=await load(`parts_mouth/mouth_${m}.png${CACHE_BUST}`);
  try{const r=await fetch('rig_params.json'+CACHE_BUST); if(r.ok) Object.assign(P, await r.json());}catch(_){}
}
/** 素材をフルサイズで1枚のキャンバスに描く（透過のまま） */
function render(){
  const head=IM['head_'+curEyes], body=IM['body_'+curBody], mouth=IM['mouth_'+curMouth];
  if(!head||!body||!mouth) return null;
  const B=P.bodies[curBody]||{body_scale:1,body_dx:0,body_dy:0};
  const H=P.heads[curEyes]||{head_dx:0,head_dy:0};
  const bw=body.width*B.body_scale, bh=body.height*B.body_scale;
  const ms=head.width*P.mouth_w/MOUTH_REF_W;
  const mw=mouth.width*ms, mh=mouth.height*ms;
  const W=Math.max(bw,head.width)+120;
  const HT=head.height*(1-P.neck_overlap)+bh+40;
  const c=document.createElement('canvas'); c.width=Math.round(W); c.height=Math.round(HT);
  const g=c.getContext('2d');
  const bx0=(W-head.width)/2, by0=20;
  const hx=bx0+H.head_dx, hy=by0+H.head_dy;
  const bx=(W-bw)/2+B.body_dx, by=head.height*(1-P.neck_overlap)+20+B.body_dy;
  const drawHead=()=>g.drawImage(head,hx,hy,head.width,head.height);
  const drawBody=()=>g.drawImage(body,bx,by,bw,bh);
  if(P.body_front){drawHead();drawBody();}else{drawBody();drawHead();}
  g.drawImage(mouth, bx0+head.width/2-mw/2+P.mouth_dx,
              by0+head.height*P.mouth_y-mh/2+P.mouth_dy, mw, mh);
  return c;
}
/** 画面表示 */
function draw(){
  const c=render(); if(!c)return;
  const st=document.getElementById('stage');
  const maxH=Math.max(120, st.clientHeight-14);
  const maxW=Math.max(120, st.clientWidth-14);
  const k=Math.min(maxH/c.height, maxW/c.width);
  cv.width=Math.round(c.width*k); cv.height=Math.round(c.height*k);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(c,0,0,cv.width,cv.height);
}
/** 撮影: 背景・サイズ・寄りを適用して1枚に焼く */
function shoot(){
  const src=render(); if(!src)return null;
  const bgSel=document.getElementById('bg').value;
  const bg = bgSel==='custom' ? (document.getElementById('bgCustom').value||null)
           : (bgSel||null);
  const fit=document.getElementById('fit').value;
  // 寄り: 上からの割合で切り出す
  const crop = fit==='face' ? [0, 0, 1, 0.34]
             : fit==='bust' ? [0, 0, 1, 0.58]
             : [0,0,1,1];
  const sx=src.width*crop[0], sy=src.height*crop[1];
  const sw=src.width*crop[2], sh=src.height*crop[3];
  const sizeSel=document.getElementById('size').value;
  let W,HT;
  if(sizeSel==='0'){ W=Math.round(sw); HT=Math.round(sh); }
  else { const p=sizeSel.split('x'); W=+p[0]; HT=+p[1]; }
  const out=document.createElement('canvas'); out.width=W; out.height=HT;
  const g=out.getContext('2d');
  if(bg){ g.fillStyle=bg; g.fillRect(0,0,W,HT); }
  const k=Math.min(W/sw, HT/sh)*0.94;
  const dw=sw*k, dh=sh*k;
  g.imageSmoothingQuality='high';
  g.drawImage(src, sx,sy,sw,sh, (W-dw)/2, (HT-dh)/2, dw, dh);
  return out;
}
function save(canvas,name){
  canvas.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name; a.click();
  },'image/png');
}
document.getElementById('snap').onclick=()=>{
  const c=shoot(); if(!c)return;
  save(c, `こんとも_${curBody}_${curEyes}_${curMouth}.png`);
  document.getElementById('stat').textContent=`保存: ${curBody}／${EYE_LABEL[curEyes]}／口${curMouth}`;
};
document.getElementById('snapAll').onclick=async()=>{
  const st=document.getElementById('stat');
  const keepB=curBody, keepE=curEyes, keepM=curMouth;
  let n=0;
  for(const b of BODIES) for(const e of EYES){
    curBody=b; curEyes=e; curMouth='n';
    const c=shoot(); if(!c)continue;
    save(c, `こんとも_${b}_${e}.png`); n++;
    st.textContent=`一括保存中… ${n}/${BODIES.length*EYES.length}`;
    await new Promise(r=>setTimeout(r,220));
  }
  curBody=keepB; curEyes=keepE; curMouth=keepM; draw();
  st.textContent=`一括保存 完了（${n}枚）`;
};
function applyBg(){
  const v=document.getElementById('bg').value;
  document.getElementById('bgCustom').style.display = v==='custom'?'':'none';
  const col = v==='custom' ? (document.getElementById('bgCustom').value||'') : v;
  const el=document.getElementById('shot');
  if(col){ el.style.background=col; }
  else { el.style.background='repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/24px 24px'; }
}
document.getElementById('bg').onchange=applyBg;
document.getElementById('bgCustom').oninput=applyBg;

// ── かな→母音
const KANA={あ:'a',い:'i',う:'u',え:'e',お:'o',ん:'n'};
function kanaToVowels(s){
  const out=[];
  const t=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const R=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ',
           'まみむめも','やゆよ','らりるれろ','わをん','がぎぐげご','ざじずぜぞ',
           'だぢづでど','ばびぶべぼ','ぱぴぷぺぽ'];
  for(const ch of t){
    if(ch==='ー'){ if(out.length)out.push(out[out.length-1]); continue; }
    if(ch==='っ') continue;
    if(ch in KANA){ out.push(KANA[ch]); continue; }
    let f=null;
    for(const row of R){const i=row.indexOf(ch);
      if(i>=0){f='aiueo'[row.length===3?[0,2,4][i]:i];break;}}
    if(!f){const sm='ゃゅょぁぃぅぇぉ'; const j=sm.indexOf(ch);
      if(j>=0)f=['a','u','o','a','i','u','e','o'][j];}
    if(f)out.push(f);
    else if(/[、。！？\s]/.test(ch)) out.push('n');
  }
  return out;
}
function refreshVowels(){
  const v=kanaToVowels(document.getElementById('text').value);
  document.getElementById('vowels').textContent=v.length?v.join(' '):'（母音が取れません）';
  return v;
}
document.getElementById('text').oninput=refreshVowels;
document.getElementById('rate').oninput=e=>document.getElementById('rateV').textContent=e.target.value;
document.getElementById('blinkSpd').oninput=e=>document.getElementById('blinkV').textContent=e.target.value;
document.getElementById('blinkGap').oninput=e=>document.getElementById('gapV').textContent=e.target.value;

// ── 目ぱち
let blinkT=null;
function startBlink(){
  stopBlink();
  const tick=()=>{
    if(!document.getElementById('blink').checked){blinkT=setTimeout(tick,1200);return;}
    const sp=+document.getElementById('blinkSpd').value/4;
    ['half','closed','half','open'].forEach((e,i)=>setTimeout(()=>{curEyes=e;syncSel();draw();},i*sp));
    const gap=+document.getElementById('blinkGap').value*1000;
    blinkT=setTimeout(tick, gap*0.6+Math.random()*gap*0.8);
  };
  blinkT=setTimeout(tick,900);
}
function stopBlink(){if(blinkT){clearTimeout(blinkT);blinkT=null;}}

// ── 再生
let timers=[], audioEl=null, raf=null, cueData=null, ac=null, analyser=null;
function clearAll(){timers.forEach(clearTimeout);timers=[];if(raf)cancelAnimationFrame(raf);raf=null;
  if(audioEl){audioEl.pause();audioEl.currentTime=0;} curMouth='n'; syncSel(); draw();}
document.getElementById('stop').onclick=()=>{clearAll();stopBlink();};
document.getElementById('play').onclick=()=>{
  clearAll(); startBlink();
  if(audioEl&&cueData) playCues();
  else if(audioEl) playAmp();
  else playText();
};
function playText(){
  const v=refreshVowels(), r=+document.getElementById('rate').value;
  v.forEach((vv,i)=>timers.push(setTimeout(()=>{curMouth=vv;syncSel();draw();},i*r)));
  timers.push(setTimeout(()=>{curMouth='n';syncSel();draw();}, v.length*r+120));
}
function playCues(){
  audioEl.currentTime=0; audioEl.play(); let i=0;
  const step=()=>{
    const t=audioEl.currentTime;
    while(i<cueData.cues.length && cueData.cues[i].t<=t){curMouth=cueData.cues[i].v;i++;syncSel();draw();}
    if(!audioEl.paused) raf=requestAnimationFrame(step); else {curMouth='n';syncSel();draw();}
  };
  raf=requestAnimationFrame(step);
}
function playAmp(){
  /* 音は<audio>がそのまま鳴らす。口は事前計算した音量カーブで動かす */
  audioEl.currentTime=0; audioEl.play();
  const step=()=>{
    const m=mouthFromEnv(audioEl.currentTime);
    if(m!==curMouth){curMouth=m;syncSel();draw();}
    if(!audioEl.paused) raf=requestAnimationFrame(step); else {curMouth='n';syncSel();draw();}
  };
  raf=requestAnimationFrame(step);
}
document.getElementById('audio').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  if(!audioEl) audioEl=new Audio();
  audioEl.src=URL.createObjectURL(f); audioEl.load();
  markSource(f); cuesSave.disabled=true;
  document.getElementById('stat').textContent='音声を読み込みました: '+f.name;};
document.getElementById('cues').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  f.text().then(t=>{cueData=JSON.parse(t);
    document.getElementById('stat').textContent=`タイミング: ${cueData.cues.length}キュー / ${cueData.duration}秒`;});};

// ── マイクで録音（録ったらそのまま口パクの音源になる）
let micRec=null, micChunks=[], micBlob=null, micStream=null, micStart=0, micTick=null;
const recBtn=document.getElementById('recBtn'), recSave=document.getElementById('recSave'),
      recStat=document.getElementById('recStat');
function micType(){
  return ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']
    .find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
recBtn.onclick=async()=>{
  if(micRec && micRec.state==='recording'){ micRec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    recStat.style.display=''; recStat.textContent='このブラウザではマイク録音が使えません。'; return; }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    recStat.style.display='';
    recStat.textContent='マイクが使えませんでした（許可されていないか、httpsでない可能性）。';
    return;
  }
  micChunks=[];
  const mt=micType();
  micRec=new MediaRecorder(micStream, mt?{mimeType:mt}:undefined);
  micRec.ondataavailable=ev=>{ if(ev.data && ev.data.size) micChunks.push(ev.data); };
  micRec.onstop=()=>{
    clearInterval(micTick);
    micStream.getTracks().forEach(t=>t.stop());
    micBlob=new Blob(micChunks,{type:micChunks[0]?micChunks[0].type:(mt||'audio/webm')});
    if(!audioEl) audioEl=new Audio();
    audioEl.src=URL.createObjectURL(micBlob); audioEl.load();
    cueData=null; // 録り直したらタイミングJSONは外す（音量で口が動く）
    markSource(micBlob);
    cuesSave.disabled=true;
    recBtn.textContent='● マイクで録音';
    recSave.disabled=false;
    const sec=((Date.now()-micStart)/1000).toFixed(1);
    recStat.style.display='';
    recStat.textContent=`録音しました（${sec}秒）。「▶ 喋る」で口が動きます。`;
    document.getElementById('stat').textContent='音声を読み込みました: マイク録音';
  };
  micRec.start();
  micStart=Date.now();
  recBtn.textContent='■ 録音を止める';
  recSave.disabled=true;
  recStat.style.display='';
  micTick=setInterval(()=>{
    recStat.textContent='録音中… '+((Date.now()-micStart)/1000).toFixed(1)+'秒';
  },100);
};
// ── 録音した音声の「喋っている区間」に、上の台本の母音を割り当てる
//    (whisperを使わずブラウザだけで、audio_to_vowels.py と同じ考え方をやる)
const fitBtn=document.getElementById('fitBtn'), cuesSave=document.getElementById('cuesSave');
let lastSrcBlob=null; // マイク録音でもファイル選択でも、解析対象の音
let audioBuf=null;    // デコード済みの音(録画・口パク解析用)
let envelope=null, ENV_HOP=0.05, envMax=0; // 50msごとの音量カーブ

async function decodeBlob(b){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ctx.decodeAudioData(await b.arrayBuffer());
  ctx.close();
  return buf;
}
/* 音量カーブを事前計算しておく。再生中はこれを読むだけで口が動く
   (ブラウザのリアルタイム解析経路に依存しない) */
function buildEnvelope(buf){
  const ch=buf.getChannelData(0), sr=buf.sampleRate;
  const hop=Math.max(1,Math.round(sr*ENV_HOP));
  const env=[];
  for(let i=0;i<ch.length;i+=hop){
    let ss=0; const end=Math.min(i+hop,ch.length);
    for(let j=i;j<end;j++) ss+=ch[j]*ch[j];
    env.push(Math.sqrt(ss/Math.max(1,end-i)));
  }
  envelope=env; envMax=Math.max(...env,1e-6);
}
function mouthFromEnv(t){
  if(!envelope) return 'n';
  const v=(envelope[Math.floor(t/ENV_HOP)]||0)/envMax;
  if(v<0.14) return 'n';
  return ['i','e','a','a'][Math.min(3,Math.floor(v*3.2))];
}
async function markSource(b){
  lastSrcBlob=b; fitBtn.disabled=!b;
  audioBuf=null; envelope=null;
  if(!b) return;
  try{ audioBuf=await decodeBlob(b); buildEnvelope(audioBuf); }catch(_){}
}
/* 音量の起伏から発話区間を切り出す */
function voicedSegments(buf){
  const ch=buf.getChannelData(0), sr=buf.sampleRate;
  const win=Math.max(1,Math.round(sr*0.02));           // 20msごと
  const rms=[];
  for(let i=0;i<ch.length;i+=win){
    let s=0; const end=Math.min(i+win,ch.length);
    for(let j=i;j<end;j++) s+=ch[j]*ch[j];
    rms.push(Math.sqrt(s/Math.max(1,end-i)));
  }
  const peak=Math.max(...rms);
  if(!(peak>0)) return {segs:[],dur:buf.duration};
  const sorted=[...rms].sort((a,b)=>a-b);
  const noise=sorted[Math.floor(sorted.length*0.2)]||0;  // 下位20%を無音の目安に
  const th=Math.max(noise*2.2, peak*0.10);
  const segs=[]; let st=null;
  for(let k=0;k<rms.length;k++){
    const t=k*win/sr;
    if(rms[k]>=th){ if(st===null) st=t; }
    else if(st!==null){
      if(t-st>=0.08) segs.push({start:st,end:t});       // 80ms未満は雑音として捨てる
      st=null;
    }
  }
  if(st!==null) segs.push({start:st,end:rms.length*win/sr});
  // 無音がほとんどない録音（ずっと喋りっぱなし等）でも空にしない
  if(!segs.length) segs.push({start:0,end:buf.duration});
  // 120ms以内の切れ目はつなぐ
  const merged=[];
  for(const s of segs){
    const last=merged[merged.length-1];
    if(last && s.start-last.end<0.12) last.end=s.end;
    else merged.push({...s});
  }
  return {segs:merged,dur:buf.duration};
}
function buildCues(segs,vowels,dur){
  const cues=[], lead=0.04, closeGap=0.25;
  const total=segs.reduce((a,s)=>a+(s.end-s.start),0);
  const per=total/Math.max(1,vowels.length);
  let idx=0;
  for(const s of segs){
    const cnt=Math.max(1,Math.round((s.end-s.start)/per));
    for(let k=0;k<cnt && idx<vowels.length;k++){
      const t=s.start+(s.end-s.start)*k/cnt;
      cues.push({t:+Math.max(0,t-lead).toFixed(3), v:vowels[idx++]});
    }
  }
  let prev=0;
  for(const s of segs){
    if(s.start-prev>=closeGap) cues.push({t:+prev.toFixed(3), v:'n'});
    prev=s.end;
  }
  cues.push({t:+prev.toFixed(3), v:'n'});
  cues.sort((a,b)=>a.t-b.t);
  return {audio:'(ブラウザで作成)', duration:+dur.toFixed(3), cues};
}
fitBtn.onclick=async()=>{
  if(!lastSrcBlob) return;
  const vowels=refreshVowels();
  if(!vowels.length){
    recStat.style.display='';
    recStat.textContent='台本の母音が取れません。上の欄にひらがな・カタカナで台本を入れてください。';
    return;
  }
  recStat.style.display='';
  recStat.textContent='音声を解析しています…';
  try{
    if(!audioBuf){ audioBuf=await decodeBlob(lastSrcBlob); buildEnvelope(audioBuf); }
    const {segs,dur}=voicedSegments(audioBuf);
    if(!segs.length){
      recStat.textContent='喋っている区間が見つかりませんでした。音量を上げて録り直してみてください。';
      return;
    }
    cueData=buildCues(segs,vowels,dur);
    cuesSave.disabled=false;
    recStat.textContent=
      `台本を合わせました（発話${segs.length}区間 / ${cueData.cues.length}キュー / ${cueData.duration}秒）。「▶ 喋る」で確認。`;
    document.getElementById('stat').textContent=
      `タイミング: ${cueData.cues.length}キュー / ${cueData.duration}秒`;
  }catch(err){
    recStat.textContent='音声を解析できませんでした（対応していない形式かもしれません）。';
  }
};
cuesSave.onclick=()=>{
  if(!cueData) return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(cueData,null,1)],{type:'application/json'}));
  a.download='こんとも_タイミング_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

recSave.onclick=()=>{
  if(!micBlob) return;
  const ext=(micBlob.type.indexOf('mp4')>=0)?'m4a':(micBlob.type.indexOf('ogg')>=0?'ogg':'webm');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(micBlob);
  a.download='こんとも_録音_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.'+ext;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

// ── 生成済みタイミングJSON（kontomo/cues/）があれば選べるように
(async()=>{
  try{
    const r=await fetch('cues/index.json',{cache:'no-store'});
    if(!r.ok) return;
    const list=await r.json();
    if(!Array.isArray(list) || !list.length) return;
    const sel=document.getElementById('cuesPick');
    sel.innerHTML='<option value="">タイミングJSON: 選ぶ</option>'+
      list.map(f=>`<option value="${f}">${f}</option>`).join('');
    sel.style.display='';
    sel.onchange=async()=>{
      if(!sel.value){ cueData=null; return; }
      const rr=await fetch('cues/'+sel.value,{cache:'no-store'});
      cueData=await rr.json();
      document.getElementById('stat').textContent=
        `タイミング: ${cueData.cues.length}キュー / ${cueData.duration}秒`;
    };
  }catch(_){}
})();

// ── 動画出力
let rec=null, chunks=[], recTimer=null;
document.getElementById('recMax').oninput=e=>document.getElementById('recMaxV').textContent=e.target.value;
(()=>{ // このブラウザで何が録れるか表示しておく
  const ok=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.42E01E',
            'video/mp4;codecs=avc1'].some(m=>MediaRecorder.isTypeSupported(m));
  document.getElementById('codec').textContent =
    ok ? '（このブラウザは mp4(H.264) で直接書き出せます）'
       : '（このブラウザは mp4 に非対応なので webm で保存します。webmはそのままSNS投稿・編集ソフト読み込みができます）';
})();
document.getElementById('rec').onclick=()=>{
  const sizeSel=document.getElementById('size').value;
  const probe=shoot(); if(!probe)return;
  const W=probe.width, HT=probe.height;
  const rc=document.createElement('canvas'); rc.width=W; rc.height=HT;
  const g=rc.getContext('2d');
  const stream=rc.captureStream(30);
  // 音声も混ぜる: デコード済みの音(audioBuf)をファイルへ直接流し込む。
  // <audio>要素の経路は環境によって録画に音が乗らないため使わない。
  let audioIn=false, recSrc=null;
  if(audioBuf){
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const dest=ac.createMediaStreamDestination();
      recSrc=ac.createBufferSource();
      recSrc.buffer=audioBuf;
      recSrc.connect(dest);           // ファイルへ
      recSrc.connect(ac.destination); // モニター(耳)へ
      dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
      audioIn = stream.getAudioTracks().length>0;
    }catch(_){ recSrc=null; }
  }
  chunks=[];
  // mp4 が録れるならmp4。ダメならwebmへ落とす
  // mp4を名乗っても中身がVP9/Opusだと多くのプレイヤーで開けないので、
  // H.264(avc1)が本当に使えるときだけmp4。それ以外はwebmにする。
  // 音を入れるときは、音声コーデックまで指定した候補だけを使う。
  // (映像だけのコーデック指定が選ばれると、音声トラックを足していても捨てられて無音になる)
  const WITH_AUDIO=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2',
                    'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const VIDEO_ONLY=['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1',
                    'video/webm;codecs=vp9','video/webm'];
  const CAND = audioIn ? WITH_AUDIO : VIDEO_ONLY;
  const mime = CAND.find(m=>MediaRecorder.isTypeSupported(m)) || '';
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8_000_000});
  const actual = rec.mimeType || mime || '';
  const ext = (actual.startsWith('video/mp4') && /avc1/.test(actual)) ? 'mp4' : 'webm';
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
    if(recSrc){ try{recSrc.stop();}catch(_){} recSrc=null; }
    const b=new Blob(chunks,{type:actual||'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=`こんとも_${curBody}.${ext}`; a.click();
    document.getElementById('stat').textContent=
      `${ext.toUpperCase()} を保存（${(b.size/1e6).toFixed(1)}MB）${audioIn?'／音つき':'／音なし'}`;
    document.getElementById('rec').disabled=false;
    document.getElementById('recStop').disabled=true;
  };
  // 毎フレーム描き込む
  const pump=()=>{
    if(!rec||rec.state!=='recording')return;
    const c=shoot(); if(c){g.clearRect(0,0,W,HT); g.drawImage(c,0,0,W,HT);}
    requestAnimationFrame(pump);
  };
  rec.start(); pump();
  document.getElementById('rec').disabled=true;
  document.getElementById('recStop').disabled=false;
  document.getElementById('stat').textContent='録画中…'+(audioIn?'（音あり）':'（音なし）');
  if(recSrc){
    // 音つき録画: バッファ音源の時計に合わせて口を動かす
    clearAll(); startBlink();
    recSrc.start();
    const t0=ac.currentTime;
    let ci=0;
    const act=()=>{
      if(!rec||rec.state!=='recording'){curMouth='n';syncSel();draw();return;}
      const t=ac.currentTime-t0;
      if(cueData){
        while(ci<cueData.cues.length && cueData.cues[ci].t<=t){curMouth=cueData.cues[ci].v;ci++;}
        syncSel();draw();
      }else{
        const m=mouthFromEnv(t);
        if(m!==curMouth){curMouth=m;syncSel();draw();}
      }
      requestAnimationFrame(act);
    };
    requestAnimationFrame(act);
  }else{
    document.getElementById('play').click();
  }
  const lim=+document.getElementById('recMax').value*1000;
  recTimer=setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop();}, lim);
};
document.getElementById('recStop').onclick=()=>{
  if(recTimer)clearTimeout(recTimer);
  if(rec&&rec.state==='recording')rec.stop();
};

// ── UI
function syncSel(){
  document.getElementById('eyes').value=curEyes;
  document.getElementById('mouth').value=curMouth;
}
const bs=document.getElementById('body');
BODIES.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent='ポーズ: '+BODY_LABEL[b];bs.appendChild(o);});
bs.onchange=()=>{curBody=bs.value;draw();};
const es=document.getElementById('eyes');
EYES.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent='表情: '+EYE_LABEL[e];es.appendChild(o);});
es.onchange=()=>{curEyes=es.value;draw();};
const ms=document.getElementById('mouth');
MOUTHS.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent='口: '+m;ms.appendChild(o);});
ms.onchange=()=>{curMouth=ms.value;draw();};
window.addEventListener('resize',draw);
preload().then(()=>{
  refreshVowels(); draw(); startBlink();
  document.getElementById('stat').textContent='準備できました（スマホ版 v1）';
});
</script>

    document.querySelectorAll('#panel .tab').forEach(t=>t.classList.toggle('on', t.id==='tab-'+b.dataset.tab));
    draw();
  });
